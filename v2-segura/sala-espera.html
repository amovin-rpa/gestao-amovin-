<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • Sala de Espera</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11;
  --amarelo: #F5C518;
  --verde: #57C220;
  --azul: #1E88E5;
  --grafite: #1A1A1A;
  --cinza: #6B7280;
  --cinza-claro: #F8F4ED;
  --branco: #FFFFFF;
  --vermelho: #E53935;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

/* ============================================================
   A SIDEBAR FOI REMOVIDA DAQUI - VEM DO menu.js
   ============================================================ */

.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
.kpi-card { background: #FFFFFF; padding: 16px; border-radius: 14px; border: 1px solid #F0E9DF; text-align: center; }
.kpi-card .kpi-valor { font-size: 24px; font-weight: 800; color: var(--laranja); }
.kpi-card .kpi-label { font-size: 11px; color: var(--cinza); }

.pendente-card { background: #FFFFFF; padding: 16px 20px; border-radius: 12px; border: 1px solid #F0E9DF; margin-bottom: 8px; border-left: 4px solid #F5C518; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.pendente-info h4 { font-size: 14px; color: var(--grafite); margin-bottom: 2px; }
.pendente-info p { font-size: 11px; color: var(--cinza); }
.btn-acao { padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 10px; font-weight: 600; }
.btn-aprovar { background: var(--verde); color: white; }
.btn-reprovar { background: var(--vermelho); color: white; }
.sem-dados { text-align: center; padding: 40px; color: #9CA3AF; }

.rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
.rodape-grid { display: flex; align-items: center; gap: 12px; }
.rodape-logo { flex-shrink: 0; } .rodape-logo .logo-vigorre { width: 50px; }
.rodape-info { flex: 1; } .rodape-info .copyright { font-size: 8px; color: #8A8F98; } .rodape-info .tm { font-size: 6px; vertical-align: super; }
.rodape-info .contato { font-size: 9px; color: #8A8F98; } .rodape-info a { color: #C65A11; text-decoration: none; } .rodape-info .email { font-size: 8px; color: #aaa; }
.logo-vigorre-fallback { font-size: 12px; font-weight: 700; display: none; }

@media (max-width: 900px) { .main-content { margin-left: 0; } }
</style>
</head>
<body>

<!-- O MENU SERÁ CARREGADO PELO menu.js -->

<main class="main-content">
  <div class="topo-bar">
    <h1>📋 Sala de Espera</h1>
    <button class="btn-sair-topo" onclick="window.location.href='index.html'">🚪 Sair</button>
  </div>

  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-valor" id="kpiTotal">0</div><div class="kpi-label">Total</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiPendentes">0</div><div class="kpi-label">⏳ Pendentes</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiAprovados">0</div><div class="kpi-label">✅ Aprovados</div></div>
  </div>

  <div id="listaPendentes"><div class="sem-dados">Nenhum pré-cadastro pendente.</div></div>

  <div class="rodape">
    <div class="rodape-grid">
      <div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-vigorre-fallback">Vigorre</span></div>
      <div class="rodape-info">
        <div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span></div>
        <div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div>
        <div class="email">contato@vigorre.com.br</div>
      </div>
    </div>
  </div>
</main>

<script src="menu.js"></script>
<script>
// ============================================================
// BANCO DE DADOS LOCAL
// ============================================================

// Tenta carregar do localStorage ou inicia vazio
var preCadastros = JSON.parse(localStorage.getItem('amovin_pre_cadastros') || '[]');

// Dados de exemplo se estiver vazio
if (preCadastros.length === 0) {
    preCadastros = [
        {
            id: 1,
            nome: 'João Silva',
            tipo: 'beneficiario',
            cpf: '123.456.789-00',
            telefone: '(34) 99999-1111',
            email: 'joao@email.com',
            cidade: 'Rio Paranaíba',
            estado: 'MG',
            responsavel: 'Mãe do beneficiário João Silva',
            dataCadastro: new Date().toISOString(),
            status: 'pendente'
        },
        {
            id: 2,
            nome: 'Maria Oliveira',
            tipo: 'profissional',
            cpf: '987.654.321-00',
            telefone: '(34) 99999-2222',
            email: 'maria@email.com',
            cidade: 'Rio Paranaíba',
            estado: 'MG',
            responsavel: '',
            dataCadastro: new Date().toISOString(),
            status: 'pendente'
        }
    ];
    localStorage.setItem('amovin_pre_cadastros', JSON.stringify(preCadastros));
}

function salvar() {
    localStorage.setItem('amovin_pre_cadastros', JSON.stringify(preCadastros));
}

function formatarData(data) {
    if (!data) return '-';
    var d = new Date(data);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function getTipoLabel(tipo) {
    var map = {
        'beneficiario': '👥 Beneficiário',
        'profissional': '👨‍⚕️ Profissional',
        'voluntario': '💪 Voluntário'
    };
    return map[tipo] || tipo;
}

function atualizarKPIs() {
    var total = preCadastros.length;
    var pendentes = preCadastros.filter(function(p) { return p.status === 'pendente'; }).length;
    var aprovados = preCadastros.filter(function(p) { return p.status === 'aprovado'; }).length;
    
    document.getElementById('kpiTotal').textContent = total;
    document.getElementById('kpiPendentes').textContent = pendentes;
    document.getElementById('kpiAprovados').textContent = aprovados;
}

function renderizarLista() {
    var pendentes = preCadastros.filter(function(p) { return p.status === 'pendente'; });
    var container = document.getElementById('listaPendentes');
    
    if (pendentes.length === 0) {
        container.innerHTML = '<div class="sem-dados">✅ Nenhum pré-cadastro pendente.</div>';
        return;
    }
    
    container.innerHTML = pendentes.map(function(p) {
        return '<div class="pendente-card">' +
            '<div class="pendente-info">' +
            '<h4>' + p.nome + ' <span style="font-size:11px;color:#6B7280;">' + getTipoLabel(p.tipo) + '</span></h4>' +
            '<p>📞 ' + (p.telefone || 'N/A') + ' | 📧 ' + (p.email || 'N/A') + '</p>' +
            '<p>📍 ' + (p.cidade || '') + (p.estado ? '/' + p.estado : '') + ' | 📅 ' + formatarData(p.dataCadastro) + '</p>' +
            (p.responsavel ? '<p>👤 Responsável: ' + p.responsavel + '</p>' : '') +
            '</div>' +
            '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
            '<button class="btn-acao btn-aprovar" onclick="aprovar(' + p.id + ')">✅ Aprovar</button>' +
            '<button class="btn-acao btn-reprovar" onclick="reprovar(' + p.id + ')">❌ Reprovar</button>' +
            '</div>' +
            '</div>';
    }).join('');
    
    atualizarKPIs();
}

window.aprovar = function(id) {
    if (!confirm('Aprovar este cadastro?')) return;
    
    var p = preCadastros.find(function(item) { return item.id === id; });
    if (p) {
        p.status = 'aprovado';
        p.dataAprovacao = new Date().toISOString();
        salvar();
        renderizarLista();
        alert('✅ ' + p.nome + ' foi aprovado com sucesso!');
    }
};

window.reprovar = function(id) {
    var motivo = prompt('Motivo da reprovação:');
    if (motivo === null) return;
    
    var p = preCadastros.find(function(item) { return item.id === id; });
    if (p) {
        p.status = 'reprovado';
        p.motivoReprovacao = motivo;
        salvar();
        renderizarLista();
        alert('❌ ' + p.nome + ' foi reprovado.');
    }
};

// ============================================================
// INICIALIZAÇÃO
// ============================================================
renderizarLista();

// ============================================================
// CONTROLE DE PERFIL
// ============================================================
var perfil = sessionStorage.getItem('amovin_perfil') || 'admin';
var modulosPermitidos = {
    admin: ['dashboard','bi','capta','sala-espera','pre-cadastro','financeiro','orcamentos','prestacao-contas','pessoas','profissionais','voluntarios','agenda-telefonica','agenda','documentos','qrcodes','notas-fiscais','estoque','patrimonio','biblioteca','certificados','chat','assistente','relatorios','configuracoes','backup'],
    recepcao: ['dashboard','pessoas','agenda-telefonica','agenda','documentos'],
    consulta: ['dashboard','agenda','agenda-telefonica','assistente'],
    financeiro: ['dashboard','financeiro','orcamentos','prestacao-contas','relatorios'],
    voluntario: ['dashboard','agenda','voluntarios','agenda-telefonica']
};

var permitidos = modulosPermitidos[perfil] || modulosPermitidos.admin;
document.querySelectorAll('.nav-item').forEach(function(item) {
    var href = item.getAttribute('href') || '';
    var pagina = href.replace('.html', '');
    pagina = pagina.split('?')[0].split('#')[0];
    if (pagina && permitidos.indexOf(pagina) === -1 && pagina !== 'dashboard' && pagina !== '') {
        item.style.display = 'none';
    }
});

if (!sessionStorage.getItem('amovin_logado')) {
    window.location.href = 'index.html';
}
</script>
</body>
</html>
