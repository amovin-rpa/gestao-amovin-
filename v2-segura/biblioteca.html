<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • Biblioteca</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11;
  --amarelo: #F5C518;
  --verde: #57C220;
  --azul: #1E88E5;
  --grafite: #1A1A1A;
  --cinza: #6B7280;
  --cinza-claro: #F8F4ED;
  --branco: #FFFFFF;
  --vermelho: #E53935;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

/* ==================== SIDEBAR (vem do menu.js) ==================== */
.sidebar { width: 270px; background: #FFFFFF; color: #1A1A1A; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; border-right: 1px solid #F0E9DF; box-shadow: 0 0 20px rgba(0,0,0,0.03); }
.sidebar-header { padding: 28px 24px 24px; text-align: center; border-bottom: 1px solid #F0E9DF; }
.sidebar-logo-img { width: 80px; height: auto; margin-bottom: 8px; display: block; margin-left: auto; margin-right: auto; }
.sidebar-logo-fallback { font-size: 48px; margin-bottom: 8px; display: none; }
.sidebar-header .brand { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; font-weight: 700; color: #1A1A1A; letter-spacing: -0.4px; }
.sidebar-nav { flex: 1; padding: 16px 0; overflow-y: auto; }
.nav-categoria { padding: 16px 24px 6px; font-size: 10px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 1.5px; }
.nav-item { display: flex; align-items: center; gap: 13px; padding: 11px 24px; color: #4B5563; text-decoration: none; font-size: 13.5px; font-weight: 500; transition: all 0.2s ease; border-left: 3px solid transparent; }
.nav-item:hover { background: #FFF8E7; color: #C65A11; border-left-color: #F5C518; }
.nav-item.ativo { background: #FFF3E0; color: #C65A11; border-left-color: #C65A11; font-weight: 600; }
.nav-item .icone { font-size: 17px; width: 24px; text-align: center; }
.sidebar-footer { padding: 20px 24px; border-top: 1px solid #F0E9DF; }
.user-card { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.user-avatar { width: 38px; height: 38px; background: #F5C518; color: #1A1A1A; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
.user-info .nome { font-weight: 600; font-size: 13.5px; }
.user-info .cargo { font-size: 11px; color: #6B7280; }
.btn-sair { width: 100%; padding: 9px; background: #F8F4ED; color: #1A1A1A; border: none; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-sair:hover { background: #F0E9DF; }

/* ==================== MAIN CONTENT ==================== */
.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

.grid-biblioteca { display: grid; grid-template-columns: 260px 1fr; gap: 20px; }
.sidebar-cat { background: #FFFFFF; border-radius: 14px; border: 1px solid #F0E9DF; padding: 20px; max-height: 600px; overflow-y: auto; }
.sidebar-cat h3 { font-size: 15px; font-weight: 700; color: var(--grafite); margin-bottom: 14px; }
.cat-item { display: block; width: 100%; padding: 9px 14px; margin-bottom: 3px; border: none; border-radius: 8px; cursor: pointer; text-align: left; font-size: 12px; background: transparent; transition: all 0.2s; color: var(--cinza); font-family: 'Inter', sans-serif; }
.cat-item:hover { background: #F8F4ED; }
.cat-item.ativo { background: var(--laranja); color: white; font-weight: 600; }
.cat-item .count { float: right; opacity: 0.7; font-size: 10px; }

.header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
.btn-novo { padding: 10px 20px; background: var(--laranja); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
.busca-bar { margin-bottom: 15px; }
.busca-bar input { width: 100%; padding: 10px 14px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; }

.docs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.doc-card { background: #FFFFFF; padding: 20px; border-radius: 12px; border: 1px solid #F0E9DF; border-left: 4px solid var(--laranja); transition: transform 0.2s; }
.doc-card:hover { transform: translateY(-2px); }
.doc-card .doc-icone { font-size: 32px; margin-bottom: 8px; }
.doc-card h4 { font-size: 14px; color: var(--grafite); margin-bottom: 4px; }
.doc-card p { font-size: 11px; color: var(--cinza); margin: 2px 0; }
.doc-tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 600; margin: 2px; }
.tag-certidao { background: #E3F2FD; color: #1565C0; }
.tag-ata { background: #F3E5F5; color: #7B1FA2; }
.tag-estatuto { background: #FFF3E0; color: #E65100; }
.tag-licenca { background: #E8F5E9; color: #2E7D32; }
.tag-outros { background: #F5F5F5; color: #666; }
.btn-acao { padding: 5px 10px; border-radius: 5px; border: none; cursor: pointer; font-size: 10px; font-weight: 600; margin: 2px; }
.btn-download { background: var(--azul); color: white; }
.btn-editar { background: var(--amarelo); color: #1A1A1A; }
.btn-excluir { background: var(--vermelho); color: white; }
.sem-dados { text-align: center; padding: 40px; color: #9CA3AF; grid-column: 1 / -1; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: white; border-radius: 16px; width: 100%; max-width: 550px; max-height: 85vh; overflow-y: auto; }
.modal-header { padding: 18px 22px; border-bottom: 1px solid #F0E9DF; display: flex; justify-content: space-between; align-items: center; }
.modal-body { padding: 22px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--cinza); margin-bottom: 4px; text-transform: uppercase; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; }
.btn-salvar { width: 100%; padding: 14px; background: var(--laranja); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px; }
.btn-fechar { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--cinza); }

.rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
.rodape-grid { display: flex; align-items: center; gap: 12px; }
.rodape-logo { flex-shrink: 0; } .rodape-logo .logo-vigorre { width: 50px; }
.rodape-info { flex: 1; } .rodape-info .copyright { font-size: 8px; color: #8A8F98; } .rodape-info .tm { font-size: 6px; vertical-align: super; }
.rodape-info .contato { font-size: 9px; color: #8A8F98; } .rodape-info a { color: #C65A11; text-decoration: none; } .rodape-info .email { font-size: 8px; color: #aaa; }
.logo-vigorre-fallback { font-size: 12px; font-weight: 700; display: none; }

@media (max-width: 768px) { .sidebar { width: 100%; position: relative; } .main-content { margin-left: 0; } .grid-biblioteca { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- ==================== MENU LATERAL ==================== -->
<div id="menu-container"></div>

<main class="main-content">
  <div class="topo-bar"><h1>📚 Biblioteca Digital</h1><button class="btn-sair-topo" onclick="window.location.href='index.html'">🚪 Sair</button></div>

  <div class="grid-biblioteca">
    <div class="sidebar-cat"><h3>📂 Categorias</h3><div id="menuCategorias"></div></div>
    <div>
      <div class="header-actions"><h2 style="font-size:18px;color:var(--grafite);">Documentos</h2><button class="btn-novo" onclick="abrirForm()">+ Novo</button></div>
      <div class="busca-bar"><input type="text" id="buscaDoc" placeholder="Buscar por nome, descrição..." oninput="filtrar()"></div>
      <div class="docs-grid" id="listaDocs"><div class="sem-dados">Nenhum documento.</div></div>
    </div>
  </div>

  <div class="rodape"><div class="rodape-grid"><div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-vigorre-fallback">Vigorre</span></div><div class="rodape-info"><div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span></div><div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div><div class="email">contato@vigorre.com.br</div></div></div></div>
</main>

<div class="modal-overlay" id="modalForm" style="display:none;"><div class="modal"><div class="modal-header"><h3 id="tituloModal">Novo Documento</h3><button class="btn-fechar" onclick="fecharForm()">✕</button></div><div class="modal-body"><input type="hidden" id="docId">
  <div class="form-group"><label>Nome *</label><input type="text" id="nomeDoc"></div>
  <div class="form-group"><label>Categoria *</label><select id="categoriaDoc"><option>Certidão</option><option>Ata</option><option>Estatuto</option><option>Licença</option><option>Contrato</option><option>Convênio</option><option>Ofício Recebido</option><option>Relatório</option><option>Manual</option><option>Outros</option></select></div>
  <div class="form-group"><label>Descrição</label><textarea id="descricaoDoc" rows="2"></textarea></div>
  <div class="form-group"><label>Data</label><input type="date" id="dataDoc"></div>
  <div class="form-group"><label>Arquivo</label><input type="file" id="arquivoDoc"></div>
  <div class="form-group"><label>Tags</label><input type="text" id="tagsDoc"></div>
  <div class="form-group"><label>Observações</label><textarea id="obsDoc" rows="2"></textarea></div>
  <button class="btn-salvar" onclick="salvarDoc()">💾 Salvar</button>
</div></div></div>

<script src="menu.js"></script>
<script>
var documentos = JSON.parse(localStorage.getItem('amovin_documentos') || '[]');
var categoriaAtual = 'todos', editandoId = null;
if (documentos.length === 0) {
    documentos.push({id:1,nome:'Estatuto Social',categoria:'Estatuto',descricao:'Estatuto oficial',dataDoc:'2026-01-01',tags:'estatuto'});
    documentos.push({id:2,nome:'Certidão CNPJ',categoria:'Certidão',descricao:'Comprovante CNPJ',dataDoc:'2026-01-15',tags:'cnpj'});
    salvar();
}
function salvar() { localStorage.setItem('amovin_documentos',JSON.stringify(documentos)); }

function renderizarMenu() {
    var cats = {}; documentos.forEach(function(d){ cats[d.categoria] = (cats[d.categoria]||0)+1; });
    var h = '<button class="cat-item '+(categoriaAtual==='todos'?'ativo':'')+'" onclick="filtrarPorCat(\'todos\')">📋 Todos <span class="count">'+documentos.length+'</span></button>';
    Object.keys(cats).sort().forEach(function(c){ h += '<button class="cat-item '+(categoriaAtual===c?'ativo':'')+'" onclick="filtrarPorCat(\''+c+'\')">📄 '+c+' <span class="count">'+cats[c]+'</span></button>'; });
    document.getElementById('menuCategorias').innerHTML = h;
}
window.filtrarPorCat = function(c) { categoriaAtual = c; renderizarMenu(); filtrar(); };

function getTagClass(c) { if (c==='Certidão') return 'tag-certidao'; if (c==='Ata') return 'tag-ata'; if (c==='Estatuto') return 'tag-estatuto'; if (c==='Licença') return 'tag-licenca'; return 'tag-outros'; }

function filtrar() {
    var l = documentos.slice(); if (categoriaAtual!=='todos') l = l.filter(function(d){return d.categoria===categoriaAtual;});
    var b = document.getElementById('buscaDoc').value.toLowerCase(); if (b) l = l.filter(function(d){return (d.nome||'').toLowerCase().indexOf(b)>=0||(d.descricao||'').toLowerCase().indexOf(b)>=0||(d.tags||'').toLowerCase().indexOf(b)>=0;});
    l.sort(function(a,b){return new Date(b.dataDoc)-new Date(a.dataDoc);});
    var c = document.getElementById('listaDocs');
    c.innerHTML = l.length===0 ? '<div class="sem-dados">Nenhum documento.</div>' : l.map(function(d){return '<div class="doc-card"><div class="doc-icone">📄</div><span class="doc-tag '+getTagClass(d.categoria)+'">'+d.categoria+'</span><h4>'+d.nome+'</h4><p>'+(d.descricao||'')+'</p><p>📅 '+(d.dataDoc?new Date(d.dataDoc+'T00:00:00').toLocaleDateString('pt-BR'):'-')+'</p>'+(d.tags?'<p>🏷️ '+d.tags+'</p>':'')+'<div style="margin-top:8px;">'+(d.arquivo?'<button class="btn-acao btn-download" onclick="baixarDoc('+d.id+')">📥</button>':'')+'<button class="btn-acao btn-editar" onclick="abrirForm('+d.id+')">✏️</button><button class="btn-acao btn-excluir" onclick="excluirDoc('+d.id+')">🗑️</button></div></div>';}).join('');
}

window.abrirForm = function(id) {
    editandoId = id || null; document.getElementById('modalForm').style.display = 'flex';
    document.getElementById('tituloModal').textContent = id ? 'Editar' : 'Novo'; document.getElementById('arquivoDoc').value = '';
    if (id) { var d = documentos.find(function(x){return x.id===id;}); if (!d) return;
        document.getElementById('docId').value=d.id;document.getElementById('nomeDoc').value=d.nome;document.getElementById('categoriaDoc').value=d.categoria;document.getElementById('descricaoDoc').value=d.descricao||'';document.getElementById('dataDoc').value=d.dataDoc||'';document.getElementById('tagsDoc').value=d.tags||'';document.getElementById('obsDoc').value=d.obs||'';
    } else { document.getElementById('docId').value='';document.getElementById('nomeDoc').value='';document.getElementById('categoriaDoc').value='Certidão';document.getElementById('descricaoDoc').value='';document.getElementById('dataDoc').value=new Date().toISOString().split('T')[0];document.getElementById('tagsDoc').value='';document.getElementById('obsDoc').value=''; }
};
window.fecharForm = function() { document.getElementById('modalForm').style.display = 'none'; };
window.salvarDoc = function() {
    var n = document.getElementById('nomeDoc').value.trim(); if (!n) { alert('Nome obrigatório!'); return; }
    var d = { nome:n, categoria:document.getElementById('categoriaDoc').value, descricao:document.getElementById('descricaoDoc').value, dataDoc:document.getElementById('dataDoc').value, tags:document.getElementById('tagsDoc').value, obs:document.getElementById('obsDoc').value };
    var f = document.getElementById('arquivoDoc').files[0];
    if (f) { var r = new FileReader(); r.onload = function(e) { d.arquivo = e.target.result; d.arquivoNome = f.name; finalizar(d); }; r.readAsDataURL(f); }
    else { finalizar(d); }
};
function finalizar(d) {
    if (editandoId) { var i = documentos.findIndex(function(x){return x.id===editandoId;}); if (i>=0) for (var k in d) documentos[i][k]=d[k]; }
    else { d.id = Date.now(); documentos.push(d); }
    salvar(); fecharForm(); renderizarMenu(); filtrar();
}
window.baixarDoc = function(id) { var d = documentos.find(function(x){return x.id===id;}); if (!d||!d.arquivo) return; var a = document.createElement('a'); a.href = d.arquivo; a.download = d.arquivoNome||d.nome; a.click(); };
window.excluirDoc = function(id) { if (!confirm('Excluir?')) return; documentos = documentos.filter(function(x){return x.id!==id;}); salvar(); renderizarMenu(); filtrar(); };

// ============================================================
// VERIFICAÇÃO DE SESSÃO
// ============================================================
if (!sessionStorage.getItem('amovin_logado')) window.location.href = 'index.html';

renderizarMenu(); filtrar();
</script>
</body>
</html>
