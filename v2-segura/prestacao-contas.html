<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • Prestação de Contas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11;
  --amarelo: #F5C518;
  --verde: #57C220;
  --azul: #1E88E5;
  --grafite: #1A1A1A;
  --cinza: #6B7280;
  --cinza-claro: #F8F4ED;
  --branco: #FFFFFF;
  --vermelho: #E53935;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.topo-bar h1 span { font-size: 14px; font-weight: 400; color: var(--cinza); margin-left: 12px; }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 22px; }
.kpi-card { background: #FFFFFF; padding: 18px; border-radius: 14px; border: 1px solid #F0E9DF; text-align: center; }
.kpi-card .kpi-valor { font-size: 24px; font-weight: 800; color: var(--laranja); }
.kpi-card .kpi-label { font-size: 11px; color: var(--cinza); }

.grid-prestacao { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: #FFFFFF; padding: 24px; border-radius: 14px; border: 1px solid #F0E9DF; }
.card h3 { font-size: 16px; font-weight: 700; color: var(--grafite); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #F0E9DF; display: flex; justify-content: space-between; align-items: center; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--cinza); margin-bottom: 4px; text-transform: uppercase; }
.form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 12px; }
.btn-salvar { background: var(--laranja); color: white; }
.btn-editar { background: var(--amarelo); color: #1A1A1A; }
.btn-excluir { background: var(--vermelho); color: white; }
.btn-verde { background: var(--verde); color: white; }

.prestacao-item { padding: 12px 16px; border-bottom: 1px solid #F0E9DF; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
.prestacao-item .descricao { font-weight: 600; color: var(--grafite); font-size: 13px; }
.prestacao-item .valor { font-weight: 700; color: var(--verde); }
.prestacao-item .status { font-size: 10px; padding: 2px 10px; border-radius: 12px; font-weight: 600; }
.status-enviada { background: #E3F2FD; color: #1565C0; }
.status-aprovada { background: #E8F5E9; color: #2E7D32; }
.status-pendente { background: #FFF3E0; color: #E65100; }
.status-reprovada { background: #FFEBEE; color: #C62828; }
.prestacao-item .data { font-size: 11px; color: var(--cinza); }

.sem-dados { text-align: center; padding: 30px; color: #9CA3AF; }

.rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
.rodape-grid { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rodape-logo { flex-shrink: 0; } .rodape-logo .logo-vigorre { width: 50px; }
.rodape-info { flex: 1; } .rodape-info .copyright { font-size: 8px; color: #8A8F98; } .rodape-info .tm { font-size: 6px; vertical-align: super; }
.rodape-info .contato { font-size: 9px; color: #8A8F98; } .rodape-info a { color: #C65A11; text-decoration: none; } .rodape-info .email { font-size: 8px; color: #aaa; }
.logo-vigorre-fallback { font-size: 12px; font-weight: 700; display: none; }

@media (max-width: 900px) { .main-content { margin-left: 0; } .grid-prestacao { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="menu-container"></div>

<main class="main-content">
  <div class="topo-bar"><h1>📋 Prestação de Contas <span>Convênios, emendas e prestações</span></h1><button class="btn-sair-topo" onclick="window.location.href='dashboard.html'">🏠 Dashboard</button></div>

  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-valor" id="kpiTotal">0</div><div class="kpi-label">📋 Total</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiPendentes">0</div><div class="kpi-label">⏳ Pendentes</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiAprovadas">0</div><div class="kpi-label">✅ Aprovadas</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiValorTotal">R$ 0</div><div class="kpi-label">💰 Valor Total</div></div>
  </div>

  <div class="grid-prestacao">
    <div class="card">
      <h3>📝 Nova Prestação</h3>
      <input type="hidden" id="prestacaoId">
      <div class="form-group"><label>Projeto/Convênio *</label><input type="text" id="nomePrestacao" placeholder="Ex: Projeto Inclusão Digital"></div>
      <div class="form-group"><label>Tipo</label><select id="tipoPrestacao"><option>Convênio</option><option>Patrocínio</option><option>Emenda</option><option>Doação</option></select></div>
      <div class="form-row"><div class="form-group"><label>Valor (R$) *</label><input type="number" id="valorPrestacao" step="0.01" placeholder="0,00"></div><div class="form-group"><label>Data</label><input type="date" id="dataPrestacao"></div></div>
      <div class="form-group"><label>Status</label><select id="statusPrestacao"><option value="pendente">⏳ Pendente</option><option value="enviada">📤 Enviada</option><option value="aprovada">✅ Aprovada</option><option value="reprovada">❌ Reprovada</option></select></div>
      <div class="form-group"><label>Observações</label><input type="text" id="obsPrestacao" placeholder="Informações adicionais..."></div>
      <button class="btn btn-salvar" onclick="salvarPrestacao()" style="width:100%;padding:12px;font-size:14px;">💾 Salvar</button>
    </div>
    <div class="card">
      <h3>📋 Prestações</h3>
      <div id="listaPrestacoes"><div class="sem-dados">Nenhuma prestação.</div></div>
    </div>
  </div>

  <div class="rodape">
    <div class="rodape-grid">
      <div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-vigorre-fallback">Vigorre</span></div>
      <div class="rodape-info">
        <div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span> | Padrão SAP S/4HANA</div>
        <div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div>
        <div class="email">contato@vigorre.com.br</div>
      </div>
    </div>
  </div>
</main>

<script src="menu.js"></script>
<script>
var prestacoes = JSON.parse(localStorage.getItem('amovin_prestacao_contas') || '[]');
var editandoId = null;
if (prestacoes.length === 0) {
    prestacoes = [
        { id: 1, nome: 'Convênio - Prefeitura', tipo: 'Convênio', valor: 350000, data: new Date().toISOString().split('T')[0], status: 'aprovada', obs: '' },
        { id: 2, nome: 'Emenda - Dep. Federal X', tipo: 'Emenda', valor: 200000, data: new Date().toISOString().split('T')[0], status: 'pendente', obs: 'Aguardando documentação' }
    ];
    salvar();
}
function salvar() { localStorage.setItem('amovin_prestacao_contas', JSON.stringify(prestacoes)); }
function fm(v) { return 'R$ ' + (v||0).toFixed(2).replace('.', ','); }
function getStatusLabel(status) {
    var map = { 'pendente': '⏳ Pendente', 'enviada': '📤 Enviada', 'aprovada': '✅ Aprovada', 'reprovada': '❌ Reprovada' };
    return map[status] || status;
}
function getStatusClass(status) {
    var map = { 'pendente': 'status-pendente', 'enviada': 'status-enviada', 'aprovada': 'status-aprovada', 'reprovada': 'status-reprovada' };
    return map[status] || 'status-pendente';
}
function atualizarKPIs() {
    var total = prestacoes.length;
    var pendentes = prestacoes.filter(function(p) { return p.status === 'pendente'; }).length;
    var aprovadas = prestacoes.filter(function(p) { return p.status === 'aprovada'; }).length;
    var valorTotal = prestacoes.reduce(function(s, p) { return s + p.valor; }, 0);
    document.getElementById('kpiTotal').textContent = total;
    document.getElementById('kpiPendentes').textContent = pendentes;
    document.getElementById('kpiAprovadas').textContent = aprovadas;
    document.getElementById('kpiValorTotal').textContent = fm(valorTotal);
}
function renderizarPrestacoes() {
    var lista = prestacoes.slice().sort(function(a, b) { return new Date(b.data) - new Date(a.data); });
    var container = document.getElementById('listaPrestacoes');
    if (lista.length === 0) {
        container.innerHTML = '<div class="sem-dados">Nenhuma prestação.</div>';
        return;
    }
    container.innerHTML = lista.map(function(p) {
        var data = new Date(p.data + 'T00:00:00').toLocaleDateString('pt-BR');
        var statusLabel = getStatusLabel(p.status);
        var statusClass = getStatusClass(p.status);
        return '<div class="prestacao-item">' +
            '<div><span class="descricao">' + p.nome + '</span> <span class="status ' + statusClass + '">' + statusLabel + '</span><br><span style="font-size:11px;color:var(--cinza);">' + p.tipo + ' | ' + data + '</span></div>' +
            '<div><span class="valor">' + fm(p.valor) + '</span> ' +
            (p.status === 'pendente' ? '<button class="btn btn-verde" onclick="aprovarPrestacao(' + p.id + ')" style="padding:4px 8px;font-size:10px;">✅</button>' : '') +
            '<button class="btn btn-editar" onclick="editarPrestacao(' + p.id + ')" style="padding:4px 8px;font-size:10px;">✏️</button>' +
            '<button class="btn btn-excluir" onclick="excluirPrestacao(' + p.id + ')" style="padding:4px 8px;font-size:10px;">🗑️</button></div></div>';
    }).join('');
}
window.salvarPrestacao = function() {
    var nome = document.getElementById('nomePrestacao').value.trim();
    var valor = parseFloat(document.getElementById('valorPrestacao').value) || 0;
    var data = document.getElementById('dataPrestacao').value;
    if (!nome) { alert('Preencha o nome!'); return; }
    if (valor <= 0) { alert('Valor deve ser maior que zero!'); return; }
    if (!data) { alert('Selecione a data!'); return; }
    var dados = {
        nome: nome,
        tipo: document.getElementById('tipoPrestacao').value,
        valor: valor,
        data: data,
        status: document.getElementById('statusPrestacao').value,
        obs: document.getElementById('obsPrestacao').value.trim()
    };
    if (editandoId) {
        var idx = prestacoes.findIndex(function(p) { return p.id === editandoId; });
        if (idx >= 0) {
            for (var k in dados) prestacoes[idx][k] = dados[k];
        }
        editandoId = null;
    } else {
        dados.id = Date.now();
        prestacoes.push(dados);
    }
    salvar();
    limparForm();
    atualizarKPIs();
    renderizarPrestacoes();
    alert('✅ Prestação salva com sucesso!');
};
window.editarPrestacao = function(id) {
    var p = prestacoes.find(function(x) { return x.id === id; });
    if (!p) return;
    editandoId = id;
    document.getElementById('prestacaoId').value = id;
    document.getElementById('nomePrestacao').value = p.nome;
    document.getElementById('tipoPrestacao').value = p.tipo;
    document.getElementById('valorPrestacao').value = p.valor;
    document.getElementById('dataPrestacao').value = p.data;
    document.getElementById('statusPrestacao').value = p.status;
    document.getElementById('obsPrestacao').value = p.obs || '';
    document.querySelector('.card h3').textContent = '✏️ Editando: ' + p.nome;
};
window.excluirPrestacao = function(id) {
    if (!confirm('Excluir esta prestação?')) return;
    prestacoes = prestacoes.filter(function(p) { return p.id !== id; });
    salvar();
    atualizarKPIs();
    renderizarPrestacoes();
};
window.aprovarPrestacao = function(id) {
    var p = prestacoes.find(function(x) { return x.id === id; });
    if (p) {
        p.status = 'aprovada';
        salvar();
        atualizarKPIs();
        renderizarPrestacoes();
        alert('✅ Prestação aprovada com sucesso!');
    }
};
function limparForm() {
    editandoId = null;
    document.getElementById('prestacaoId').value = '';
    document.getElementById('nomePrestacao').value = '';
    document.getElementById('tipoPrestacao').value = 'Convênio';
    document.getElementById('valorPrestacao').value = '';
    document.getElementById('dataPrestacao').value = new Date().toISOString().split('T')[0];
    document.getElementById('statusPrestacao').value = 'pendente';
    document.getElementById('obsPrestacao').value = '';
    document.querySelector('.card h3').textContent = '📝 Nova Prestação';
}
document.getElementById('dataPrestacao').value = new Date().toISOString().split('T')[0];
if (!sessionStorage.getItem('amovin_logado')) { window.location.href = 'index.html'; }
atualizarKPIs();
renderizarPrestacoes();
</script>
</body>
</html>
