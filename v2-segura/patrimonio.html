<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • Patrimônio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11;
  --amarelo: #F5C518;
  --verde: #57C220;
  --azul: #1E88E5;
  --grafite: #1A1A1A;
  --cinza: #6B7280;
  --cinza-claro: #F8F4ED;
  --branco: #FFFFFF;
  --vermelho: #E53935;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

/* ==================== SIDEBAR (vem do menu.js) ==================== */
.sidebar { width: 270px; background: #FFFFFF; color: #1A1A1A; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; border-right: 1px solid #F0E9DF; box-shadow: 0 0 20px rgba(0,0,0,0.03); }
.sidebar-header { padding: 28px 24px 24px; text-align: center; border-bottom: 1px solid #F0E9DF; }
.sidebar-logo-img { width: 80px; height: auto; margin-bottom: 8px; display: block; margin-left: auto; margin-right: auto; }
.sidebar-logo-fallback { font-size: 48px; margin-bottom: 8px; display: none; }
.sidebar-header .brand { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; font-weight: 700; color: #1A1A1A; letter-spacing: -0.4px; }
.sidebar-nav { flex: 1; padding: 16px 0; overflow-y: auto; }
.nav-categoria { padding: 16px 24px 6px; font-size: 10px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 1.5px; }
.nav-item { display: flex; align-items: center; gap: 13px; padding: 11px 24px; color: #4B5563; text-decoration: none; font-size: 13.5px; font-weight: 500; transition: all 0.2s ease; border-left: 3px solid transparent; }
.nav-item:hover { background: #FFF8E7; color: #C65A11; border-left-color: #F5C518; }
.nav-item.ativo { background: #FFF3E0; color: #C65A11; border-left-color: #C65A11; font-weight: 600; }
.nav-item .icone { font-size: 17px; width: 24px; text-align: center; }
.sidebar-footer { padding: 20px 24px; border-top: 1px solid #F0E9DF; }
.user-card { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.user-avatar { width: 38px; height: 38px; background: #F5C518; color: #1A1A1A; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
.user-info .nome { font-weight: 600; font-size: 13.5px; }
.user-info .cargo { font-size: 11px; color: #6B7280; }
.btn-sair { width: 100%; padding: 9px; background: #F8F4ED; color: #1A1A1A; border: none; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-sair:hover { background: #F0E9DF; }

/* ==================== MAIN CONTENT ==================== */
.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 22px; }
.kpi-card { background: #FFFFFF; padding: 18px 22px; border-radius: 14px; border: 1px solid #F0E9DF; text-align: center; }
.kpi-card .valor { font-size: 24px; font-weight: 800; color: var(--grafite); }
.kpi-card .label { font-size: 11px; color: var(--cinza); }

.busca { margin-bottom: 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.busca input { flex: 1; padding: 10px 14px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; min-width: 200px; }
.busca select { padding: 10px; border: 1px solid #E5E0D8; border-radius: 8px; font-family: 'Inter', sans-serif; background: white; }
.btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; }
.btn-roxo { background: var(--laranja); color: white; }
.btn-amarelo { background: var(--amarelo); color: #1A1A1A; }
.btn-vermelho { background: var(--vermelho); color: white; }
.btn-verde { background: var(--verde); color: white; }
.btn-azul { background: var(--azul); color: white; }

.card { background: #FFFFFF; padding: 18px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #F0E9DF; border-left: 4px solid var(--laranja); }
.card h3 { margin: 0 0 4px 0; font-size: 16px; color: var(--grafite); }
.card p { margin: 2px 0; color: var(--cinza); font-size: 13px; }
.sem-dados { text-align: center; color: #9CA3AF; padding: 30px; }
.status-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 600; }
.status-ok { background: #E8F5E9; color: #2E7D32; }
.status-manut { background: #FFF3E0; color: #E65100; }
.status-baixado { background: #FFEBEE; color: #C62828; }

.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto; padding: 20px; }
.modal-box { background: white; padding: 28px; border-radius: 14px; width: 100%; max-width: 600px; margin: 30px auto; max-height: 85vh; overflow-y: auto; }
.modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #E5E0D8; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 13px; }
.modal-box label { font-weight: 600; font-size: 11px; display: block; margin-bottom: 3px; color: var(--cinza); text-transform: uppercase; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.modal-actions .btn { flex: 1; text-align: center; }

.rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
.rodape-grid { display: flex; align-items: center; gap: 12px; }
.rodape-logo { flex-shrink: 0; } .rodape-logo .logo-vigorre { width: 50px; }
.rodape-info { flex: 1; } .rodape-info .copyright { font-size: 8px; color: #8A8F98; } .rodape-info .tm { font-size: 6px; vertical-align: super; }
.rodape-info .contato { font-size: 9px; color: #8A8F98; } .rodape-info a { color: #C65A11; text-decoration: none; } .rodape-info .email { font-size: 8px; color: #aaa; }
.logo-vigorre-fallback { font-size: 12px; font-weight: 700; display: none; }

@media (max-width: 768px) { .sidebar { width: 100%; position: relative; } .main-content { margin-left: 0; } .form-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- ==================== MENU LATERAL ==================== -->
<div id="menu-container"></div>

<main class="main-content">
  <div class="topo-bar"><h1>🏢 Patrimônio</h1><button class="btn-sair-topo" onclick="window.location.href='index.html'">🚪 Sair</button></div>

  <div class="kpi-row">
    <div class="kpi-card"><div class="valor" id="kpiTotal">0</div><div class="label">Total de Bens</div></div>
    <div class="kpi-card"><div class="valor" id="kpiValor">R$ 0</div><div class="label">Valor Total</div></div>
    <div class="kpi-card"><div class="valor" id="kpiAtivos">0</div><div class="label">Em Operação</div></div>
  </div>

  <div class="busca">
    <input type="text" id="busca" placeholder="Buscar por nome ou número..." oninput="filtrar()">
    <select id="ordem" onchange="filtrar()"><option value="az">A-Z</option><option value="za">Z-A</option></select>
    <select id="filtroCategoria" onchange="filtrar()"><option value="todas">Todas categorias</option></select>
    <select id="filtroStatus" onchange="filtrar()"><option value="todos">Todos status</option><option>Em Operação</option><option>Em Manutenção</option><option>Disponível</option><option>Baixado</option></select>
    <button class="btn btn-roxo" onclick="abrirForm()">+ Novo Bem</button>
  </div>
  <div id="lista"></div>

  <div class="rodape"><div class="rodape-grid"><div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-vigorre-fallback">Vigorre</span></div><div class="rodape-info"><div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span></div><div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div><div class="email">contato@vigorre.com.br</div></div></div></div>
</main>

<div class="modal" id="modalForm"><div class="modal-box">
  <h3 id="tituloModal">Novo Bem</h3><input type="hidden" id="bemId">
  <label>Número Patrimonial (auto)</label><input type="text" id="numeroBem" readonly style="background:#F8F4ED;">
  <label>Nome do Bem *</label><input type="text" id="nomeBem">
  <div class="form-row"><div><label>Categoria</label><select id="categoriaBem"><option>Informática</option><option>Mobiliário</option><option>Veículo</option><option>Equipamento Esportivo</option><option>Equipamento Terapêutico</option><option>Eletrodoméstico</option><option>Outros</option></select></div><div><label>Status</label><select id="statusBem"><option>Em Operação</option><option>Em Manutenção</option><option>Disponível</option><option>Baixado</option></select></div></div>
  <div class="form-row"><div><label>Marca</label><input type="text" id="marcaBem"></div><div><label>Modelo</label><input type="text" id="modeloBem"></div></div>
  <div class="form-row"><div><label>Data Aquisição</label><input type="date" id="dataBem"></div><div><label>Valor (R$)</label><input type="number" id="valorBem" step="0.01"></div></div>
  <label>Localização</label><input type="text" id="localBem" value="Sede AMOVIN">
  <label>Responsável</label><input type="text" id="respBem">
  <label>Projeto Vinculado</label><select id="projetoBem"><option value="">Nenhum</option><option>Inclusão Digital</option><option>Esporte para Todos</option><option>Reforço Escolar</option><option>Capacitação Profissional</option></select>
  <label>Observações</label><textarea id="obsBem" rows="2"></textarea>
  <div class="modal-actions">
    <button class="btn btn-roxo" onclick="salvar()">💾 Salvar</button>
    <button class="btn btn-vermelho" onclick="fecharForm()">❌ Cancelar</button>
  </div>
</div></div>

<script src="menu.js"></script>
<script>
var bens = JSON.parse(localStorage.getItem('amovin_bens') || '[]');
var editandoId = null, ultimoNumero = parseInt(localStorage.getItem('amovin_patrimonio_num') || '0');
if (bens.length === 0) {
    bens.push({id:1,numero:'AMOVIN-0001',nome:'Notebook Dell',categoria:'Informática',marca:'Dell',modelo:'Inspiron',data:'2026-01-15',valor:3500,local:'Sala Admin',resp:'Admin',status:'Em Operação',projeto:'',obs:''});
    bens.push({id:2,numero:'AMOVIN-0002',nome:'Mesa de Reunião',categoria:'Mobiliário',marca:'Madesa',modelo:'MR-200',data:'2026-02-10',valor:1200,local:'Sala Reuniões',resp:'Admin',status:'Em Operação',projeto:'',obs:''});
    ultimoNumero = 2; salvar();
}
function salvar() { localStorage.setItem('amovin_bens',JSON.stringify(bens)); localStorage.setItem('amovin_patrimonio_num',ultimoNumero); }
function fm(v) { return 'R$ '+(v||0).toFixed(2).replace('.',','); }
function getProximoNumero() { ultimoNumero++; return 'AMOVIN-'+String(ultimoNumero).padStart(4,'0'); }

function popularFiltros() {
    var c = []; for (var i = 0; i < bens.length; i++) { if (c.indexOf(bens[i].categoria) === -1) c.push(bens[i].categoria); }
    var s = document.getElementById('filtroCategoria'); s.innerHTML = '<option value="todas">Todas categorias</option>';
    for (var i = 0; i < c.length; i++) s.innerHTML += '<option value="'+c[i]+'">'+c[i]+'</option>';
}

function filtrar() {
    var b = document.getElementById('busca').value.toLowerCase(), o = document.getElementById('ordem').value, cat = document.getElementById('filtroCategoria').value, st = document.getElementById('filtroStatus').value, l = [];
    for (var i = 0; i < bens.length; i++) {
        var x = bens[i];
        if ((x.nome.toLowerCase().indexOf(b) >= 0 || (x.numero||'').toLowerCase().indexOf(b) >= 0) && (cat === 'todas' || x.categoria === cat) && (st === 'todos' || x.status === st)) l.push(x);
    }
    l.sort(function(a,b){ return o==='az' ? a.nome.localeCompare(b.nome) : b.nome.localeCompare(a.nome); });
    var h = ''; if (l.length === 0) h = '<div class="sem-dados">Nenhum bem.</div>';
    for (var i = 0; i < l.length; i++) {
        var x = l[i], sc = x.status==='Em Operação'?'status-ok':x.status==='Em Manutenção'?'status-manut':'status-baixado';
        h += '<div class="card"><strong style="color:var(--laranja);">'+x.numero+'</strong> <span class="status-badge '+sc+'">'+x.status+'</span><h3>'+x.nome+'</h3><p>'+x.categoria+' | '+(x.marca||'')+' '+(x.modelo||'')+'</p><p>Local: '+(x.local||'-')+' | Resp: '+(x.resp||'-')+' | Valor: '+fm(x.valor)+'</p>';
        h += '<button class="btn btn-amarelo" onclick="editar('+x.id+')">✏️ Editar</button> <button class="btn btn-azul" onclick="transferir('+x.id+')">📦 Transferir</button> <button class="btn btn-vermelho" onclick="excluir('+x.id+')">🗑️ Excluir</button></div>';
    }
    document.getElementById('lista').innerHTML = h;
}

window.abrirForm = function(id) {
    editandoId = id || null; document.getElementById('modalForm').style.display = 'flex';
    document.getElementById('tituloModal').textContent = id ? '✏️ Editar Bem' : '📝 Novo Bem';
    if (id) { var x = bens.find(function(v){return v.id===id;}); if (!x) return;
        document.getElementById('bemId').value=x.id;document.getElementById('numeroBem').value=x.numero;document.getElementById('nomeBem').value=x.nome;document.getElementById('categoriaBem').value=x.categoria;document.getElementById('statusBem').value=x.status;document.getElementById('marcaBem').value=x.marca||'';document.getElementById('modeloBem').value=x.modelo||'';document.getElementById('dataBem').value=x.data||'';document.getElementById('valorBem').value=x.valor||'';document.getElementById('localBem').value=x.local||'';document.getElementById('respBem').value=x.resp||'';document.getElementById('projetoBem').value=x.projeto||'';document.getElementById('obsBem').value=x.obs||'';
    } else { document.getElementById('bemId').value='';document.getElementById('numeroBem').value=getProximoNumero();document.getElementById('nomeBem').value='';document.getElementById('categoriaBem').value='Informática';document.getElementById('statusBem').value='Em Operação';document.getElementById('marcaBem').value='';document.getElementById('modeloBem').value='';document.getElementById('dataBem').value='';document.getElementById('valorBem').value='';document.getElementById('localBem').value='Sede AMOVIN';document.getElementById('respBem').value='';document.getElementById('projetoBem').value='';document.getElementById('obsBem').value=''; }
};
window.fecharForm = function() { document.getElementById('modalForm').style.display = 'none'; };
window.salvar = function() {
    var n = document.getElementById('nomeBem').value; if (!n) { alert('Preencha o nome!'); return; }
    var d = { numero:document.getElementById('numeroBem').value, nome:n, categoria:document.getElementById('categoriaBem').value, status:document.getElementById('statusBem').value, marca:document.getElementById('marcaBem').value, modelo:document.getElementById('modeloBem').value, data:document.getElementById('dataBem').value, valor:parseFloat(document.getElementById('valorBem').value)||0, local:document.getElementById('localBem').value, resp:document.getElementById('respBem').value, projeto:document.getElementById('projetoBem').value, obs:document.getElementById('obsBem').value };
    if (editandoId) { var idx = bens.findIndex(function(v){return v.id===editandoId;}); if (idx>=0) for (var k in d) bens[idx][k]=d[k]; }
    else { d.id = Date.now(); bens.push(d); }
    salvar(); filtrar(); popularFiltros(); atualizarKPIs(); fecharForm();
};
window.editar = function(id) { abrirForm(id); };
window.excluir = function(id) { if (!confirm('Excluir este bem?')) return; bens = bens.filter(function(v){return v.id!==id;}); salvar(); filtrar(); popularFiltros(); atualizarKPIs(); };
window.transferir = function(id) { var x = bens.find(function(v){return v.id===id;}); if (!x) return; var n = prompt('Nova localização:',x.local); if (n && n.trim()) { x.local = n.trim(); salvar(); filtrar(); } };
function atualizarKPIs() { document.getElementById('kpiTotal').textContent = bens.length; document.getElementById('kpiValor').textContent = fm(bens.reduce(function(s,v){return s+(v.valor||0);},0)); document.getElementById('kpiAtivos').textContent = bens.filter(function(v){return v.status==='Em Operação' || v.status==='Disponível';}).length; }

// ============================================================
// VERIFICAÇÃO DE SESSÃO
// ============================================================
if (!sessionStorage.getItem('amovin_logado')) window.location.href = 'index.html';

popularFiltros(); atualizarKPIs(); filtrar();
</script>
</body>
</html>
