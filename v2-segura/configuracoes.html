<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • Configurações</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11; --amarelo: #F5C518; --verde: #57C220;
  --azul: #1E88E5; --grafite: #1A1A1A; --cinza: #6B7280;
  --cinza-claro: #F8F4ED; --branco: #FFFFFF;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

.sidebar { width: 270px; background: #FFFFFF; color: #1A1A1A; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; border-right: 1px solid #F0E9DF; }
.sidebar-header { padding: 28px 24px 24px; text-align: center; border-bottom: 1px solid #F0E9DF; }
.sidebar-logo-img { width: 80px; height: auto; margin-bottom: 8px; display: block; margin-left: auto; margin-right: auto; }
.sidebar-logo-fallback { font-size: 48px; margin-bottom: 8px; display: none; }
.sidebar-header .brand { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; font-weight: 700; color: #1A1A1A; }
.sidebar-nav { flex: 1; padding: 16px 0; overflow-y: auto; }
.nav-categoria { padding: 16px 24px 6px; font-size: 10px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 1.5px; }
.nav-item { display: flex; align-items: center; gap: 13px; padding: 11px 24px; color: #4B5563; text-decoration: none; font-size: 13.5px; font-weight: 500; transition: all 0.2s; border-left: 3px solid transparent; }
.nav-item:hover { background: #FFF8E7; color: #C65A11; border-left-color: #F5C518; }
.nav-item.ativo { background: #FFF3E0; color: #C65A11; border-left-color: #C65A11; font-weight: 600; }
.nav-item .icone { font-size: 17px; width: 24px; text-align: center; }

.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

.config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: #FFFFFF; padding: 24px; border-radius: 14px; border: 1px solid #F0E9DF; }
.card h3 { font-size: 16px; font-weight: 700; color: var(--grafite); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #F0E9DF; }
.card-full { grid-column: 1 / -1; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--cinza); margin-bottom: 4px; text-transform: uppercase; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; }
.btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; }
.btn-salvar { background: var(--laranja); color: white; width: 100%; padding: 14px; font-size: 15px; }
.btn-azul { background: var(--azul); color: white; }
.btn-vermelho { background: #E53935; color: white; }

.color-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.color-option { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all 0.2s; }
.color-option:hover { transform: scale(1.1); }
.color-option.selecionada { border-color: #333; box-shadow: 0 0 0 3px rgba(0,0,0,0.2); }
.preview-logo { width: 80px; height: 80px; border: 2px dashed #E5E0D8; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; margin-bottom: 10px; overflow: hidden; }
.preview-logo img { width: 100%; height: 100%; object-fit: contain; }
.status-msg { padding: 12px; border-radius: 10px; margin-top: 10px; display: none; font-size: 13px; font-weight: 600; }
.status-msg.sucesso { background: #E8F5E9; color: #2E7D32; display: block; }

.rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
.rodape-grid { display: flex; align-items: center; gap: 12px; }
.rodape-logo { flex-shrink: 0; } .rodape-logo .logo-vigorre { width: 50px; }
.rodape-info { flex: 1; } .rodape-info .copyright { font-size: 8px; color: #8A8F98; } .rodape-info .tm { font-size: 6px; vertical-align: super; }
.rodape-info .contato { font-size: 9px; color: #8A8F98; } .rodape-info a { color: #C65A11; text-decoration: none; } .rodape-info .email { font-size: 8px; color: #aaa; }
.logo-vigorre-fallback { font-size: 12px; font-weight: 700; display: none; }

@media (max-width: 768px) { .sidebar { width: 100%; position: relative; } .main-content { margin-left: 0; } .config-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header"><img src="images/amovin-logo.png" alt="AMOVIN" class="sidebar-logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><div class="sidebar-logo-fallback">🌻</div><div class="brand">Amovin ERP Social</div></div>
  <nav class="sidebar-nav">
    <div class="nav-categoria">Principal</div><a href="dashboard.html" class="nav-item"><span class="icone">📊</span> Dashboard</a>
    <div class="nav-categoria">Sistema</div><a href="configuracoes.html" class="nav-item ativo"><span class="icone">⚙️</span> Configurações</a><a href="backup.html" class="nav-item"><span class="icone">💾</span> Backup</a>
  </nav>
</aside>

<main class="main-content">
  <div class="topo-bar"><h1>⚙️ Configurações</h1><button class="btn-sair-topo" onclick="window.location.href='index.html'">🚪 Sair</button></div>

  <div class="config-grid">
    <div class="card">
      <h3>🏢 Dados da Organização</h3>
      <div class="form-group"><label>Nome da ONG</label><input type="text" id="nomeOng" placeholder="AMOVIN"></div>
      <div class="form-group"><label>Nome Completo</label><input type="text" id="nomeCompletoOng"></div>
      <div class="form-group"><label>CNPJ</label><input type="text" id="cnpjOng"></div>
      <div class="form-group"><label>Endereço</label><input type="text" id="enderecoOng"></div>
      <div class="form-group"><label>Cidade/Estado</label><input type="text" id="cidadeOng" value="Rio Paranaíba/MG"></div>
      <div class="form-group"><label>Telefone</label><input type="text" id="telefoneOng"></div>
      <div class="form-group"><label>E-mail</label><input type="email" id="emailOng"></div>
      <div class="form-group"><label>Instagram</label><input type="text" id="instagramOng"></div>
      <div class="form-group"><label>Presidente</label><input type="text" id="presidenteOng"></div>
    </div>

    <div class="card">
      <h3>🎨 Personalização</h3>
      <div class="form-group"><label>Logo</label><div class="preview-logo" id="previewLogo">A</div><input type="file" id="logoUpload" accept="image/*" onchange="previewLogo(this)"></div>
      <div class="form-group"><label>Cor Principal</label><div class="color-picker" id="corPrincipalPicker">
        <div class="color-option" style="background:#C65A11" onclick="selecionarCor('principal','#C65A11',this)"></div>
        <div class="color-option" style="background:#667eea" onclick="selecionarCor('principal','#667eea',this)"></div>
        <div class="color-option" style="background:#2e7d32" onclick="selecionarCor('principal','#2e7d32',this)"></div>
        <div class="color-option" style="background:#1565c0" onclick="selecionarCor('principal','#1565c0',this)"></div>
      </div></div>
      <div class="form-group"><label>Cor Secundária</label><div class="color-picker" id="corSecundariaPicker">
        <div class="color-option" style="background:#F5C518" onclick="selecionarCor('secundaria','#F5C518',this)"></div>
        <div class="color-option" style="background:#764ba2" onclick="selecionarCor('secundaria','#764ba2',this)"></div>
        <div class="color-option" style="background:#43a047" onclick="selecionarCor('secundaria','#43a047',this)"></div>
        <div class="color-option" style="background:#ff8f00" onclick="selecionarCor('secundaria','#ff8f00',this)"></div>
      </div></div>
    </div>

    <div class="card">
      <h3>👤 Usuários</h3>
      <div class="form-group"><label>Email</label><input type="email" id="novoUsuarioEmail"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="novoUsuarioSenha"></div>
      <div class="form-group"><label>Perfil</label><select id="novoUsuarioPerfil"><option value="admin">Administrador</option><option value="recepcao">Recepção</option><option value="consulta">Profissional</option><option value="financeiro">Financeiro</option><option value="voluntario">Voluntário</option></select></div>
      <button class="btn btn-salvar" onclick="adicionarUsuario()">➕ Adicionar</button>
      <div id="listaUsuarios" style="margin-top:15px;"></div>
    </div>

    <div class="card">
      <h3>💾 Backup</h3>
      <p style="font-size:12px;color:var(--cinza);margin-bottom:15px;">Gerencie os dados do sistema</p>
      <button class="btn btn-azul" onclick="window.location.href='backup.html'" style="width:100%;">📥 Ir para Backup</button>
      <button class="btn btn-vermelho" onclick="resetarSistema()" style="width:100%;margin-top:8px;">⚠️ Resetar Sistema</button>
    </div>

    <div class="card card-full">
      <button class="btn-salvar" onclick="salvarConfiguracoes()" style="background:var(--verde);">💾 Salvar Todas as Configurações</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>

  <div class="rodape"><div class="rodape-grid"><div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-vigorre-fallback">Vigorre</span></div><div class="rodape-info"><div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span></div><div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div><div class="email">contato@vigorre.com.br</div></div></div></div>
</main>

<script>
var config = JSON.parse(localStorage.getItem('amovin_config') || '{}');
var usuarios = JSON.parse(localStorage.getItem('amovin_usuarios') || '[]');
var corPrincipal = config.corPrincipal || '#C65A11';
var corSecundaria = config.corSecundaria || '#F5C518';
if (usuarios.length === 0) { usuarios = [{email:'admin@amovin.org.br',senha:'amovin2026',perfil:'admin',nome:'Administrador'}]; salvarUsuarios(); }
function salvarConfig() { localStorage.setItem('amovin_config',JSON.stringify(config)); }
function salvarUsuarios() { localStorage.setItem('amovin_usuarios',JSON.stringify(usuarios)); }

(function carregar() {
    document.getElementById('nomeOng').value = config.nomeOng || 'AMOVIN';
    document.getElementById('nomeCompletoOng').value = config.nomeCompletoOng || '';
    document.getElementById('cnpjOng').value = config.cnpjOng || '';
    document.getElementById('enderecoOng').value = config.enderecoOng || '';
    document.getElementById('cidadeOng').value = config.cidadeOng || 'Rio Paranaíba/MG';
    document.getElementById('telefoneOng').value = config.telefoneOng || '';
    document.getElementById('emailOng').value = config.emailOng || '';
    document.getElementById('instagramOng').value = config.instagramOng || '';
    document.getElementById('presidenteOng').value = config.presidenteOng || '';
    if (config.logo) document.getElementById('previewLogo').innerHTML = '<img src="'+config.logo+'">';
    marcarCor();
    renderizarUsuarios();
})();

window.previewLogo = function(input) { var f = input.files[0]; if (!f) return; var r = new FileReader(); r.onload = function(e) { document.getElementById('previewLogo').innerHTML = '<img src="'+e.target.result+'">'; config.logo = e.target.result; }; r.readAsDataURL(f); };
window.selecionarCor = function(tipo, cor, el) { if (tipo==='principal') corPrincipal=cor; else corSecundaria=cor; el.parentElement.querySelectorAll('.color-option').forEach(function(c){c.classList.remove('selecionada');}); el.classList.add('selecionada'); };
function marcarCor() { document.querySelectorAll('#corPrincipalPicker .color-option').forEach(function(c){if(c.style.background===corPrincipal)c.classList.add('selecionada');}); document.querySelectorAll('#corSecundariaPicker .color-option').forEach(function(c){if(c.style.background===corSecundaria)c.classList.add('selecionada');}); }

window.salvarConfiguracoes = function() {
    config.nomeOng = document.getElementById('nomeOng').value;
    config.nomeCompletoOng = document.getElementById('nomeCompletoOng').value;
    config.cnpjOng = document.getElementById('cnpjOng').value;
    config.enderecoOng = document.getElementById('enderecoOng').value;
    config.cidadeOng = document.getElementById('cidadeOng').value;
    config.telefoneOng = document.getElementById('telefoneOng').value;
    config.emailOng = document.getElementById('emailOng').value;
    config.instagramOng = document.getElementById('instagramOng').value;
    config.presidenteOng = document.getElementById('presidenteOng').value;
    config.corPrincipal = corPrincipal;
    config.corSecundaria = corSecundaria;
    salvarConfig();
    document.getElementById('statusMsg').textContent = 'Configurações salvas!';
    document.getElementById('statusMsg').className = 'status-msg sucesso';
    setTimeout(function(){ document.getElementById('statusMsg').className = 'status-msg'; },3000);
};

window.adicionarUsuario = function() {
    var e = document.getElementById('novoUsuarioEmail').value.trim(), s = document.getElementById('novoUsuarioSenha').value.trim(), p = document.getElementById('novoUsuarioPerfil').value;
    if (!e||!s) { alert('Preencha email e senha!'); return; }
    if (usuarios.find(function(u){return u.email===e;})) { alert('Usuário já existe!'); return; }
    usuarios.push({email:e,senha:s,perfil:p,nome:e.split('@')[0]});
    salvarUsuarios(); document.getElementById('novoUsuarioEmail').value=''; document.getElementById('novoUsuarioSenha').value=''; renderizarUsuarios();
};
function renderizarUsuarios() { document.getElementById('listaUsuarios').innerHTML = '<h4 style="margin-bottom:8px;">Cadastrados</h4>'+usuarios.map(function(u){return '<div style="padding:6px;border-bottom:1px solid #F0E9DF;font-size:12px;display:flex;justify-content:space-between;"><span>'+u.nome+' <small>('+u.perfil+')</small></span><button onclick="removerUsuario(\''+u.email+'\')" style="background:#E53935;color:white;border:none;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:10px;">🗑️</button></div>';}).join(''); }
window.removerUsuario = function(e) { if (!confirm('Remover?')) return; usuarios = usuarios.filter(function(u){return u.email!==e;}); salvarUsuarios(); renderizarUsuarios(); };
window.resetarSistema = function() { if (!confirm('Apagar TODOS os dados?')) return; var c = prompt('Digite RESETAR:'); if (c!=='RESETAR') return; Object.keys(localStorage).filter(function(k){return k.startsWith('amovin_');}).forEach(function(k){localStorage.removeItem(k);}); alert('Sistema resetado.'); location.reload(); };

if (!sessionStorage.getItem('amovin_logado')) window.location.href = 'index.html';
history.pushState(null,null,location.href); window.addEventListener('popstate',function(){history.pushState(null,null,location.href);sessionStorage.clear();window.location.href='index.html';});
var timeout; function resetTimeout(){clearTimeout(timeout);timeout=setTimeout(function(){sessionStorage.clear();alert('Sessão expirada.');window.location.href='index.html';},30*60*1000);}
document.addEventListener('mousemove',resetTimeout);document.addEventListener('keypress',resetTimeout);document.addEventListener('click',resetTimeout);resetTimeout();
</script>
</body>
</html>
