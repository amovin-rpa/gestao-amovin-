<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • Certificados</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11;
  --amarelo: #F5C518;
  --verde: #57C220;
  --azul: #1E88E5;
  --grafite: #1A1A1A;
  --cinza: #6B7280;
  --cinza-claro: #F8F4ED;
  --branco: #FFFFFF;
  --vermelho: #E53935;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

/* ==================== SIDEBAR (vem do menu.js) ==================== */
.sidebar { width: 270px; background: #FFFFFF; color: #1A1A1A; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; border-right: 1px solid #F0E9DF; box-shadow: 0 0 20px rgba(0,0,0,0.03); }
.sidebar-header { padding: 28px 24px 24px; text-align: center; border-bottom: 1px solid #F0E9DF; }
.sidebar-logo-img { width: 80px; height: auto; margin-bottom: 8px; display: block; margin-left: auto; margin-right: auto; }
.sidebar-logo-fallback { font-size: 48px; margin-bottom: 8px; display: none; }
.sidebar-header .brand { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; font-weight: 700; color: #1A1A1A; letter-spacing: -0.4px; }
.sidebar-nav { flex: 1; padding: 16px 0; overflow-y: auto; }
.nav-categoria { padding: 16px 24px 6px; font-size: 10px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 1.5px; }
.nav-item { display: flex; align-items: center; gap: 13px; padding: 11px 24px; color: #4B5563; text-decoration: none; font-size: 13.5px; font-weight: 500; transition: all 0.2s ease; border-left: 3px solid transparent; }
.nav-item:hover { background: #FFF8E7; color: #C65A11; border-left-color: #F5C518; }
.nav-item.ativo { background: #FFF3E0; color: #C65A11; border-left-color: #C65A11; font-weight: 600; }
.nav-item .icone { font-size: 17px; width: 24px; text-align: center; }
.sidebar-footer { padding: 20px 24px; border-top: 1px solid #F0E9DF; }
.user-card { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.user-avatar { width: 38px; height: 38px; background: #F5C518; color: #1A1A1A; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
.user-info .nome { font-weight: 600; font-size: 13.5px; }
.user-info .cargo { font-size: 11px; color: #6B7280; }
.btn-sair { width: 100%; padding: 9px; background: #F8F4ED; color: #1A1A1A; border: none; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-sair:hover { background: #F0E9DF; }

/* ==================== MAIN CONTENT ==================== */
.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: #FFFFFF; padding: 24px; border-radius: 14px; border: 1px solid #F0E9DF; }
.card h3 { font-size: 16px; font-weight: 700; color: var(--grafite); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #F0E9DF; }
.btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; }
.btn-roxo { background: var(--laranja); color: white; }
.btn-azul { background: var(--azul); color: white; }
.btn-vermelho { background: var(--vermelho); color: white; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--cinza); margin-bottom: 4px; text-transform: uppercase; }
.form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; }
.cert-card { background: #F8F4ED; padding: 15px; border-radius: 10px; margin-bottom: 8px; border-left: 4px solid var(--laranja); }
.cert-card h4 { margin: 0 0 5px 0; font-size: 14px; color: var(--grafite); }
.cert-card p { margin: 2px 0; color: var(--cinza); font-size: 12px; }
.sem-dados { text-align: center; color: #9CA3AF; padding: 30px; }

.rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
.rodape-grid { display: flex; align-items: center; gap: 12px; } .rodape-logo { flex-shrink: 0; } .rodape-logo .logo-vigorre { width: 50px; }
.rodape-info { flex: 1; } .rodape-info .copyright { font-size: 8px; color: #8A8F98; } .rodape-info .tm { font-size: 6px; vertical-align: super; }
.rodape-info .contato { font-size: 9px; color: #8A8F98; } .rodape-info a { color: #C65A11; text-decoration: none; } .rodape-info .email { font-size: 8px; color: #aaa; }
.logo-vigorre-fallback { font-size: 12px; font-weight: 700; display: none; }

@media (max-width: 768px) { .sidebar { width: 100%; position: relative; } .main-content { margin-left: 0; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- ==================== MENU LATERAL ==================== -->
<div id="menu-container"></div>

<main class="main-content">
  <div class="topo-bar"><h1>🎓 Certificados</h1><button class="btn-sair-topo" onclick="window.location.href='index.html'">🚪 Sair</button></div>

  <div class="grid">
    <div class="card">
      <h3>Emitir Certificado</h3>
      <div class="form-group"><label>Nome *</label><input type="text" id="nomeCert"></div>
      <div class="form-group"><label>Tipo *</label>
        <select id="tipoCert">
          <option>Horas Voluntárias</option>
          <option>Participação em Evento</option>
          <option>Curso/Oficina</option>
          <option>Palestra</option>
          <option>Empresa Parceira</option>
          <option>Reconhecimento</option>
          <option>Embaixador da ONG</option>
          <option>Formação Profissional</option>
          <option>Protagonismo Comunitário</option>
          <option>Outros</option>
        </select>
      </div>
      <div class="form-group"><label>Descrição *</label><input type="text" id="descricaoCert"></div>
      <div class="form-group"><label>Carga Horária</label><input type="text" id="cargaCert"></div>
      <div class="form-group"><label>Data</label><input type="date" id="dataCert"></div>
      <div class="form-group"><label>Validade (opcional)</label><input type="date" id="validadeCert"></div>
      <button class="btn btn-roxo" onclick="gerarCertificado()">Gerar Certificado</button>
    </div>
    <div class="card">
      <h3>Emitidos</h3>
      <div id="listaCertificados"><div class="sem-dados">Nenhum certificado.</div></div>
    </div>
  </div>

  <div class="rodape"><div class="rodape-grid"><div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-vigorre-fallback">Vigorre</span></div><div class="rodape-info"><div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span></div><div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div><div class="email">contato@vigorre.com.br</div></div></div></div>
</main>

<script src="menu.js"></script>
<script>
var certificados = JSON.parse(localStorage.getItem('amovin_certificados') || '[]');
if (certificados.length === 0) { certificados.push({id:1,nome:'Fernanda Lima',tipo:'Horas Voluntárias',descricao:'Oficina de Informática',carga:'40 horas',data:'2026-06-23',validade:'2027-06-23'}); salvar(); }
function salvar() { localStorage.setItem('amovin_certificados',JSON.stringify(certificados)); }

function renderizar() {
    var c = document.getElementById('listaCertificados');
    if (certificados.length === 0) { c.innerHTML = '<div class="sem-dados">Nenhum certificado.</div>'; return; }
    c.innerHTML = certificados.map(function(x){ return '<div class="cert-card"><h4>'+x.nome+'</h4><p>'+x.tipo+' - '+x.descricao+' | '+(x.carga||'')+'</p><p>Data: '+(x.data?new Date(x.data+'T00:00:00').toLocaleDateString('pt-BR'):'-')+(x.validade?' | Validade: '+new Date(x.validade+'T00:00:00').toLocaleDateString('pt-BR'):'')+'</p><button class="btn btn-azul" onclick="imprimir('+x.id+')">🖨️ Imprimir</button> <button class="btn btn-vermelho" onclick="excluir('+x.id+')">🗑️ Excluir</button></div>'; }).join('');
}

window.gerarCertificado = function() {
    var n = document.getElementById('nomeCert').value.trim(), d = document.getElementById('descricaoCert').value.trim();
    if (!n || !d) { alert('Preencha os campos!'); return; }
    var x = { id: Date.now(), nome: n, tipo: document.getElementById('tipoCert').value, descricao: d, carga: document.getElementById('cargaCert').value, data: document.getElementById('dataCert').value || new Date().toISOString().split('T')[0], validade: document.getElementById('validadeCert').value || '' };
    certificados.push(x); salvar(); renderizar();
    document.getElementById('nomeCert').value = ''; document.getElementById('descricaoCert').value = ''; document.getElementById('cargaCert').value = ''; document.getElementById('validadeCert').value = '';
    imprimirAgora(x);
};

window.imprimir = function(id) { var x = certificados.find(function(c){return c.id===id;}); if (x) imprimirAgora(x); };

function imprimirAgora(x) {
    var d = x.data ? new Date(x.data+'T00:00:00').toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}) : '';
    var v = x.validade ? new Date(x.validade+'T00:00:00').toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}) : '';
    var w = window.open('','_blank');
    w.document.write('<html><head><title>Certificado</title><style>body{font-family:Georgia,serif;text-align:center;padding:40px}.cert{border:6px double #C65A11;padding:40px;max-width:600px;margin:0 auto;background:white}h1{color:#C65A11;font-size:26px;margin:0;letter-spacing:2px}h2{font-size:18px;margin:8px 0;color:#1A1A1A}p{font-size:14px;line-height:1.8;margin:6px 0}.assinatura{margin-top:40px}.linha{width:280px;border-top:1px solid #000;margin:0 auto 8px}.cargo{font-size:12px;color:#666}.validade{font-size:11px;color:#888;margin-top:20px;border-top:1px solid #ddd;padding-top:15px}</style></head><body><div class="cert"><h1>AMOVIN</h1><p style="font-size:12px;color:#666;">Associação e Movimento pela Inclusão</p><h2>CERTIFICADO</h2><p>Certificamos que <strong>'+x.nome+'</strong></p><p>participou da atividade <strong>'+x.descricao+'</strong></p><p>'+x.tipo+(x.carga?' | Carga Horária: '+x.carga:'')+'</p><p style="margin-top:15px;">Rio Paranaíba/MG, '+d+'</p>'+(v?'<p style="font-size:12px;color:#666;">Válido até: '+v+'</p>':'')+'<div class="assinatura"><div class="linha"></div><p style="margin:4px 0;">Presidência AMOVIN</p><p class="cargo">CNPJ: XX.XXX.XXX/XXXX-XX</p></div></div><script>window.onload=function(){window.print()}<\/script></body></html>');
    w.document.close();
}

window.excluir = function(id) { if (!confirm('Excluir?')) return; certificados = certificados.filter(function(x){return x.id!==id;}); salvar(); renderizar(); };

document.getElementById('dataCert').value = new Date().toISOString().split('T')[0];

// ============================================================
// VERIFICAÇÃO DE SESSÃO
// ============================================================
if (!sessionStorage.getItem('amovin_logado')) window.location.href = 'index.html';

renderizar();
</script>
</body>
</html>
