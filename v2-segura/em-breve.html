<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • Em Breve</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root { --laranja: #C65A11; --amarelo: #F5C518; --grafite: #1A1A1A; --cinza: #6B7280; --cinza-claro: #F8F4ED; --branco: #FFFFFF; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.card { background: #FFFFFF; padding: 50px 40px; border-radius: 20px; text-align: center; box-shadow: 0 15px 50px rgba(0,0,0,0.08); border: 1px solid #F0E9DF; max-width: 480px; }
.card h1 { font-size: 64px; margin: 0 0 10px; }
.card h2 { font-size: 20px; font-weight: 700; color: var(--grafite); margin-bottom: 8px; }
.card p { font-size: 14px; color: var(--cinza); margin-bottom: 24px; line-height: 1.5; }
.btn { padding: 12px 28px; background: var(--laranja); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; display: inline-block; transition: all 0.2s; font-family: 'Inter', sans-serif; }
.btn:hover { background: #A04A0E; transform: translateY(-2px); }
</style>
</head>
<body>
<div class="card">
    <h1>🚧</h1>
    <h2>Módulo em Desenvolvimento</h2>
    <p>Esta funcionalidade fará parte do sistema integrado em breve.</p>
    <a href="dashboard.html" class="btn">Voltar ao Dashboard</a>
</div>
</body>
</html>
