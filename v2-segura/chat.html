<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11; --amarelo: #F5C518; --verde: #57C220;
  --azul: #1E88E5; --grafite: #1A1A1A; --cinza: #6B7280;
  --cinza-claro: #F8F4ED; --branco: #FFFFFF;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

/* ==================== SIDEBAR (vem do menu.js) ==================== */
.sidebar { width: 270px; background: #FFFFFF; color: #1A1A1A; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; border-right: 1px solid #F0E9DF; box-shadow: 0 0 20px rgba(0,0,0,0.03); }
.sidebar-header { padding: 28px 24px 24px; text-align: center; border-bottom: 1px solid #F0E9DF; }
.sidebar-logo-img { width: 80px; height: auto; margin-bottom: 8px; display: block; margin-left: auto; margin-right: auto; }
.sidebar-logo-fallback { font-size: 48px; margin-bottom: 8px; display: none; }
.sidebar-header .brand { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; font-weight: 700; color: #1A1A1A; letter-spacing: -0.4px; }
.sidebar-nav { flex: 1; padding: 16px 0; overflow-y: auto; }
.nav-categoria { padding: 16px 24px 6px; font-size: 10px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 1.5px; }
.nav-item { display: flex; align-items: center; gap: 13px; padding: 11px 24px; color: #4B5563; text-decoration: none; font-size: 13.5px; font-weight: 500; transition: all 0.2s ease; border-left: 3px solid transparent; }
.nav-item:hover { background: #FFF8E7; color: #C65A11; border-left-color: #F5C518; }
.nav-item.ativo { background: #FFF3E0; color: #C65A11; border-left-color: #C65A11; font-weight: 600; }
.nav-item .icone { font-size: 17px; width: 24px; text-align: center; }
.sidebar-footer { padding: 20px 24px; border-top: 1px solid #F0E9DF; }
.user-card { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.user-avatar { width: 38px; height: 38px; background: #F5C518; color: #1A1A1A; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
.user-info .nome { font-weight: 600; font-size: 13.5px; }
.user-info .cargo { font-size: 11px; color: #6B7280; }
.btn-sair { width: 100%; padding: 9px; background: #F8F4ED; color: #1A1A1A; border: none; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-sair:hover { background: #F0E9DF; }

/* ==================== MAIN CONTENT ==================== */
.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; display: flex; flex-direction: column; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

.chat-grid { display: grid; grid-template-columns: 260px 1fr; gap: 20px; flex: 1; min-height: 0; }
.chat-sidebar { background: #FFFFFF; border-radius: 14px; border: 1px solid #F0E9DF; display: flex; flex-direction: column; overflow: hidden; }
.sidebar-chat-header { padding: 16px; font-weight: 700; font-size: 14px; border-bottom: 1px solid #F0E9DF; }
.usuarios-list { flex: 1; overflow-y: auto; padding: 8px; }
.usuario-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.usuario-item:hover { background: #F8F4ED; }
.usuario-item.ativo { background: #FFF3E0; }
.usuario-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: white; flex-shrink: 0; }
.avatar-geral { background: var(--laranja); }
.usuario-nome { font-weight: 600; font-size: 12px; color: var(--grafite); }
.usuario-cargo { font-size: 10px; color: var(--cinza); }

.chat-main { background: #FFFFFF; border-radius: 14px; border: 1px solid #F0E9DF; display: flex; flex-direction: column; overflow: hidden; }
.chat-header { padding: 14px 18px; font-weight: 700; font-size: 14px; border-bottom: 1px solid #F0E9DF; display: flex; align-items: center; gap: 10px; }
.chat-mensagens { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 8px; max-width: 80%; }
.msg.minha { align-self: flex-end; flex-direction: row-reverse; }
.msg.outra { align-self: flex-start; }
.msg-bolha { padding: 10px 14px; border-radius: 16px; font-size: 13px; line-height: 1.5; word-wrap: break-word; }
.msg.minha .msg-bolha { background: var(--laranja); color: white; }
.msg.outra .msg-bolha { background: #F8F4ED; color: var(--grafite); }
.msg-info { font-size: 9px; margin-top: 4px; opacity: 0.6; }
.msg-nome { font-size: 10px; font-weight: 600; color: var(--laranja); margin-bottom: 3px; }
.sem-mensagens { text-align: center; padding: 60px 20px; color: #9CA3AF; }
.chat-input-area { padding: 14px 18px; border-top: 1px solid #F0E9DF; display: flex; gap: 10px; }
.chat-input-area input { flex: 1; padding: 10px 14px; border: 1px solid #E5E0D8; border-radius: 20px; font-size: 13px; font-family: 'Inter', sans-serif; }
.btn-enviar { padding: 10px 20px; background: var(--laranja); color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: 600; }

@media (max-width: 768px) { .sidebar { width: 100%; position: relative; } .main-content { margin-left: 0; } .chat-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- ==================== MENU LATERAL ==================== -->
<div id="menu-container"></div>

<main class="main-content">
  <div class="topo-bar"><h1>💬 Chat Interno</h1><button class="btn-sair-topo" onclick="window.location.href='index.html'">🚪 Sair</button></div>

  <div class="chat-grid">
    <div class="chat-sidebar">
      <div class="sidebar-chat-header">👥 Contatos</div>
      <div class="usuarios-list" id="listaContatos"></div>
    </div>
    <div class="chat-main">
      <div class="chat-header"><span id="chatTitulo">Bate-papo Geral</span></div>
      <div class="chat-mensagens" id="chatMensagens"><div class="sem-mensagens">Nenhuma mensagem ainda.</div></div>
      <div class="chat-input-area">
        <input type="text" id="inputMensagem" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter')enviarMensagem()">
        <button class="btn-enviar" onclick="enviarMensagem()">Enviar</button>
      </div>
    </div>
  </div>
</main>

<script src="menu.js"></script>
<script>
var usuarioAtual = { id: sessionStorage.getItem('amovin_nome') || 'Admin', nome: sessionStorage.getItem('amovin_nome') || 'Administrador' };
var mensagens = JSON.parse(localStorage.getItem('amovin_chat') || '[]');
var canalAtual = 'geral';

var usuarios = [
    { id: 'geral', nome: 'Geral', cargo: 'Todos', avatar: 'avatar-geral', icone: '💬', geral: true },
    { id: 'Admin', nome: 'Administrador', cargo: 'Admin', avatar: 'avatar-geral', icone: '🛡️' },
    { id: 'Dr. Carlos Mendes', nome: 'Dr. Carlos', cargo: 'Psicólogo', avatar: 'avatar-geral', icone: '🩺' },
    { id: 'Dra. Lucia Ferreira', nome: 'Dra. Lucia', cargo: 'Assistente Social', avatar: 'avatar-geral', icone: '👩‍⚕️' }
];

function salvar() { localStorage.setItem('amovin_chat', JSON.stringify(mensagens)); }

function renderizarContatos() {
    document.getElementById('listaContatos').innerHTML = usuarios.map(function(u) {
        return '<div class="usuario-item'+(u.geral?' geral':'')+(canalAtual===u.id?' ativo':'')+'" onclick="mudarCanal(\''+u.id+'\')"><div class="usuario-avatar '+u.avatar+'">'+u.icone+'</div><div><div class="usuario-nome">'+u.nome+'</div><div class="usuario-cargo">'+u.cargo+'</div></div></div>';
    }).join('');
}

window.mudarCanal = function(id) {
    canalAtual = id; document.getElementById('chatTitulo').textContent = usuarios.find(function(u){return u.id===id;}).nome;
    renderizarContatos(); renderizarMensagens();
};

function getFiltradas() {
    return mensagens.filter(function(m) {
        if (canalAtual === 'geral') return !m.canal || m.canal === 'geral';
        return (m.canal === canalAtual && m.de === usuarioAtual.id) || (m.canal === usuarioAtual.id && m.de === canalAtual) || (m.de === usuarioAtual.id && m.canal === canalAtual);
    }).sort(function(a,b){ return new Date(a.data) - new Date(b.data); });
}

function renderizarMensagens() {
    var c = document.getElementById('chatMensagens'), msgs = getFiltradas();
    if (msgs.length === 0) { c.innerHTML = '<div class="sem-mensagens">Nenhuma mensagem.</div>'; return; }
    c.innerHTML = msgs.map(function(m) {
        var minha = m.de === usuarioAtual.id, rem = usuarios.find(function(u){return u.id===m.de;});
        return '<div class="msg '+(minha?'minha':'outra')+'"><div class="msg-bolha">'+(minha?'':'<div class="msg-nome">'+(rem?rem.nome:m.de)+'</div>')+m.texto+'<div class="msg-info">'+new Date(m.data).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</div></div></div>';
    }).join('');
    c.scrollTop = c.scrollHeight;
}

window.enviarMensagem = function() {
    var t = document.getElementById('inputMensagem').value.trim(); if (!t) return;
    mensagens.push({ de: usuarioAtual.id, texto: t, canal: canalAtual, data: new Date().toISOString() });
    salvar(); document.getElementById('inputMensagem').value = ''; renderizarMensagens();
};

renderizarContatos(); renderizarMensagens();

// ============================================================
// VERIFICAÇÃO DE SESSÃO
// ============================================================
if (!sessionStorage.getItem('amovin_logado')) window.location.href = 'index.html';
</script>
</body>
</html>
