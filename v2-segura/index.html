<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMOVIN • Acesso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet">
<style>
:root {
  --amarelo: #E8B923;
  --amarelo-escuro: #C99A1A;
  --grafite: #2C2C2C;
  --cinza: #6B7280;
  --fundo: #F9F5EB;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: linear-gradient(145deg, #F9F5EB 0%, #F4EDE0 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

.login-card {
  background: #FFFFFF;
  width: 100%;
  max-width: 360px;
  border-radius: 22px;
  padding: 44px 40px 40px;
  box-shadow: 0 25px 70px rgba(0, 0, 0, 0.07),
              0 0 0 1px rgba(0, 0, 0, 0.03);
  border: 1px solid #F0E9DF;
  text-align: center;
}

/* Logo e Identidade */
.logo {
  font-size: 82px;
  margin-bottom: 4px;
  line-height: 1;
  filter: drop-shadow(0 4px 12px rgba(232, 185, 35, 0.15));
}

.brand {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--grafite);
  letter-spacing: -0.4px;
  margin-bottom: 1px;
}

.tagline {
  font-size: 10.5px;
  color: #8A8F98;
  letter-spacing: 2px;
  margin-bottom: 30px;
}

/* Tabs */
.tabs {
  display: flex;
  background: #F9F5EB;
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 26px;
}

.tab {
  flex: 1;
  padding: 9px 0;
  border: none;
  background: transparent;
  font-size: 12px;
  font-weight: 600;
  color: #8A8F98;
  border-radius: 9px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.tab.active {
  background: #FFFFFF;
  color: var(--amarelo-escuro);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
  font-weight: 700;
}

/* Formulário */
.form-group {
  margin-bottom: 16px;
  text-align: left;
}

.form-group label {
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.form-group input {
  width: 100%;
  padding: 13px 16px;
  border: 1.5px solid #EDE5D9;
  border-radius: 12px;
  font-size: 14.5px;
  transition: all 0.2s ease;
  background: #fff;
}

.form-group input:focus {
  border-color: var(--amarelo);
  box-shadow: 0 0 0 3px rgba(232, 185, 35, 0.12);
  outline: none;
}

.btn {
  width: 100%;
  padding: 14px;
  background: var(--amarelo);
  color: #2C2C2C;
  border: none;
  border-radius: 12px;
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 8px;
}

.btn:hover {
  background: var(--amarelo-escuro);
  color: white;
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(232, 185, 35, 0.3);
}

.erro {
  background: #FFF5F5;
  color: #B91C1C;
  padding: 11px 13px;
  border-radius: 9px;
  font-size: 12.5px;
  margin-bottom: 16px;
  display: none;
  border-left: 3px solid #B91C1C;
  text-align: left;
}

.erro.show { display: block; }
</style>
</head>
<body>

<div class="login-card">
  
  <!-- Logo e Identidade -->
  <div class="logo">🌻</div>
  <div class="brand">Amovin ERP Social</div>
  <div class="tagline">SISTEMA DE GESTÃO</div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="admin">Administrador</button>
    <button class="tab" data-tab="recepcao">Recepção</button>
    <button class="tab" data-tab="consulta">Consulta</button>
  </div>

  <div class="erro" id="erroMsg"></div>

  <!-- Formulário -->
  <form id="loginForm">
    <div class="form-group">
      <label>Login</label>
      <input type="text" id="nome" required placeholder="Seu login">
    </div>
    
    <div class="form-group" id="grupoSenha">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="••••••••">
    </div>

    <button type="submit" class="btn">Entrar no Sistema</button>
  </form>

</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDu5663V7pAamG2lzjD1i2CNTKh6uPZO3U",
    authDomain: "amovin-oficios-teste.firebaseapp.com",
    projectId: "amovin-oficios-teste",
    storageBucket: "amovin-oficios-teste.firebasestorage.app",
    messagingSenderId: "901387183295",
    appId: "1:901387183295:web:b9a445cbe259d1c14c120a"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  let tabAtiva = 'admin';

  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      tabAtiva = tab.dataset.tab;
      document.getElementById('erroMsg').classList.remove('show');
    });
  });

  // Login
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const nome = document.getElementById('nome').value.trim();
    const senha = document.getElementById('senha').value;
    const erro = document.getElementById('erroMsg');

    if (!nome) {
      erro.textContent = 'Por favor, informe seu login.';
      erro.classList.add('show');
      return;
    }

    if (tabAtiva === 'admin' && nome.toLowerCase() === 'admin' && senha === 'amovin2026') {
      sessionStorage.setItem('amovin_logado', 'true');
      sessionStorage.setItem('amovin_perfil', 'admin');
      sessionStorage.setItem('amovin_nome', 'Administrador');
      window.location.href = 'dashboard.html';
      return;
    }

    if (tabAtiva === 'recepcao' && !senha) {
      sessionStorage.setItem('amovin_logado', 'true');
      sessionStorage.setItem('amovin_perfil', 'recepcao');
      sessionStorage.setItem('amovin_nome', nome);
      window.location.href = 'dashboard.html';
      return;
    }

    erro.textContent = 'Credenciais inválidas. Tente novamente.';
    erro.classList.add('show');
  });

  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
