<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMOVIN - Login Seguro</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .login-header .logo {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 40px;
            font-weight: bold;
            color: #764ba2;
        }

        .login-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }

        .olho-magico {
            position: absolute;
            right: 15px;
            top: 42px;
            cursor: pointer;
            font-size: 20px;
            user-select: none;
            opacity: 0.6;
            transition: opacity 0.3s;
            background: none;
            border: none;
        }

        .olho-magico:hover {
            opacity: 1;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .erro-msg {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            border-left: 4px solid #c33;
        }

        .erro-msg.show {
            display: block;
        }

        .links-legal {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        .links-legal a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
        }

        .links-legal a:hover {
            text-decoration: underline;
        }

        .firebase-status {
            text-align: center;
            font-size: 11px;
            margin-top: 15px;
            padding: 8px;
            border-radius: 20px;
            background: #f5f5f5;
        }

        .firebase-status.online {
            color: #4caf50;
            background: #e8f5e9;
        }

        .firebase-status.offline {
            color: #f44336;
            background: #ffebee;
        }

        .firebase-status .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .firebase-status.online .status-dot {
            background: #4caf50;
        }

        .firebase-status.offline .status-dot {
            background: #f44336;
        }

        .espaco-info {
            background: #f0f0ff;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 12px;
            text-align: center;
        }

        .espaco-barra {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }

        .espaco-preenchido {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            border-radius: 3px;
            transition: width 0.5s;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .conectando {
            animation: pulse 1.5s infinite;
        }

        .lgpd-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a2e;
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            font-size: 13px;
        }

        .lgpd-banner button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            white-space: nowrap;
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <!-- Banner LGPD -->
    <div class="lgpd-banner" id="lgpdBanner">
        <span>🍪 Este site usa cookies essenciais para funcionamento. Ao continuar, você concorda com nossa 
            <a href="#" style="color: #667eea;">Política de Privacidade</a> (LGPD).
        </span>
        <button onclick="aceitarLGPD()">Entendi</button>
    </div>

    <div class="login-container">
        <div class="login-header">
            <div class="logo">A</div>
            <h1>AMOVIN</h1>
            <p>Associação e Movimento pela Inclusão</p>
        </div>

        <div class="login-body">
            <div class="erro-msg" id="erroMsg"></div>

            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label>📧 E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        required 
                        placeholder="seu@email.com"
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label>🔒 Senha</label>
                    <input 
                        type="password" 
                        id="senha" 
                        required 
                        placeholder="••••••••"
                        autocomplete="new-password"
                    >
                    <button type="button" class="olho-magico" id="olhoMagico" onclick="toggleSenha()" tabindex="-1">
                        👁️
                    </button>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    🔐 Entrar
                </button>
            </form>

            <div class="firebase-status" id="firebaseStatus">
                <span class="status-dot"></span>
                <span id="statusTexto">Verificando conexão...</span>
            </div>

            <div class="espaco-info">
                📊 Espaço utilizado: <strong><span id="espacoPercentual">--</span>%</strong>
                <div class="espaco-barra">
                    <div class="espaco-preenchido" id="espacoBarra" style="width: 0%;"></div>
                </div>
            </div>

            <div class="links-legal">
                <a href="#" onclick="alert('Política de Privacidade em construção')">Política de Privacidade</a>
                <a href="#" onclick="alert('Termos de Uso em construção')">Termos de Uso</a>
                <span>🔒 LGPD</span>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, enableNetwork, disableNetwork, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Configuração Firebase - DADOS REAIS
        const firebaseConfig = {
            apiKey: "AIzaSyDu5663V7pAamG2lzjD1i2CNTKh6uPZO3U",
            authDomain: "amovin-oficios-teste.firebaseapp.com",
            projectId: "amovin-oficios-teste",
            storageBucket: "amovin-oficios-teste.firebasestorage.app",
            messagingSenderId: "901387183295",
            appId: "1:901387183295:web:b9a445cbe259d1c14c120a"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ========== STATUS DA CONEXÃO ==========
        const statusDiv = document.getElementById('firebaseStatus');
        const statusTexto = document.getElementById('statusTexto');
        
        function atualizarStatus(online) {
            if (online) {
                statusDiv.className = 'firebase-status online';
                statusTexto.textContent = 'Conectado ao Firebase';
            } else {
                statusDiv.className = 'firebase-status offline';
                statusTexto.textContent = 'Firebase offline';
            }
        }

        // Monitorar conexão
        window.addEventListener('online', () => {
            enableNetwork(db);
            atualizarStatus(true);
        });

        window.addEventListener('offline', () => {
            disableNetwork(db);
            atualizarStatus(false);
        });

        // Status inicial
        atualizarStatus(navigator.onLine);

        // ========== ESPAÇO EM PERCENTUAL ==========
        async function atualizarEspaco() {
            try {
                // Simula verificação de espaço (Firebase não expõe diretamente)
                // Na versão gratuita: 1GB total
                const usoEstimado = Math.random() * 15; // Simulação - depois conectamos real
                const percentual = Math.round(usoEstimado);
                
                document.getElementById('espacoPercentual').textContent = percentual;
                document.getElementById('espacoBarra').style.width = percentual + '%';
                
                // Mudar cor conforme uso
                const barra = document.getElementById('espacoBarra');
                if (percentual > 80) {
                    barra.style.background = 'linear-gradient(90deg, #f44336, #ff9800)';
                } else if (percentual > 50) {
                    barra.style.background = 'linear-gradient(90deg, #ff9800, #ffc107)';
                } else {
                    barra.style.background = 'linear-gradient(90deg, #4caf50, #8bc34a)';
                }
            } catch (erro) {
                document.getElementById('espacoPercentual').textContent = '--';
            }
        }
        
        atualizarEspaco();

        // ========== VERIFICAR SE JÁ LOGADO ==========
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Já logado - redirecionar para dashboard
                sessionStorage.setItem('amovin_logado', 'true');
                sessionStorage.setItem('amovin_login_time', Date.now());
                window.location.href = 'dashboard.html';
            }
        });

        // ========== LOGIN ==========
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btnLogin = document.getElementById('btnLogin');
            const erroMsg = document.getElementById('erroMsg');
            
            btnLogin.disabled = true;
            btnLogin.textContent = '⏳ Autenticando...';
            erroMsg.classList.remove('show');
            
            try {
                // NUNCA salvar senha
                const credencial = await signInWithEmailAndPassword(auth, email, senha);
                
                // Login bem sucedido
                sessionStorage.setItem('amovin_logado', 'true');
                sessionStorage.setItem('amovin_login_time', Date.now());
                // NUNCA armazenar senha
                
                window.location.href = 'dashboard.html';
                
            } catch (error) {
                let mensagem = 'Erro ao fazer login.';
                
                switch (error.code) {
                    case 'auth/invalid-email':
                        mensagem = 'E-mail inválido.';
                        break;
                    case 'auth/user-disabled':
                        mensagem = 'Usuário desativado.';
                        break;
                    case 'auth/user-not-found':
                        mensagem = 'Usuário não encontrado.';
                        break;
                    case 'auth/wrong-password':
                        mensagem = 'Senha incorreta.';
                        break;
                    case 'auth/too-many-requests':
                        mensagem = 'Muitas tentativas. Aguarde 1 minuto.';
                        break;
                    case 'auth/invalid-credential':
                        mensagem = 'E-mail ou senha incorretos.';
                        break;
                }
                
                erroMsg.textContent = '❌ ' + mensagem;
                erroMsg.classList.add('show');
                
                btnLogin.disabled = false;
                btnLogin.textContent = '🔐 Entrar';
            }
        });

        // ========== OLHO MÁGICO ==========
        window.toggleSenha = function() {
            const senhaInput = document.getElementById('senha');
            const olho = document.getElementById('olhoMagico');
            
            if (senhaInput.type === 'password') {
                senhaInput.type = 'text';
                olho.textContent = '🙈';
            } else {
                senhaInput.type = 'password';
                olho.textContent = '👁️';
            }
        };

        // ========== SEGURANÇA: BLOQUEAR BOTÃO VOLTAR ==========
        // Se usuário clicar "voltar" no navegador, faz logout
        history.pushState(null, null, location.href);
        window.addEventListener('popstate', () => {
            history.pushState(null, null, location.href);
            signOut(auth);
            sessionStorage.clear();
            window.location.href = 'index.html';
        });

        // ========== SEGURANÇA: LIMPAR CACHE AO SAIR ==========
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                // Página veio do cache do navegador - recarregar
                signOut(auth);
                sessionStorage.clear();
                window.location.reload();
            }
        });

        // ========== TIMEOUT DE SESSÃO ==========
        // Se ficar inativo por 30 minutos, desloga
        let timeoutInatividade;
        
        function resetarTimeout() {
            clearTimeout(timeoutInatividade);
            timeoutInatividade = setTimeout(() => {
                if (sessionStorage.getItem('amovin_logado')) {
                    signOut(auth);
                    sessionStorage.clear();
                    alert('⏰ Sessão expirada por inatividade. Faça login novamente.');
                    window.location.href = 'index.html';
                }
            }, 30 * 60 * 1000); // 30 minutos
        }
        
        document.addEventListener('mousemove', resetarTimeout);
        document.addEventListener('keypress', resetarTimeout);
        document.addEventListener('click', resetarTimeout);
        resetarTimeout();

        // ========== LGPD ==========
        window.aceitarLGPD = function() {
            document.getElementById('lgpdBanner').style.display = 'none';
            localStorage.setItem('lgpd_aceito', 'true');
            localStorage.setItem('lgpd_data', new Date().toISOString());
        };

        // Verificar se já aceitou
        if (localStorage.getItem('lgpd_aceito') === 'true') {
            document.getElementById('lgpdBanner').style.display = 'none';
        }
    </script>
</body>
</html>
