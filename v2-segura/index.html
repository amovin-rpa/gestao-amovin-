<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMOVIN • ERP Social</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --laranja: #C65A11;
            --laranja-escuro: #8F3F0D;
            --amarelo: #F5C518;
            --amarelo-glow: #FFDB4D;
            --terra: #3F2A1E;
            --cinza-escuro: #1F252E;
            --branco: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100dvh;
            background: radial-gradient(circle at 50% 30%, rgba(245, 197, 24, 0.12) 0%, transparent 50%),
                        linear-gradient(135deg, #2B1D12 0%, #1A120C 50%, #3F2A1E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Fundo decorativo premium */
        body::before {
            content: '🌻';
            position: absolute;
            font-size: 620px;
            opacity: 0.04;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(12px);
            z-index: 0;
            animation: float-slow 35s ease-in-out infinite;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(32px);
            border: 1px solid rgba(245, 197, 24, 0.25);
            border-radius: 32px;
            width: 100%;
            max-width: 460px;
            padding: 52px 48px;
            box-shadow: 
                0 40px 80px -15px rgba(198, 90, 17, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.6) inset,
                0 0 60px -10px rgba(245, 197, 24, 0.3);
            position: relative;
            z-index: 2;
        }

        .logo-central {
            font-size: 68px;
            text-align: center;
            margin-bottom: 16px;
            display: block;
            animation: float 6s ease-in-out infinite;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: var(--terra);
            margin-bottom: 6px;
            letter-spacing: -0.8px;
        }

        .subtitulo {
            text-align: center;
            color: #5C4635;
            font-size: 15px;
            margin-bottom: 32px;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            background: #F5EDE4;
            padding: 6px;
            border-radius: 18px;
            margin-bottom: 32px;
        }

        .tab {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: #6B5A4A;
        }

        .tab.ativo {
            background: white;
            color: var(--laranja);
            box-shadow: 0 8px 20px -6px rgba(198, 90, 17, 0.25);
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: #3F2A1E;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #EDE0D0;
            border-radius: 16px;
            font-size: 1.05rem;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--laranja);
            box-shadow: 0 0 0 6px rgba(198, 90, 17, 0.15);
        }

        .olho-magico {
            position: absolute;
            right: 20px;
            top: 42px;
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0.5;
        }

        .btn-entrar {
            width: 100%;
            padding: 18px;
            background: linear-gradient(90deg, var(--laranja), var(--laranja-escuro));
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 15px 35px -10px rgba(198, 90, 17, 0.45);
            position: relative;
            overflow: hidden;
        }

        .btn-entrar:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 45px -8px rgba(198, 90, 17, 0.55);
        }

        .btn-entrar:active {
            transform: scale(0.98);
        }

        .erro-msg {
            background: #FEF2F2;
            color: #9F1F1F;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 0.9rem;
            border-left: 5px solid #B91C1C;
            display: none;
            margin-bottom: 20px;
        }

        .erro-msg.show { display: block; animation: shake 0.5s; }

        .rodape {
            text-align: center;
            margin-top: 32px;
            font-size: 0.75rem;
            color: #6B5A4A;
            opacity: 0.7;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }

        @keyframes float-slow {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            50% { transform: translateX(-50%) rotate(12deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-central">🌻</div>
        <h1>AMOVIN</h1>
        <p class="subtitulo">Associação e Movimento pela Inclusão</p>

        <div class="erro-msg" id="erroMsg"></div>

        <div class="tabs">
            <button class="tab ativo" onclick="mudarTab('admin', this)">Admin</button>
            <button class="tab" onclick="mudarTab('recepcao', this)">Recepção</button>
            <button class="tab" onclick="mudarTab('consulta', this)">Consulta</button>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" id="nome" placeholder="Digite seu usuário" autocomplete="off">
            </div>
            <div class="form-group" id="grupoSenha">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="••••••••">
                <button type="button" class="olho-magico" onclick="toggleSenha()">👁️</button>
            </div>
            <button type="submit" class="btn-entrar" id="btnEntrar">Entrar no Sistema</button>
        </form>

        <div class="rodape">
            Desenvolvido por <strong>Vigorre Sistemas</strong><br>
            AMOVIN ERP Social • 2026
        </div>
    </div>

<script>
    let tabAtiva = 'admin';

    window.mudarTab = function(tab, botao) {
        tabAtiva = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
        botao.classList.add('ativo');
        
        document.getElementById('erroMsg').classList.remove('show');
        document.getElementById('grupoSenha').style.display = (tab === 'recepcao') ? 'none' : 'block';
    };

    window.toggleSenha = function() {
        const senha = document.getElementById('senha');
        const olho = document.querySelector('.olho-magico');
        if (senha.type === 'password') {
            senha.type = 'text';
            olho.textContent = '🙈';
        } else {
            senha.type = 'password';
            olho.textContent = '👁️';
        }
    };

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const nome = document.getElementById('nome').value.trim();
        const senha = document.getElementById('senha').value;
        const erro = document.getElementById('erroMsg');

        if (!nome) {
            erro.textContent = 'Por favor, informe o usuário.';
            erro.classList.add('show');
            return;
        }

        if (tabAtiva === 'admin' && nome.toLowerCase() === 'admin' && senha === 'amovin2026') {
            sessionStorage.setItem('amovin_logado', 'true');
            sessionStorage.setItem('amovin_perfil', 'admin');
            window.location.href = 'dashboard.html';
            return;
        }

        if (tabAtiva === 'recepcao') {
            sessionStorage.setItem('amovin_logado', 'true');
            sessionStorage.setItem('amovin_perfil', 'recepcao');
            sessionStorage.setItem('amovin_nome', nome || 'Recepcionista');
            window.location.href = 'dashboard.html';
            return;
        }

        erro.textContent = 'Credenciais inválidas.';
        erro.classList.add('show');
    });
</script>
</body>
</html>
