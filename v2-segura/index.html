<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMOVIN ERP Social - Login</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        :root {
            --laranja: #C65A11;
            --amarelo: #F5C518;
            --verde: #57C220;
            --azul: #1E88E5;
            --preto: #1A1A1A;
            --branco: #FFFFFF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--preto) 0%, #2D1B0E 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .login-wrapper { width: 100%; max-width: 420px; }
        .login-card {
            background: white; border-radius: 20px; box-shadow: 0 25px 80px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, var(--laranja) 0%, #E67E22 100%);
            padding: 40px 30px; text-align: center; color: white;
        }
        .logo-container {
            font-size: 70px; margin-bottom: 10px;
        }
        .login-header h1 { font-size: 22px; margin-bottom: 4px; }
        .login-header p { font-size: 12px; opacity: 0.85; }
        .login-body { padding: 30px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 25px; background: #f5f5f5; padding: 5px; border-radius: 12px; }
        .tab {
            flex: 1; padding: 10px 8px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 11px; font-weight: 600; transition: all 0.3s;
            background: transparent; color: #888; text-align: center;
        }
        .tab.ativo { background: white; color: var(--laranja); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; margin-bottom: 6px; color: #444; font-weight: 600; font-size: 13px; }
        .form-group input {
            width: 100%; padding: 14px 45px 14px 15px; border: 2px solid #e0e0e0;
            border-radius: 10px; font-size: 14px; transition: all 0.3s;
        }
        .form-group input:focus { border-color: var(--laranja); outline: none; box-shadow: 0 0 0 3px rgba(198,90,17,0.1); }
        .olho-magico {
            position: absolute; right: 15px; top: 42px; cursor: pointer;
            font-size: 18px; background: none; border: none; opacity: 0.5;
        }
        .olho-magico:hover { opacity: 1; }
        .btn-entrar {
            width: 100%; padding: 15px; background: var(--laranja); color: white;
            border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.3s; margin-top: 5px;
        }
        .btn-entrar:hover { background: #A04A0E; transform: translateY(-2px); }
        .btn-entrar:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .erro-msg {
            background: #fff5f5; color: #c62828; padding: 12px; border-radius: 8px;
            margin-bottom: 15px; display: none; font-size: 13px; border-left: 4px solid #c62828;
        }
        .erro-msg.show { display: block; }
        .rodape-login { text-align: center; margin-top: 20px; font-size: 10px; color: #aaa; }
        .lgpd-banner {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(26,26,26,0.95); color: white; padding: 14px 20px;
            border-radius: 12px; z-index: 9999; font-size: 11px;
            display: flex; align-items: center; gap: 15px; max-width: 500px; width: 90%;
        }
        .lgpd-banner button {
            background: var(--laranja); color: white; border: none;
            padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 11px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="lgpd-banner" id="lgpdBanner">
        <span>🍪 Usamos cookies essenciais. Ao continuar, voce concorda com a LGPD.</span>
        <button onclick="aceitarLGPD()">ENTENDI</button>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-container">🌻</div>
                <h1>AMOVIN</h1>
                <p>Associacao e Movimento pela Inclusao</p>
            </div>
            <div class="login-body">
                <div class="erro-msg" id="erroMsg"></div>
                <div class="tabs">
                    <button class="tab ativo" onclick="mudarTab('admin', this)">🛡️ Administrador</button>
                    <button class="tab" onclick="mudarTab('recepcao', this)">👥 Recepcao</button>
                    <button class="tab" onclick="mudarTab('consulta', this)">🩺 Consulta</button>
                </div>
                <form id="loginForm" autocomplete="off">
                    <div class="form-group">
                        <label id="labelNome">Login</label>
                        <input type="text" id="nome" required placeholder="Seu login ou nome" autocomplete="off">
                    </div>
                    <div class="form-group" id="grupoSenha">
                        <label>Senha <span style="font-weight:normal;color:#aaa;font-size:11px;" id="labelOpcional"></span></label>
                        <input type="password" id="senha" placeholder="••••••••" autocomplete="new-password">
                        <button type="button" class="olho-magico" onclick="toggleSenha()">👁️</button>
                    </div>
                    <button type="submit" class="btn-entrar" id="btnEntrar">🔐 Entrar</button>
                </form>
            </div>
        </div>
        <div class="rodape-login">
            Desenvolvido por Vigorre Sistemas | Vigorre ERP Social™
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDu5663V7pAamG2lzjD1i2CNTKh6uPZO3U",
            authDomain: "amovin-oficios-teste.firebaseapp.com",
            projectId: "amovin-oficios-teste",
            storageBucket: "amovin-oficios-teste.firebasestorage.app",
            messagingSenderId: "901387183295",
            appId: "1:901387183295:web:b9a445cbe259d1c14c120a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let tabAtiva = 'admin';

        window.mudarTab = function(tab, botao) {
            tabAtiva = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
            botao.classList.add('ativo');
            document.getElementById('erroMsg').classList.remove('show');
        };

        window.toggleSenha = function() {
            const senha = document.getElementById('senha');
            const olho = document.querySelector('.olho-magico');
            if (senha.type === 'password') { senha.type = 'text'; olho.textContent = '🙈'; }
            else { senha.type = 'password'; olho.textContent = '👁️'; }
        };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value.trim();
            const senha = document.getElementById('senha').value;
            const btnEntrar = document.getElementById('btnEntrar');
            const erroMsg = document.getElementById('erroMsg');

            if (!nome) { erroMsg.textContent = 'Preencha o campo de login.'; erroMsg.classList.add('show'); return; }

            if (tabAtiva === 'admin' && nome.toLowerCase() === 'admin' && senha === 'amovin2026') {
                sessionStorage.setItem('amovin_logado', 'true');
                sessionStorage.setItem('amovin_perfil', 'admin');
                sessionStorage.setItem('amovin_nome', 'Administrador');
                window.location.href = 'dashboard.html';
                return;
            }

            if (tabAtiva === 'recepcao' && !senha) {
                sessionStorage.setItem('amovin_logado', 'true');
                sessionStorage.setItem('amovin_perfil', 'recepcao');
                sessionStorage.setItem('amovin_nome', nome);
                window.location.href = 'dashboard.html';
                return;
            }

            erroMsg.textContent = 'Login ou senha invalidos.';
            erroMsg.classList.add('show');
        });

        onAuthStateChanged(auth, (user) => {
            if (user) { sessionStorage.setItem('amovin_logado', 'true'); window.location.href = 'dashboard.html'; }
        });

        history.pushState(null, null, location.href);
        window.addEventListener('popstate', () => { history.pushState(null, null, location.href); signOut(auth); sessionStorage.clear(); window.location.href = 'index.html'; });

        let timeout;
        function resetTimeout() { clearTimeout(timeout); timeout = setTimeout(() => { signOut(auth); sessionStorage.clear(); alert('Sessao expirada.'); window.location.href = 'index.html'; }, 30 * 60 * 1000); }
        document.addEventListener('mousemove', resetTimeout);
        document.addEventListener('keypress', resetTimeout);
        document.addEventListener('click', resetTimeout);
        resetTimeout();

        window.aceitarLGPD = function() { document.getElementById('lgpdBanner').style.display = 'none'; localStorage.setItem('lgpd_aceito', 'true'); };
        if (localStorage.getItem('lgpd_aceito') === 'true') document.getElementById('lgpdBanner').style.display = 'none';

        setInterval(function() { localStorage.setItem('amovin_keepalive', new Date().toISOString()); }, 300000);
    </script>
</body>
</html>
