<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMOVIN - Login Seguro</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-bottom: 80px;
        }

        /* Banner LGPD */
        .lgpd-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a2e;
            color: white;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 9999;
            font-size: 14px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
            gap: 20px;
            flex-wrap: wrap;
        }

        .lgpd-banner a { color: #667eea; text-decoration: underline; }

        .lgpd-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .lgpd-btn:hover { background: #5a6fd6; }

        /* Login */
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .login-header .logo {
            width: 90px;
            height: 90px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 40px;
            font-weight: bold;
            color: #764ba2;
        }

        .login-header h1 { font-size: 24px; margin-bottom: 5px; }
        .login-header p { font-size: 14px; opacity: 0.9; }

        .login-body { padding: 35px; }

        .form-group { margin-bottom: 25px; position: relative; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 50px 15px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }

        .olho-magico {
            position: absolute;
            right: 15px;
            top: 44px;
            cursor: pointer;
            font-size: 22px;
            background: none;
            border: none;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .olho-magico:hover { opacity: 1; }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-login:hover { transform: translateY(-2px); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .erro-msg {
            background: #fff5f5;
            color: #c33;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            border-left: 4px solid #c33;
            font-weight: 500;
        }

        .erro-msg.show { display: block; }

        .links-legal {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        .links-legal a { color: #667eea; text-decoration: none; margin: 0 8px; }
        .links-legal a:hover { text-decoration: underline; }

        @media (max-width: 500px) {
            .login-body { padding: 25px; }
            .lgpd-banner { flex-direction: column; text-align: center; padding: 15px 20px; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- Banner LGPD -->
    <div class="lgpd-banner" id="lgpdBanner">
        <span>
            🍪 Este site usa cookies essenciais. Ao continuar, você concorda com a 
            <a href="#">Política de Privacidade</a> (LGPD).
        </span>
        <button class="lgpd-btn" onclick="aceitarLGPD()">ENTENDI E ACEITO</button>
    </div>

    <!-- Login -->
    <div class="login-container">
        <div class="login-header">
            <div class="logo">A</div>
            <h1>AMOVIN</h1>
            <p>Associação e Movimento pela Inclusão</p>
        </div>

        <div class="login-body">
            <div class="erro-msg" id="erroMsg"></div>

            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label>📧 E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com" autocomplete="off">
                </div>

                <div class="form-group">
                    <label>🔒 Senha</label>
                    <input type="password" id="senha" required placeholder="••••••••" autocomplete="new-password">
                    <button type="button" class="olho-magico" onclick="toggleSenha()" tabindex="-1">👁️</button>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">🔐 Entrar</button>
            </form>

            <div class="links-legal">
                <a href="#">Privacidade</a> |
                <a href="#">Termos</a> |
                <span>🔒 LGPD</span>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDu5663V7pAamG2lzjD1i2CNTKh6uPZO3U",
            authDomain: "amovin-oficios-teste.firebaseapp.com",
            projectId: "amovin-oficios-teste",
            storageBucket: "amovin-oficios-teste.firebasestorage.app",
            messagingSenderId: "901387183295",
            appId: "1:901387183295:web:b9a445cbe259d1c14c120a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Verificar se já logado
        onAuthStateChanged(auth, (user) => {
            if (user) {
                sessionStorage.setItem('amovin_logado', 'true');
                sessionStorage.setItem('amovin_login_time', Date.now());
                window.location.href = 'dashboard.html';
            }
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btnLogin = document.getElementById('btnLogin');
            const erroMsg = document.getElementById('erroMsg');
            
            btnLogin.disabled = true;
            btnLogin.textContent = '⏳ Autenticando...';
            erroMsg.classList.remove('show');
            
            try {
                await signInWithEmailAndPassword(auth, email, senha);
                sessionStorage.setItem('amovin_logado', 'true');
                sessionStorage.setItem('amovin_login_time', Date.now());
                window.location.href = 'dashboard.html';
            } catch (error) {
                let mensagem = 'Erro ao fazer login.';
                if (error.code === 'auth/invalid-credential') mensagem = 'E-mail ou senha incorretos.';
                else if (error.code === 'auth/too-many-requests') mensagem = 'Muitas tentativas. Aguarde.';
                
                erroMsg.textContent = '❌ ' + mensagem;
                erroMsg.classList.add('show');
                btnLogin.disabled = false;
                btnLogin.textContent = '🔐 Entrar';
            }
        });

        // Olho mágico
        window.toggleSenha = function() {
            const senha = document.getElementById('senha');
            const olho = document.querySelector('.olho-magico');
            if (senha.type === 'password') {
                senha.type = 'text';
                olho.textContent = '🙈';
            } else {
                senha.type = 'password';
                olho.textContent = '👁️';
            }
        };

        // Segurança: bloquear voltar
        history.pushState(null, null, location.href);
        window.addEventListener('popstate', () => {
            history.pushState(null, null, location.href);
            signOut(auth);
            sessionStorage.clear();
            window.location.href = 'index.html';
        });

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                signOut(auth);
                sessionStorage.clear();
                window.location.reload();
            }
        });

        // Timeout 30 min
        let timeout;
        function resetTimeout() {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                if (sessionStorage.getItem('amovin_logado')) {
                    signOut(auth);
                    sessionStorage.clear();
                    alert('⏰ Sessão expirada.');
                    window.location.href = 'index.html';
                }
            }, 30 * 60 * 1000);
        }
        document.addEventListener('mousemove', resetTimeout);
        document.addEventListener('keypress', resetTimeout);
        document.addEventListener('click', resetTimeout);
        resetTimeout();

        // LGPD
        window.aceitarLGPD = function() {
            document.getElementById('lgpdBanner').style.display = 'none';
            localStorage.setItem('lgpd_aceito', 'true');
        };
        if (localStorage.getItem('lgpd_aceito') === 'true') {
            document.getElementById('lgpdBanner').style.display = 'none';
        }
    </script>
</body>
</html>
