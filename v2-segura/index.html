<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amovin ERP Social</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');

        :root {
            --gold-primary: #F5B800;
            --gold-dark: #D97706;
            --cream: #FFF8EB;
            --beige: #F9EFD9;
            --text: #3F2A1F;
            --text-soft: #6B5A46;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100dvh;
            background: linear-gradient(135deg, #FFF8EB 0%, #FDEDD4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, rgba(245, 184, 0, 0.16) 0%, transparent 60%);
            z-index: 0;
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            margin: 100px 20px 80px;
            z-index: 2;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.975);
            backdrop-filter: blur(32px);
            border: 1px solid rgba(245, 184, 0, 0.25);
            border-radius: 32px;
            padding: 52px 44px 44px;
            box-shadow: 0 40px 85px -20px rgba(245, 184, 0, 0.25),
                        0 0 0 1px rgba(255,255,255,0.9) inset;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 138px;
            line-height: 1;
            margin-bottom: 14px;
            filter: drop-shadow(0 28px 45px rgba(245, 184, 0, 0.32));
            animation: float 9s ease-in-out infinite;
        }

        .brand-main {
            font-family: 'Playfair Display', serif;
            font-size: 32.5px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -1.3px;
            line-height: 1.05;
        }

        .brand-subtitle {
            font-size: 13.8px;
            font-weight: 700;
            letter-spacing: 5.2px;
            color: var(--gold-dark);
            text-transform: uppercase;
            margin-top: 6px;
        }

        .system-name {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-soft);
            letter-spacing: 2.8px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .tagline {
            text-align: center;
            color: var(--text-soft);
            font-size: 15.2px;
            margin: 32px 0 38px;
            line-height: 1.5;
        }

        .tabs {
            display: flex;
            background: var(--beige);
            padding: 6px;
            border-radius: 22px;
            margin-bottom: 34px;
        }

        .tab {
            flex: 1;
            padding: 14px 12px;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.92rem;
            color: var(--text);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab.ativo {
            background: var(--gold-primary);           /* ← Apenas background muda */
            color: var(--text);                       /* ← Cor da letra permanece igual */
            box-shadow: 0 8px 20px -6px rgba(245, 184, 0, 0.35);
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.4px;
        }

        .form-group input {
            width: 100%;
            padding: 17px 22px;
            border: 2px solid #F0E0BE;
            border-radius: 18px;
            font-size: 1.06rem;
            transition: all 0.35s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 6px rgba(245, 184, 0, 0.15);
        }

        .olho-magico {
            position: absolute;
            right: 20px;
            top: 42px;
            font-size: 1.6rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #9C7A5F;
            opacity: 0.6;
        }

        .btn-entrar {
            width: 100%;
            padding: 18px;
            background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 1.12rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            cursor: pointer;
            box-shadow: 0 18px 38px -10px rgba(245, 184, 0, 0.45);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-entrar:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px -12px rgba(245, 184, 0, 0.55);
        }

        .erro-msg {
            background: #FEF2E8;
            color: #9F3F0F;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 0.88rem;
            border-left: 5px solid var(--gold-dark);
            display: none;
            margin-bottom: 22px;
        }

        .erro-msg.show { display: block; animation: shake 0.5s; }

        .footer {
            text-align: center;
            margin-top: 48px;
            font-size: 0.73rem;
            color: var(--text-soft);
            opacity: 0.7;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-24px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-7px); }
            75% { transform: translateX(7px); }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-container">
                <div class="logo">🌻</div>
                <div class="brand-main">Amovin ERP Social</div>
                <div class="system-name">SISTEMA DE GESTÃO</div>
            </div>

            <p class="tagline">Gestão inteligente com propósito e excelência</p>

            <div class="erro-msg" id="erroMsg"></div>

            <div class="tabs">
                <button class="tab ativo" onclick="mudarTab('admin', this)">Administrador</button>
                <button class="tab" onclick="mudarTab('recepcao', this)">Recepção</button>
                <button class="tab" onclick="mudarTab('consulta', this)">Consulta</button>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="nome" placeholder="Digite seu usuário" autocomplete="off">
                </div>
                <div class="form-group" id="grupoSenha">
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="••••••••">
                    <button type="button" class="olho-magico" onclick="toggleSenha()">👁️</button>
                </div>
                <button type="submit" class="btn-entrar">Entrar no Sistema</button>
            </form>

            <div class="footer">
                Desenvolvido por Vigorre Sistemas • 2026
            </div>
        </div>
    </div>

<script>
    let tabAtiva = 'admin';

    window.mudarTab = function(tab, botao) {
        tabAtiva = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
        botao.classList.add('ativo');
        
        const erro = document.getElementById('erroMsg');
        erro.classList.remove('show');
        
        document.getElementById('grupoSenha').style.display = (tab === 'recepcao') ? 'none' : 'block';
    };

    window.toggleSenha = function() {
        const senha = document.getElementById('senha');
        const olho = document.querySelector('.olho-magico');
        if (senha.type === 'password') {
            senha.type = 'text';
            olho.textContent = '🙈';
        } else {
            senha.type = 'password';
            olho.textContent = '👁️';
        }
    };

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const nome = document.getElementById('nome').value.trim();
        const senha = document.getElementById('senha').value;
        const erro = document.getElementById('erroMsg');

        if (!nome) {
            erro.textContent = 'Por favor, informe o usuário.';
            erro.classList.add('show');
            return;
        }

        if (tabAtiva === 'admin' && nome.toLowerCase() === 'admin' && senha === 'amovin2026') {
            sessionStorage.setItem('amovin_logado', 'true');
            sessionStorage.setItem('amovin_perfil', 'admin');
            window.location.href = 'dashboard.html';
            return;
        }

        if (tabAtiva === 'recepcao') {
            sessionStorage.setItem('amovin_logado', 'true');
            sessionStorage.setItem('amovin_perfil', 'recepcao');
            sessionStorage.setItem('amovin_nome', nome || 'Recepcionista');
            window.location.href = 'dashboard.html';
            return;
        }

        erro.textContent = 'Credenciais inválidas.';
        erro.classList.add('show');
    });
</script>
</body>
</html>
