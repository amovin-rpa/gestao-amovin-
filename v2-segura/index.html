<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMOVIN • Acesso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet">
<style>
:root {
  --amarelo: #E8B923;
  --amarelo-escuro: #D4A017;
  --grafite: #2C2C2C;
  --cinza: #6B7280;
  --fundo: #F8F4ED;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: linear-gradient(145deg, #F8F4ED 0%, #F1E9DD 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  flex-direction: column;
  gap: 20px;
}

.login-card {
  background: #FFFFFF;
  width: 100%;
  max-width: 380px;
  border-radius: 20px;
  padding: 48px 42px 42px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.08),
              0 0 0 1px rgba(0, 0, 0, 0.03);
  border: 1px solid #F0E9DF;
  text-align: center;
}

/* Logo e Identidade */
.logo {
  width: 120px;
  height: auto;
  margin-bottom: 8px;
  display: block;
  margin-left: auto;
  margin-right: auto;
}

.logo-fallback {
  font-size: 88px;
  margin-bottom: 2px;
  line-height: 1;
  filter: drop-shadow(0 4px 14px rgba(232, 185, 35, 0.18));
  display: none;
}

.brand {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 23px;
  font-weight: 700;
  color: var(--grafite);
  letter-spacing: -0.5px;
  margin-bottom: 1px;
}

.tagline {
  font-size: 10.5px;
  color: #8A8F98;
  letter-spacing: 2.2px;
  margin-bottom: 34px;
}

/* Tabs - Apenas background muda */
.tabs {
  display: flex;
  background: #F8F4ED;
  border-radius: 12px;
  padding: 5px;
  margin-bottom: 28px;
  gap: 4px;
}

.tab {
  flex: 1;
  padding: 10px 0;
  border: none;
  background: transparent;
  font-size: 12.5px;
  font-weight: 600;
  color: #6B7280;
  border-radius: 9px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.tab.active {
  background: #E8B923;
  color: #2C2C2C;
  box-shadow: 0 2px 8px rgba(232, 185, 35, 0.25);
  font-weight: 700;
}

/* Formulário */
.form-group {
  margin-bottom: 17px;
  text-align: left;
}

.form-group label {
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.form-group input {
  width: 100%;
  padding: 14px 17px;
  border: 1.5px solid #EDE5D9;
  border-radius: 13px;
  font-size: 15px;
  transition: all 0.2s ease;
  background: #fff;
}

.form-group input:focus {
  border-color: #E8B923;
  box-shadow: 0 0 0 4px rgba(232, 185, 35, 0.1);
  outline: none;
}

.btn {
  width: 100%;
  padding: 15px;
  background: #E8B923;
  color: #2C2C2C;
  border: none;
  border-radius: 13px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 10px;
  box-shadow: 0 4px 14px rgba(232, 185, 35, 0.25);
}

.btn:hover {
  background: #D4A017;
  transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(232, 185, 35, 0.3);
}

.erro {
  background: #FFF5F5;
  color: #B91C1C;
  padding: 11px 13px;
  border-radius: 9px;
  font-size: 12.5px;
  margin-bottom: 16px;
  display: none;
  border-left: 3px solid #B91C1C;
  text-align: left;
}

.erro.show { display: block; }

/* Rodapé */
.rodape {
  background: #FFFFFF;
  width: 100%;
  max-width: 380px;
  border-radius: 14px;
  padding: 18px 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
  border: 1px solid #F0E9DF;
  text-align: center;
}

.rodape .logo-vigorre {
  width: 110px;
  height: auto;
  margin-bottom: 8px;
  display: block;
  margin-left: auto;
  margin-right: auto;
}

.rodape .logo-vigorre-fallback {
  font-size: 14px;
  font-weight: 700;
  color: var(--grafite);
  display: none;
}

.rodape .copyright {
  font-size: 9px;
  color: #8A8F98;
  margin-bottom: 6px;
  letter-spacing: 0.3px;
}

.rodape .marca {
  font-size: 11px;
  font-weight: 600;
  color: var(--grafite);
  margin-bottom: 8px;
}

.rodape .marca .tm {
  font-size: 7px;
  vertical-align: super;
}

.rodape p {
  font-size: 10px;
  color: #8A8F98;
  margin: 2px 0;
  line-height: 1.5;
}

.rodape a {
  color: #C65A11;
  text-decoration: none;
  font-weight: 500;
}

.rodape .divider {
  color: #D1D5DB;
  margin: 0 6px;
}

/* LGPD */
.lgpd-banner {
  background: #FFFFFF;
  width: 100%;
  max-width: 380px;
  border-radius: 14px;
  padding: 12px 18px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
  border: 1px solid #F0E9DF;
  font-size: 10px;
  color: #6B7280;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.lgpd-banner button {
  background: #E8B923;
  color: #2C2C2C;
  border: none;
  padding: 7px 14px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: 700;
  font-size: 10px;
  white-space: nowrap;
  transition: all 0.2s ease;
}

.lgpd-banner button:hover {
  background: #D4A017;
}
</style>
</head>
<body>

<div class="login-card">
  
  <!-- Logo AMOVIN -->
  <img src="images/amovin-logo.png" alt="AMOVIN" class="logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
  <div class="logo-fallback">🌻</div>
  
  <div class="brand">Amovin ERP Social</div>
  <div class="tagline">SISTEMA DE GESTÃO</div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="admin">Administrador</button>
    <button class="tab" data-tab="recepcao">Recepção</button>
    <button class="tab" data-tab="consulta">Consulta</button>
  </div>

  <div class="erro" id="erroMsg"></div>

  <!-- Formulário -->
  <form id="loginForm">
    <div class="form-group">
      <label>Login</label>
      <input type="text" id="nome" required placeholder="Seu login">
    </div>
    
    <div class="form-group" id="grupoSenha">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="••••••••">
    </div>

    <button type="submit" class="btn">Entrar no Sistema</button>
  </form>

</div>

<!-- LGPD -->
<div class="lgpd-banner" id="lgpdBanner">
  <span>🍪 Cookies essenciais. Ao continuar, você concorda com a <strong>LGPD</strong>.</span>
  <button onclick="document.getElementById('lgpdBanner').style.display='none';localStorage.setItem('lgpd_aceito','true');">ENTENDI</button>
</div>

<!-- Rodapé Vigorre -->
<div class="rodape">
  <img src="images/logo-vigorre.png" alt="Vigorre Sistemas" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
  <div class="logo-vigorre-fallback">Vigorre Sistemas</div>
  
  <div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span>. Todos os direitos reservados.</div>
  <div class="marca">Vigorre ERP Social<span class="tm">™</span></div>
  
  <p>
    <a href="https://www.vigorre.com.br" target="_blank">www.vigorre.com.br</a>
    <span class="divider">|</span>
    <a href="https://wa.me/5534991850735" target="_blank">(34) 99185-0735</a>
  </p>
  <p style="font-size:9px;color:#aaa;">contato@vigorre.com.br</p>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDu5663V7pAamG2lzjD1i2CNTKh6uPZO3U",
    authDomain: "amovin-oficios-teste.firebaseapp.com",
    projectId: "amovin-oficios-teste",
    storageBucket: "amovin-oficios-teste.firebasestorage.app",
    messagingSenderId: "901387183295",
    appId: "1:901387183295:web:b9a445cbe259d1c14c120a"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  let tabAtiva = 'admin';

  if (localStorage.getItem('lgpd_aceito') === 'true') {
    document.getElementById('lgpdBanner').style.display = 'none';
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      tabAtiva = tab.dataset.tab;
      document.getElementById('erroMsg').classList.remove('show');
    });
  });

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const nome = document.getElementById('nome').value.trim();
    const senha = document.getElementById('senha').value;
    const erro = document.getElementById('erroMsg');

    if (!nome) {
      erro.textContent = 'Por favor, informe seu login.';
      erro.classList.add('show');
      return;
    }

    if (tabAtiva === 'admin' && nome.toLowerCase() === 'admin' && senha === 'amovin2026') {
      sessionStorage.setItem('amovin_logado', 'true');
      sessionStorage.setItem('amovin_perfil', 'admin');
      sessionStorage.setItem('amovin_nome', 'Administrador');
      window.location.href = 'dashboard.html';
      return;
    }

    if (tabAtiva === 'recepcao' && !senha) {
      sessionStorage.setItem('amovin_logado', 'true');
      sessionStorage.setItem('amovin_perfil', 'recepcao');
      sessionStorage.setItem('amovin_nome', nome);
      window.location.href = 'dashboard.html';
      return;
    }

    erro.textContent = 'Credenciais inválidas. Tente novamente.';
    erro.classList.add('show');
  });

  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
