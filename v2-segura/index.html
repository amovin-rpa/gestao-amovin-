<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMOVIN ERP Social</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --primary: #C65A11;
            --primary-dark: #9F470D;
            --cream: #F9F4EB;
            --beige: #F0E6D9;
            --text-dark: #3F2A1F;
            --text-soft: #5C4635;
            --shadow: 0 25px 50px -12px rgb(198 90 17 / 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100dvh;
            background: linear-gradient(135deg, #F9F4EB 0%, #F0E6D9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, rgba(245, 197, 24, 0.08) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(28px);
            border: 1px solid rgba(198, 90, 17, 0.15);
            border-radius: 32px;
            width: 100%;
            max-width: 480px;
            padding: 60px 52px;
            box-shadow: var(--shadow), 
                        0 0 0 1px rgba(255,255,255,0.6) inset;
            position: relative;
            z-index: 2;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 148px;
            line-height: 1;
            filter: drop-shadow(0 20px 30px rgba(198, 90, 17, 0.25));
            margin-bottom: 12px;
            animation: float 8s ease-in-out infinite;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1.2px;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .brand-subtitle {
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: 3.5px;
            color: var(--primary);
            opacity: 0.9;
        }

        .tagline {
            text-align: center;
            color: var(--text-soft);
            font-size: 15.5px;
            margin-top: 8px;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .tabs {
            display: flex;
            background: var(--beige);
            padding: 6px;
            border-radius: 20px;
            margin-bottom: 32px;
        }

        .tab {
            flex: 1;
            padding: 14px 10px;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-soft);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab.ativo {
            background: white;
            color: var(--primary);
            box-shadow: 0 10px 15px -3px rgb(198 90 17 / 0.15);
        }

        .form-group {
            margin-bottom: 26px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .form-group input {
            width: 100%;
            padding: 18px 22px;
            border: 2px solid #EDE0CF;
            border-radius: 18px;
            font-size: 1.05rem;
            transition: all 0.35s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 6px rgba(198, 90, 17, 0.09);
        }

        .olho-magico {
            position: absolute;
            right: 22px;
            top: 42px;
            font-size: 1.45rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #8C6F55;
            opacity: 0.5;
        }

        .btn-entrar {
            width: 100%;
            padding: 18px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 15px 35px -10px rgba(198, 90, 17, 0.35);
        }

        .btn-entrar:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 45px -8px rgba(198, 90, 17, 0.45);
        }

        .erro-msg {
            background: #FEF2F2;
            color: #9F1F1F;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 0.9rem;
            border-left: 5px solid #C65A11;
            display: none;
            margin-bottom: 24px;
        }

        .erro-msg.show { display: block; animation: shake 0.5s; }

        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.73rem;
            color: #8C6F55;
            opacity: 0.65;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <!-- Substitua o src pela sua logo real (com nome da associação) -->
            <!-- <img src="logo-amovin.png" alt="AMOVIN" style="width: 260px; height: auto;"> -->
            <div class="logo">🌻</div>
            <div class="brand-name">AMOVIN</div>
            <div class="brand-subtitle">ERP SOCIAL</div>
        </div>

        <p class="tagline">Gestão inteligente com propósito e inclusão</p>

        <div class="erro-msg" id="erroMsg"></div>

        <div class="tabs">
            <button class="tab ativo" onclick="mudarTab('admin', this)">Admin</button>
            <button class="tab" onclick="mudarTab('recepcao', this)">Recepção</button>
            <button class="tab" onclick="mudarTab('consulta', this)">Consulta</button>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" id="nome" placeholder="Digite seu usuário" autocomplete="off">
            </div>
            <div class="form-group" id="grupoSenha">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="••••••••">
                <button type="button" class="olho-magico" onclick="toggleSenha()">👁️</button>
            </div>
            <button type="submit" class="btn-entrar">Entrar no Sistema</button>
        </form>

        <div class="footer">
            Desenvolvido por Vigorre Sistemas • 2026
        </div>
    </div>

<script>
    let tabAtiva = 'admin';

    window.mudarTab = function(tab, botao) {
        tabAtiva = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
        botao.classList.add('ativo');
        document.getElementById('erroMsg').classList.remove('show');
        document.getElementById('grupoSenha').style.display = (tab === 'recepcao') ? 'none' : 'block';
    };

    window.toggleSenha = function() {
        const senha = document.getElementById('senha');
        const olho = document.querySelector('.olho-magico');
        if (senha.type === 'password') {
            senha.type = 'text';
            olho.textContent = '🙈';
        } else {
            senha.type = 'password';
            olho.textContent = '👁️';
        }
    };

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const nome = document.getElementById('nome').value.trim();
        const senha = document.getElementById('senha').value;
        const erro = document.getElementById('erroMsg');

        if (!nome) {
            erro.textContent = 'Por favor, informe o usuário.';
            erro.classList.add('show');
            return;
        }

        if (tabAtiva === 'admin' && nome.toLowerCase() === 'admin' && senha === 'amovin2026') {
            sessionStorage.setItem('amovin_logado', 'true');
            sessionStorage.setItem('amovin_perfil', 'admin');
            window.location.href = 'dashboard.html';
            return;
        }

        if (tabAtiva === 'recepcao') {
            sessionStorage.setItem('amovin_logado', 'true');
            sessionStorage.setItem('amovin_perfil', 'recepcao');
            sessionStorage.setItem('amovin_nome', nome || 'Recepcionista');
            window.location.href = 'dashboard.html';
            return;
        }

        erro.textContent = 'Credenciais inválidas.';
        erro.classList.add('show');
    });
</script>
</body>
</html>
