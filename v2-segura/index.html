<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amovin ERP Social</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap');

        :root {
            --yellow-primary: #F5B800;
            --yellow-dark: #D97706;
            --yellow-glow: #FFDB4D;
            --cream: #FFF8EB;
            --beige: #F9EFD9;
            --text: #3F2A1F;
            --text-soft: #6B5A46;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100dvh;
            background: linear-gradient(135deg, #FFF8EB 0%, #FDEDD4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 25%, rgba(245, 184, 0, 0.14) 0%, transparent 55%);
            z-index: 0;
        }

        .login-wrapper {
            width: 100%;
            max-width: 390px;
            margin: 80px 20px;
            z-index: 2;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(32px);
            border: 1px solid rgba(245, 184, 0, 0.22);
            border-radius: 32px;
            padding: 48px 42px 42px;
            box-shadow: 0 35px 80px -20px rgba(245, 184, 0, 0.22),
                        0 0 0 1px rgba(255,255,255,0.85) inset;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 142px;
            line-height: 1;
            margin-bottom: 12px;
            filter: drop-shadow(0 25px 40px rgba(245, 184, 0, 0.35));
            animation: float 8.5s ease-in-out infinite;
        }

        .brand-main {
            font-family: 'Playfair Display', serif;
            font-size: 31px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -1.1px;
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 13.2px;
            font-weight: 700;
            letter-spacing: 4.8px;
            color: var(--yellow-dark);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .system-name {
            font-size: 11.8px;
            font-weight: 600;
            color: var(--text-soft);
            letter-spacing: 2.2px;
            text-transform: uppercase;
        }

        .tagline {
            text-align: center;
            color: var(--text-soft);
            font-size: 15px;
            margin: 32px 0 36px;
            line-height: 1.45;
        }

        .tabs {
            display: flex;
            background: var(--beige);
            padding: 6px;
            border-radius: 20px;
            margin-bottom: 32px;
        }

        .tab {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-soft);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab.ativo {
            background: white;
            color: var(--yellow-dark);
            box-shadow: 0 10px 25px -8px rgba(245, 184, 0, 0.25);
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.73rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.3px;
        }

        .form-group input {
            width: 100%;
            padding: 17px 20px;
            border: 2px solid #F0E0C0;
            border-radius: 18px;
            font-size: 1.05rem;
            transition: all 0.35s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--yellow-primary);
            box-shadow: 0 0 0 6px rgba(245, 184, 0, 0.12);
        }

        .olho-magico {
            position: absolute;
            right: 18px;
            top: 41px;
            font-size: 1.55rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #B38A5E;
            opacity: 0.6;
        }

        .btn-entrar {
            width: 100%;
            padding: 17.5px;
            background: linear-gradient(90deg, var(--yellow-primary), #E89B00);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            cursor: pointer;
            box-shadow: 0 15px 35px -10px rgba(245, 184, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-entrar:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 45px -8px rgba(245, 184, 0, 0.5);
        }

        .erro-msg {
            background: #FEF2E8;
            color: #9F3F0F;
            padding: 13px 16px;
            border-radius: 12px;
            font-size: 0.87rem;
            border-left: 4px solid var(--yellow-dark);
            display: none;
            margin-bottom: 20px;
        }

        .erro-msg.show { display: block; animation: shake 0.5s; }

        .footer {
            text-align: center;
            margin-top: 48px;
            font-size: 0.73rem;
            color: var(--text-soft);
            opacity: 0.65;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-26px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-container">
                <div class="logo">🌻</div>
                <div class="brand-main">Amovin</div>
                <div class="brand-subtitle">ERP SOCIAL</div>
                <div class="system-name">Sistema de Gestão</div>
            </div>

            <p class="tagline">Inclusão, transparência e excelência na gestão social</p>

            <div class="erro-msg" id="erroMsg"></div>

            <div class="tabs">
                <button class="tab ativo" onclick="mudarTab('admin', this)">Admin</button>
                <button class="tab" onclick="mudarTab('recepcao', this)">Recepção</button>
                <button class="tab" onclick="mudarTab('consulta', this)">Consulta</button>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="nome" placeholder="Digite seu usuário" autocomplete="off">
                </div>
                <div class="form-group" id="grupoSenha">
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="••••••••">
                    <button type="button" class="olho-magico" onclick="toggleSenha()">👁️</button>
                </div>
                <button type="submit" class="btn-entrar">Entrar no Sistema</button>
            </form>

            <div class="footer">
                Vigorre Sistemas • 2026
            </div>
        </div>
    </div>

<script>
    let tabAtiva = 'admin';

    window.mudarTab = function(tab, botao) {
        tabAtiva = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
        botao.classList.add('ativo');
        document.getElementById('erroMsg').classList.remove('show');
        document.getElementById('grupoSenha').style.display = (tab === 'recepcao') ? 'none' : 'block';
    };

    window.toggleSenha = function() {
        const senha = document.getElementById('senha');
        const olho = document.querySelector('.olho-magico');
        if (senha.type === 'password') {
            senha.type = 'text';
            olho.textContent = '🙈';
        } else {
            senha.type = 'password';
            olho.textContent = '👁️';
        }
    };

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const nome = document.getElementById('nome').value.trim();
        const senha = document.getElementById('senha').value;
        const erro = document.getElementById('erroMsg');

        if (!nome) {
            erro.textContent = 'Por favor, informe o usuário.';
            erro.classList.add('show');
            return;
        }

        if (tabAtiva === 'admin' && nome.toLowerCase() === 'admin' && senha === 'amovin2026') {
            sessionStorage.setItem('amovin_logado', 'true');
            sessionStorage.setItem('amovin_perfil', 'admin');
            window.location.href = 'dashboard.html';
            return;
        }

        if (tabAtiva === 'recepcao') {
            sessionStorage.setItem('amovin_logado', 'true');
            sessionStorage.setItem('amovin_perfil', 'recepcao');
            sessionStorage.setItem('amovin_nome', nome || 'Recepcionista');
            window.location.href = 'dashboard.html';
            return;
        }

        erro.textContent = 'Credenciais inválidas.';
        erro.classList.add('show');
    });
</script>
</body>
</html>
