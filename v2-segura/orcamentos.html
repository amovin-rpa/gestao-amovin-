<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • Orçamentos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11;
  --amarelo: #F5C518;
  --verde: #57C220;
  --azul: #1E88E5;
  --grafite: #1A1A1A;
  --cinza: #6B7280;
  --cinza-claro: #F8F4ED;
  --branco: #FFFFFF;
  --vermelho: #E53935;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.topo-bar h1 span { font-size: 14px; font-weight: 400; color: var(--cinza); margin-left: 12px; }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 22px; }
.kpi-card { background: #FFFFFF; padding: 18px; border-radius: 14px; border: 1px solid #F0E9DF; text-align: center; }
.kpi-card .kpi-valor { font-size: 24px; font-weight: 800; color: var(--laranja); }
.kpi-card .kpi-label { font-size: 11px; color: var(--cinza); }

.grid-orcamentos { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: #FFFFFF; padding: 24px; border-radius: 14px; border: 1px solid #F0E9DF; }
.card h3 { font-size: 16px; font-weight: 700; color: var(--grafite); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #F0E9DF; display: flex; justify-content: space-between; align-items: center; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--cinza); margin-bottom: 4px; text-transform: uppercase; }
.form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 12px; }
.btn-salvar { background: var(--laranja); color: white; }
.btn-editar { background: var(--amarelo); color: #1A1A1A; }
.btn-excluir { background: var(--vermelho); color: white; }
.btn-verde { background: var(--verde); color: white; }

.orcamento-item { padding: 12px 16px; border-bottom: 1px solid #F0E9DF; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
.orcamento-item .descricao { font-weight: 600; color: var(--grafite); font-size: 13px; }
.orcamento-item .valor { font-weight: 700; }
.orcamento-item .valor.vencedor { color: var(--verde); }
.orcamento-item .valor.normal { color: var(--cinza); }
.orcamento-item .fornecedor { font-size: 12px; color: var(--cinza); }
.orcamento-item .status { font-size: 10px; padding: 2px 10px; border-radius: 12px; font-weight: 600; }
.status-pendente { background: #FFF3E0; color: #E65100; }
.status-aprovado { background: #E8F5E9; color: #2E7D32; }
.status-reprovado { background: #FFEBEE; color: #C62828; }
.sem-dados { text-align: center; padding: 30px; color: #9CA3AF; }

.rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
.rodape-grid { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rodape-logo { flex-shrink: 0; } .rodape-logo .logo-vigorre { width: 50px; }
.rodape-info { flex: 1; } .rodape-info .copyright { font-size: 8px; color: #8A8F98; } .rodape-info .tm { font-size: 6px; vertical-align: super; }
.rodape-info .contato { font-size: 9px; color: #8A8F98; } .rodape-info a { color: #C65A11; text-decoration: none; } .rodape-info .email { font-size: 8px; color: #aaa; }
.logo-vigorre-fallback { font-size: 12px; font-weight: 700; display: none; }

@media (max-width: 900px) { .main-content { margin-left: 0; } .grid-orcamentos { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="menu-container"></div>

<main class="main-content">
  <div class="topo-bar"><h1>📊 Orçamentos <span>Gestão de cotações e propostas</span></h1><button class="btn-sair-topo" onclick="window.location.href='dashboard.html'">🏠 Dashboard</button></div>

  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-valor" id="kpiTotal">0</div><div class="kpi-label">📋 Total</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiPendentes">0</div><div class="kpi-label">⏳ Pendentes</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiAprovados">0</div><div class="kpi-label">✅ Aprovados</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiValorTotal">R$ 0</div><div class="kpi-label">💰 Valor Total</div></div>
  </div>

  <div class="grid-orcamentos">
    <div class="card">
      <h3>📝 Novo Orçamento</h3>
      <input type="hidden" id="orcamentoId">
      <div class="form-group"><label>Descrição *</label><input type="text" id="descricaoOrcamento" placeholder="Ex: Material Esportivo"></div>
      <div class="form-group"><label>Fornecedor *</label><input type="text" id="fornecedorOrcamento" placeholder="Nome da empresa"></div>
      <div class="form-row"><div class="form-group"><label>Valor (R$) *</label><input type="number" id="valorOrcamento" step="0.01" placeholder="0,00"></div><div class="form-group"><label>Data</label><input type="date" id="dataOrcamento"></div></div>
      <div class="form-group"><label>Categoria</label><select id="categoriaOrcamento"><option>Material</option><option>Serviço</option><option>Equipamento</option><option>Evento</option><option>Outros</option></select></div>
      <div class="form-group"><label>Observações</label><input type="text" id="obsOrcamento" placeholder="Informações adicionais..."></div>
      <button class="btn btn-salvar" onclick="salvarOrcamento()" style="width:100%;padding:12px;font-size:14px;">💾 Salvar Orçamento</button>
    </div>
    <div class="card">
      <h3>📋 Orçamentos</h3>
      <div id="listaOrcamentos"><div class="sem-dados">Nenhum orçamento.</div></div>
    </div>
  </div>

  <div class="rodape">
    <div class="rodape-grid">
      <div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-vigorre-fallback">Vigorre</span></div>
      <div class="rodape-info">
        <div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span> | Padrão SAP S/4HANA</div>
        <div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div>
        <div class="email">contato@vigorre.com.br</div>
      </div>
    </div>
  </div>
</main>

<script src="menu.js"></script>
<script>
var orcamentos = JSON.parse(localStorage.getItem('amovin_orcamentos') || '[]');
var editandoId = null;
if (orcamentos.length === 0) {
    orcamentos = [
        { id: 1, descricao: 'Material Esportivo - Bola de Vôlei', fornecedor: 'Loja Esportiva A', valor: 1500, data: new Date().toISOString().split('T')[0], categoria: 'Material', status: 'pendente', obs: '10 unidades' },
        { id: 2, descricao: 'Manutenção de Equipamentos', fornecedor: 'Serviços Técnicos B', valor: 800, data: new Date().toISOString().split('T')[0], categoria: 'Serviço', status: 'aprovado', obs: 'Orçamento aprovado' }
    ];
    salvar();
}
function salvar() { localStorage.setItem('amovin_orcamentos', JSON.stringify(orcamentos)); }
function fm(v) { return 'R$ ' + (v||0).toFixed(2).replace('.', ','); }
function getStatusLabel(status) {
    var map = { 'pendente': '⏳ Pendente', 'aprovado': '✅ Aprovado', 'reprovado': '❌ Reprovado' };
    return map[status] || status;
}
function getStatusClass(status) {
    var map = { 'pendente': 'status-pendente', 'aprovado': 'status-aprovado', 'reprovado': 'status-reprovado' };
    return map[status] || 'status-pendente';
}
function atualizarKPIs() {
    var total = orcamentos.length;
    var pendentes = orcamentos.filter(function(o) { return o.status === 'pendente'; }).length;
    var aprovados = orcamentos.filter(function(o) { return o.status === 'aprovado'; }).length;
    var valorTotal = orcamentos.reduce(function(s, o) { return s + o.valor; }, 0);
    document.getElementById('kpiTotal').textContent = total;
    document.getElementById('kpiPendentes').textContent = pendentes;
    document.getElementById('kpiAprovados').textContent = aprovados;
    document.getElementById('kpiValorTotal').textContent = fm(valorTotal);
}
function renderizarOrcamentos() {
    var lista = orcamentos.slice().sort(function(a, b) { return new Date(b.data) - new Date(a.data); });
    var container = document.getElementById('listaOrcamentos');
    if (lista.length === 0) {
        container.innerHTML = '<div class="sem-dados">Nenhum orçamento.</div>';
        return;
    }
    container.innerHTML = lista.map(function(o) {
        var data = new Date(o.data + 'T00:00:00').toLocaleDateString('pt-BR');
        var statusLabel = getStatusLabel(o.status);
        var statusClass = getStatusClass(o.status);
        var valorClass = o.status === 'aprovado' ? 'vencedor' : 'normal';
        return '<div class="orcamento-item">' +
            '<div><span class="descricao">' + o.descricao + '</span><br><span class="fornecedor">🏢 ' + o.fornecedor + ' | ' + o.categoria + ' | ' + data + '</span></div>' +
            '<div><span class="valor ' + valorClass + '">' + fm(o.valor) + '</span> <span class="status ' + statusClass + '">' + statusLabel + '</span>' +
            (o.status === 'pendente' ? '<button class="btn btn-verde" onclick="aprovarOrcamento(' + o.id + ')" style="padding:4px 8px;font-size:10px;">✅</button>' : '') +
            (o.status === 'pendente' ? '<button class="btn btn-excluir" onclick="reprovarOrcamento(' + o.id + ')" style="padding:4px 8px;font-size:10px;">❌</button>' : '') +
            '<button class="btn btn-editar" onclick="editarOrcamento(' + o.id + ')" style="padding:4px 8px;font-size:10px;">✏️</button>' +
            '<button class="btn btn-excluir" onclick="excluirOrcamento(' + o.id + ')" style="padding:4px 8px;font-size:10px;">🗑️</button></div></div>';
    }).join('');
}
window.salvarOrcamento = function() {
    var descricao = document.getElementById('descricaoOrcamento').value.trim();
    var fornecedor = document.getElementById('fornecedorOrcamento').value.trim();
    var valor = parseFloat(document.getElementById('valorOrcamento').value) || 0;
    var data = document.getElementById('dataOrcamento').value;
    if (!descricao) { alert('Preencha a descrição!'); return; }
    if (!fornecedor) { alert('Preencha o fornecedor!'); return; }
    if (valor <= 0) { alert('Valor deve ser maior que zero!'); return; }
    if (!data) { alert('Selecione a data!'); return; }
    var dados = {
        descricao: descricao,
        fornecedor: fornecedor,
        valor: valor,
        data: data,
        categoria: document.getElementById('categoriaOrcamento').value,
        status: 'pendente',
        obs: document.getElementById('obsOrcamento').value.trim()
    };
    if (editandoId) {
        var idx = orcamentos.findIndex(function(o) { return o.id === editandoId; });
        if (idx >= 0) {
            for (var k in dados) orcamentos[idx][k] = dados[k];
        }
        editandoId = null;
    } else {
        dados.id = Date.now();
        orcamentos.push(dados);
    }
    salvar();
    limparForm();
    atualizarKPIs();
    renderizarOrcamentos();
    alert('✅ Orçamento salvo com sucesso!');
};
window.editarOrcamento = function(id) {
    var o = orcamentos.find(function(x) { return x.id === id; });
    if (!o) return;
    editandoId = id;
    document.getElementById('orcamentoId').value = id;
    document.getElementById('descricaoOrcamento').value = o.descricao;
    document.getElementById('fornecedorOrcamento').value = o.fornecedor;
    document.getElementById('valorOrcamento').value = o.valor;
    document.getElementById('dataOrcamento').value = o.data;
    document.getElementById('categoriaOrcamento').value = o.categoria;
    document.getElementById('obsOrcamento').value = o.obs || '';
    document.querySelector('.card h3').textContent = '✏️ Editando: ' + o.descricao;
};
window.excluirOrcamento = function(id) {
    if (!confirm('Excluir este orçamento?')) return;
    orcamentos = orcamentos.filter(function(o) { return o.id !== id; });
    salvar();
    atualizarKPIs();
    renderizarOrcamentos();
};
window.aprovarOrcamento = function(id) {
    var o = orcamentos.find(function(x) { return x.id === id; });
    if (o) {
        o.status = 'aprovado';
        salvar();
        atualizarKPIs();
        renderizarOrcamentos();
        alert('✅ Orçamento aprovado!');
    }
};
window.reprovarOrcamento = function(id) {
    if (!confirm('Reprovar este orçamento?')) return;
    var o = orcamentos.find(function(x) { return x.id === id; });
    if (o) {
        o.status = 'reprovado';
        salvar();
        atualizarKPIs();
        renderizarOrcamentos();
        alert('❌ Orçamento reprovado.');
    }
};
function limparForm() {
    editandoId = null;
    document.getElementById('orcamentoId').value = '';
    document.getElementById('descricaoOrcamento').value = '';
    document.getElementById('fornecedorOrcamento').value = '';
    document.getElementById('valorOrcamento').value = '';
    document.getElementById('dataOrcamento').value = new Date().toISOString().split('T')[0];
    document.getElementById('categoriaOrcamento').value = 'Material';
    document.getElementById('obsOrcamento').value = '';
    document.querySelector('.card h3').textContent = '📝 Novo Orçamento';
}
document.getElementById('dataOrcamento').value = new Date().toISOString().split('T')[0];
if (!sessionStorage.getItem('amovin_logado')) { window.location.href = 'index.html'; }
atualizarKPIs();
renderizarOrcamentos();
</script>
</body>
</html>
