<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • Assistente IA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11;
  --amarelo: #F5C518;
  --verde: #57C220;
  --azul: #1E88E5;
  --grafite: #1A1A1A;
  --cinza: #6B7280;
  --cinza-claro: #F8F4ED;
  --branco: #FFFFFF;
  --vermelho: #E53935;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

/* A SIDEBAR FOI REMOVIDA DAQUI - VEM DO menu.js */

.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

.grid-ia { display: grid; grid-template-columns: 260px 1fr; gap: 20px; min-height: 500px; }
.card { background: #FFFFFF; padding: 22px; border-radius: 14px; border: 1px solid #F0E9DF; }
.card h3 { font-size: 16px; font-weight: 700; color: var(--grafite); margin-bottom: 15px; padding-bottom: 12px; border-bottom: 1px solid #F0E9DF; }
.comando { display: block; width: 100%; padding: 10px 14px; margin-bottom: 6px; background: #F8F4ED; border: none; border-radius: 8px; cursor: pointer; text-align: left; font-size: 12px; color: var(--cinza); font-family: 'Inter', sans-serif; transition: all 0.2s; }
.comando:hover { background: #FFF3E0; color: var(--laranja); }
.chat-mensagens { height: 350px; overflow-y: auto; background: #F8F4ED; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
.msg { margin-bottom: 12px; display: flex; gap: 8px; }
.msg.usuario { justify-content: flex-end; }
.bolha { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5; }
.msg.ia .bolha { background: #FFF3E0; color: var(--grafite); }
.msg.usuario .bolha { background: var(--laranja); color: white; }
.chat-input { display: flex; gap: 10px; }
.chat-input input { flex: 1; padding: 12px 16px; border: 1px solid #E5E0D8; border-radius: 25px; font-size: 13px; font-family: 'Inter', sans-serif; outline: none; }
.chat-input input:focus { border-color: var(--laranja); }
.chat-input button { padding: 12px 22px; background: var(--laranja); color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: 700; transition: background 0.2s; }
.chat-input button:hover { background: #A04A0E; }
.ia-status { font-size: 11px; color: var(--cinza); margin-top: 8px; text-align: center; }

.rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
.rodape-grid { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rodape-logo { flex-shrink: 0; } .rodape-logo .logo-vigorre { width: 50px; }
.rodape-info { flex: 1; } .rodape-info .copyright { font-size: 8px; color: #8A8F98; } .rodape-info .tm { font-size: 6px; vertical-align: super; }
.rodape-info .contato { font-size: 9px; color: #8A8F98; } .rodape-info a { color: #C65A11; text-decoration: none; } .rodape-info .email { font-size: 8px; color: #aaa; }
.logo-vigorre-fallback { font-size: 12px; font-weight: 700; display: none; }

@media (max-width: 768px) { .main-content { margin-left: 0; } .grid-ia { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- O MENU SERÁ CARREGADO PELO menu.js -->

<main class="main-content">
  <div class="topo-bar"><h1>🤖 Assistente IA</h1><button class="btn-sair-topo" onclick="window.location.href='index.html'">🚪 Sair</button></div>

  <div class="grid-ia">
    <div class="card">
      <h3>Comandos Rápidos</h3>
      <button class="comando" onclick="perguntar('Criar um ofício para a Prefeitura solicitando apoio para projeto social')">📄 Criar Ofício</button>
      <button class="comando" onclick="perguntar('Gerar um projeto social para jovens em situação de vulnerabilidade')">📋 Criar Projeto</button>
      <button class="comando" onclick="perguntar('Sugerir estratégias de captação de recursos para ONG')">💰 Captação</button>
      <button class="comando" onclick="perguntar('Modelo de termo de parceria para profissionais voluntários')">📝 Termo de Parceria</button>
      <button class="comando" onclick="perguntar('Como fazer prestação de contas para editais')">📊 Prestação de Contas</button>
      <button class="comando" onclick="perguntar('Sugerir indicadores de impacto social para projeto esportivo')">🎯 Indicadores</button>
      <button class="comando" onclick="perguntar('O que é LGPD e como aplicar na AMOVIN?')">🔒 LGPD</button>
    </div>
    <div class="card">
      <h3>💬 Chat com IA</h3>
      <div class="chat-mensagens" id="chatMensagens"><div class="msg ia"><div class="bolha">Olá! Sou o assistente virtual da AMOVIN. Como posso ajudar?</div></div></div>
      <div class="chat-input"><input type="text" id="inputMsg" placeholder="Digite sua pergunta..." onkeypress="if(event.key==='Enter')enviarMensagem()"><button onclick="enviarMensagem()">Enviar</button></div>
      <div class="ia-status" id="iaStatus">⚡ Gemini IA - Pronto para usar</div>
    </div>
  </div>

  <div class="rodape"><div class="rodape-grid"><div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-vigorre-fallback">Vigorre</span></div><div class="rodape-info"><div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span></div><div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div><div class="email">contato@vigorre.com.br</div></div></div></div>
</main>

<script>
function adicionarMensagem(t, tipo) {
    var container = document.getElementById('chatMensagens');
    var d = document.createElement('div');
    d.className = 'msg ' + tipo;
    d.innerHTML = '<div class="bolha">' + t + '</div>';
    container.appendChild(d);
    container.scrollTop = container.scrollHeight;
}

window.perguntar = function(t) {
    document.getElementById('inputMsg').value = t;
    enviarMensagem();
};

window.enviarMensagem = function() {
    var t = document.getElementById('inputMsg').value.trim();
    if (!t) return;
    adicionarMensagem(t, 'usuario');
    document.getElementById('inputMsg').value = '';

    var key = localStorage.getItem('amovin_gemini_key') || '';
    if (!key) {
        adicionarMensagem('⚠️ Chave Gemini não configurada. Acesse Configurações para configurar.', 'ia');
        return;
    }

    document.getElementById('iaStatus').textContent = '⏳ Processando...';
    document.getElementById('iaStatus').style.color = '#E65100';

    fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=' + key, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            contents: [{ parts: [{ text: 'Você é o assistente virtual da AMOVIN (Associação e Movimento pela Inclusão). Responda de forma profissional, educada e prática. Pergunta: ' + t }] }]
        })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        document.getElementById('iaStatus').textContent = '✅ Resposta recebida';
        document.getElementById('iaStatus').style.color = '#2E7D32';
        if (d.candidates && d.candidates[0] && d.candidates[0].content) {
            adicionarMensagem(d.candidates[0].content.parts[0].text, 'ia');
        } else {
            adicionarMensagem('Desculpe, não consegui processar sua pergunta.', 'ia');
        }
    })
    .catch(function() {
        document.getElementById('iaStatus').textContent = '❌ Erro ao conectar';
        document.getElementById('iaStatus').style.color = '#C62828';
        adicionarMensagem('Erro ao processar. Verifique sua conexão.', 'ia');
    });
};

// ============================================================
// CONTROLE DE PERFIL
// ============================================================
var perfil = sessionStorage.getItem('amovin_perfil') || 'admin';
var modulosPermitidos = {
    admin: ['dashboard','bi','capta','sala-espera','pre-cadastro','financeiro','orcamentos','prestacao-contas','pessoas','profissionais','voluntarios','agenda-telefonica','agenda','documentos','qrcodes','notas-fiscais','estoque','patrimonio','biblioteca','certificados','chat','assistente','relatorios','configuracoes','backup'],
    recepcao: ['dashboard','pessoas','agenda-telefonica','agenda','documentos'],
    consulta: ['dashboard','agenda','agenda-telefonica','assistente'],
    financeiro: ['dashboard','financeiro','orcamentos','prestacao-contas','relatorios'],
    voluntario: ['dashboard','agenda','voluntarios','agenda-telefonica']
};

var permitidos = modulosPermitidos[perfil] || modulosPermitidos.admin;
document.querySelectorAll('.nav-item').forEach(function(item) {
    var href = item.getAttribute('href') || '';
    var pagina = href.replace('.html', '');
    pagina = pagina.split('?')[0].split('#')[0];
    if (pagina && permitidos.indexOf(pagina) === -1 && pagina !== 'dashboard' && pagina !== '') {
        item.style.display = 'none';
    }
});

if (!sessionStorage.getItem('amovin_logado')) { window.location.href = 'index.html'; }
</script>
</body>
</html>
