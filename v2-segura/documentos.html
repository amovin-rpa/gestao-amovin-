<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • Documentos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11;
  --amarelo: #F5C518;
  --verde: #57C220;
  --azul: #1E88E5;
  --grafite: #1A1A1A;
  --cinza: #6B7280;
  --cinza-claro: #F8F4ED;
  --branco: #FFFFFF;
  --vermelho: #E53935;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

/* ==================== SIDEBAR (vem do menu.js) ==================== */
.sidebar { width: 270px; background: #FFFFFF; color: #1A1A1A; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; border-right: 1px solid #F0E9DF; box-shadow: 0 0 20px rgba(0,0,0,0.03); }
.sidebar-header { padding: 28px 24px 24px; text-align: center; border-bottom: 1px solid #F0E9DF; }
.sidebar-logo-img { width: 80px; height: auto; margin-bottom: 8px; display: block; margin-left: auto; margin-right: auto; }
.sidebar-logo-fallback { font-size: 48px; margin-bottom: 8px; display: none; }
.sidebar-header .brand { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; font-weight: 700; color: #1A1A1A; letter-spacing: -0.4px; }
.sidebar-nav { flex: 1; padding: 16px 0; overflow-y: auto; }
.nav-categoria { padding: 16px 24px 6px; font-size: 10px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 1.5px; }
.nav-item { display: flex; align-items: center; gap: 13px; padding: 11px 24px; color: #4B5563; text-decoration: none; font-size: 13.5px; font-weight: 500; transition: all 0.2s ease; border-left: 3px solid transparent; }
.nav-item:hover { background: #FFF8E7; color: #C65A11; border-left-color: #F5C518; }
.nav-item.ativo { background: #FFF3E0; color: #C65A11; border-left-color: #C65A11; font-weight: 600; }
.nav-item .icone { font-size: 17px; width: 24px; text-align: center; }
.sidebar-footer { padding: 20px 24px; border-top: 1px solid #F0E9DF; }
.user-card { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.user-avatar { width: 38px; height: 38px; background: #F5C518; color: #1A1A1A; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
.user-info .nome { font-weight: 600; font-size: 13.5px; }
.user-info .cargo { font-size: 11px; color: #6B7280; }
.btn-sair { width: 100%; padding: 9px; background: #F8F4ED; color: #1A1A1A; border: none; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-sair:hover { background: #F0E9DF; }

/* ==================== MAIN CONTENT ==================== */
.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 22px; }
.kpi-card { background: #FFFFFF; padding: 16px; border-radius: 14px; border: 1px solid #F0E9DF; text-align: center; }
.kpi-card .kpi-valor { font-size: 22px; font-weight: 800; color: var(--laranja); }
.kpi-card .kpi-label { font-size: 10px; color: var(--cinza); }

.grid-principal { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: #FFFFFF; padding: 24px; border-radius: 14px; border: 1px solid #F0E9DF; margin-bottom: 20px; }
.card h3 { font-size: 16px; font-weight: 700; color: var(--grafite); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #F0E9DF; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--cinza); margin-bottom: 4px; text-transform: uppercase; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 12px; }
.btn-salvar { background: var(--laranja); color: white; }
.btn-ia { background: #7B1FA2; color: white; }
.btn-editar { background: var(--amarelo); color: #1A1A1A; }
.btn-visualizar { background: var(--azul); color: white; }
.btn-cancelar { background: var(--vermelho); color: white; }
.btn-duplicar { background: #F5A623; color: white; }

table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: #F8F4ED; padding: 10px; text-align: left; font-size: 10px; font-weight: 700; color: var(--cinza); text-transform: uppercase; }
td { padding: 10px; border-bottom: 1px solid #F0E9DF; }
tr:hover { background: #FFF8E7; }

.badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 600; }
.badge-recibo { background: #E3F2FD; color: #1565C0; }
.badge-protocolo { background: #FFF3E0; color: #E65100; }
.badge-declaracao { background: #E8F5E9; color: #2E7D32; }
.badge-termo { background: #F3E5F5; color: #7B1FA2; }
.badge-rascunho { background: #F5F5F5; color: #888; }
.badge-emitido { background: #E8F5E9; color: #2E7D32; }
.badge-cancelado { background: #FFEBEE; color: #C62828; }

.busca-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
.busca-bar input { flex: 1; padding: 10px 14px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; min-width: 200px; }
.busca-bar select { padding: 10px; border: 1px solid #E5E0D8; border-radius: 8px; font-family: 'Inter', sans-serif; }

.log-item { padding: 8px 15px; border-bottom: 1px solid #F0E9DF; font-size: 12px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }
.sem-dados { text-align: center; padding: 30px; color: #9CA3AF; }
.vinculo-info { background: #E8F5E9; padding: 10px; border-radius: 8px; font-size: 12px; margin-top: 8px; display: none; }

.rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
.rodape-grid { display: flex; align-items: center; gap: 12px; }
.rodape-logo { flex-shrink: 0; } .rodape-logo .logo-vigorre { width: 50px; }
.rodape-info { flex: 1; } .rodape-info .copyright { font-size: 8px; color: #8A8F98; } .rodape-info .tm { font-size: 6px; vertical-align: super; }
.rodape-info .contato { font-size: 9px; color: #8A8F98; } .rodape-info a { color: #C65A11; text-decoration: none; } .rodape-info .email { font-size: 8px; color: #aaa; }
.logo-vigorre-fallback { font-size: 12px; font-weight: 700; display: none; }

@media (max-width: 1000px) { .sidebar { width: 100%; position: relative; } .main-content { margin-left: 0; } .grid-principal { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- ==================== MENU LATERAL ==================== -->
<div id="menu-container"></div>

<main class="main-content">
  <div class="topo-bar">
    <h1>📝 Documentos Oficiais</h1>
    <button class="btn-sair-topo" onclick="window.location.href='index.html'">🚪 Sair</button>
  </div>

  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-valor" id="kpiTotal">0</div><div class="kpi-label">Total</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiRecibos">0</div><div class="kpi-label">Recibos</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiProtocolos">0</div><div class="kpi-label">Protocolos</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiDeclaracoes">0</div><div class="kpi-label">Declarações</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiHoje">0</div><div class="kpi-label">Hoje</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiCancelados">0</div><div class="kpi-label">Cancelados</div></div>
  </div>

  <div class="grid-principal">
    <div>
      <div class="card">
        <h3 id="tituloForm">📝 Novo Documento</h3><input type="hidden" id="docId">
        <div class="form-group"><label>Tipo *</label><select id="tipoDoc" onchange="atualizarTipo()"><option value="recibo">Recibo</option><option value="protocolo">Protocolo</option><option value="declaracao">Declaração</option><option value="termo">Termo de Entrega</option></select></div>
        <div class="form-group"><label>Status</label><select id="statusDoc"><option value="rascunho">Rascunho</option><option value="emitido">Emitido</option></select></div>
        <div class="form-group"><label>Beneficiário</label><select id="beneficiarioDoc" onchange="vincularBeneficiario()"><option value="">Nenhum</option></select></div>
        <div class="form-row"><div class="form-group"><label>Nome *</label><input type="text" id="nomeDoc"></div><div class="form-group"><label>CPF/CNPJ *</label><input type="text" id="cpfDoc"></div></div>
        <div id="vinculoPatrimonio" style="display:none;"><div class="form-group"><label>Item a Entregar</label><select id="itemPatrimonio" onchange="atualizarInfoItem()"><option value="">Selecione...</option></select></div><div class="form-group"><label>Quantidade</label><input type="number" id="qtdEntregue" value="1" min="1"></div><div class="vinculo-info" id="infoItem"></div></div>
        <div id="camposRecibo"><div class="form-row"><div class="form-group"><label>Valor (R$)</label><input type="number" id="valorDoc" step="0.01"></div><div class="form-group"><label>Data *</label><input type="date" id="dataDoc"></div></div></div>
        <div id="camposProtocolo" style="display:none;"><div class="form-row"><div class="form-group"><label>Origem</label><input type="text" id="origemDoc"></div><div class="form-group"><label>Destino</label><input type="text" id="destinoDoc"></div></div></div>
        <div class="form-group"><label>Texto</label><textarea id="textoDoc" rows="5"></textarea></div>
        <div class="form-group"><label>Observações</label><input type="text" id="obsDoc"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-salvar" onclick="salvarDocumento()" style="flex:1;">💾 Salvar</button><button class="btn btn-ia" onclick="sugerirComIA()">🤖 IA</button></div>
        <button class="btn btn-cancelar" onclick="limparFormulario()" style="width:100%;margin-top:8px;">🔄 Limpar</button>
      </div>
    </div>
    <div>
      <div class="busca-bar">
        <input type="text" id="buscaDoc" placeholder="Buscar..." oninput="filtrarDocumentos()">
        <select id="filtroTipo" onchange="filtrarDocumentos()"><option value="todos">Todos</option><option value="recibo">Recibos</option><option value="protocolo">Protocolos</option><option value="declaracao">Declarações</option><option value="termo">Termos</option></select>
        <select id="filtroStatus" onchange="filtrarDocumentos()"><option value="todos">Todos</option><option value="rascunho">Rascunhos</option><option value="emitido">Emitidos</option><option value="cancelado">Cancelados</option></select>
      </div>
      <div class="card"><h3>📋 Documentos <span id="totalLista"></span></h3><div style="overflow-x:auto;"><table><thead><tr><th>Número</th><th>Tipo</th><th>Nome</th><th>Data</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tabelaDocumentos"></tbody></table></div></div>
      <div class="card"><h3>📝 Histórico</h3><div id="logAuditoria" style="max-height:200px;overflow-y:auto;"></div></div>
    </div>
  </div>

  <div class="rodape">
    <div class="rodape-grid"><div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-vigorre-fallback">Vigorre</span></div><div class="rodape-info"><div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span></div><div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div><div class="email">contato@vigorre.com.br</div></div></div>
  </div>
</main>

<script src="menu.js"></script>
<script>
var documentos = JSON.parse(localStorage.getItem('amovin_documentos_oficiais') || '[]');
var logs = JSON.parse(localStorage.getItem('amovin_documentos_logs') || '[]');
var bens = JSON.parse(localStorage.getItem('amovin_bens') || '[]');
var beneficiarios = JSON.parse(localStorage.getItem('amovin_beneficiarios') || '[]');
var todosBen = beneficiarios;
var editandoId = null;
var usuarioAtual = sessionStorage.getItem('amovin_nome') || 'Admin';

if (documentos.length === 0) {
    documentos = [{id:1,tipo:'recibo',numero:'REC-2026-000001',nome:'João Silva',cpf:'123.456.789-00',valor:500,data:'2026-07-06',texto:'Recebi de João Silva...',status:'emitido',obs:'',criadoPor:'Admin',criadoEm:'2026-07-06T10:00:00'}];
    salvar();
}
function salvar() { localStorage.setItem('amovin_documentos_oficiais',JSON.stringify(documentos)); localStorage.setItem('amovin_documentos_logs',JSON.stringify(logs)); }
function addLog(a,d) { logs.unshift({id:Date.now(),acao:a,detalhe:d,usuario:usuarioAtual,data:new Date().toISOString()}); if(logs.length>100)logs=logs.slice(0,100); salvar(); renderizarLogs(); }
function renderizarLogs() { var c=document.getElementById('logAuditoria'); c.innerHTML=logs.length===0?'<div class="sem-dados">Nenhuma ação.</div>':logs.slice(0,15).map(function(l){return '<div class="log-item"><span><strong>'+l.acao+'</strong> - '+l.detalhe+'</span><span style="color:var(--cinza);font-size:10px;">'+l.usuario+' • '+new Date(l.data).toLocaleString('pt-BR')+'</span></div>';}).join(''); }

function calcularProximoNumero(tipo) { var p={recibo:'REC',protocolo:'PRO',declaracao:'DEC',termo:'TER'}; var pf=p[tipo]||'DOC'; var ano=new Date().getFullYear(); var dt=documentos.filter(function(d){return d.tipo===tipo&&d.numero&&d.numero.indexOf(String(ano))>=0;}); if(dt.length===0)return pf+'-'+ano+'-000001'; var ns=dt.map(function(d){return parseInt(d.numero.split('-')[2]);}).filter(function(n){return !isNaN(n);}); return pf+'-'+ano+'-'+String(Math.max.apply(null,ns)+1).padStart(6,'0'); }

function popularBeneficiarios() { var s=document.getElementById('beneficiarioDoc'); s.innerHTML='<option value="">Nenhum</option>'+todosBen.map(function(b){return '<option value="'+b.id+'">'+(b.nome||b.fullName||'')+'</option>';}).join(''); }
function popularItensPatrimonio() { var s=document.getElementById('itemPatrimonio'); s.innerHTML='<option value="">Selecione...</option>'+bens.filter(function(b){return b.status==='Em Operação'||b.status==='Disponível';}).map(function(b){return '<option value="'+b.id+'">'+b.nome+' (Qtd: '+(b.quantidade||1)+')</option>';}).join(''); }

window.atualizarTipo=function(){ var t=document.getElementById('tipoDoc').value; document.getElementById('camposRecibo').style.display=t==='recibo'?'block':'none'; document.getElementById('camposProtocolo').style.display=t==='protocolo'?'block':'none'; document.getElementById('vinculoPatrimonio').style.display=t==='termo'?'block':'none'; if(t==='termo')popularItensPatrimonio(); };
window.vincularBeneficiario=function(){ var id=document.getElementById('beneficiarioDoc').value; if(!id)return; var b=todosBen.find(function(x){return x.id==id;}); if(b){document.getElementById('nomeDoc').value=b.nome||b.fullName||'';document.getElementById('cpfDoc').value=b.cpf||'';} };
window.atualizarInfoItem=function(){ var id=document.getElementById('itemPatrimonio').value,i=document.getElementById('infoItem'); if(!id){i.style.display='none';return;} var item=bens.find(function(x){return x.id==id;}); if(item){i.style.display='block';i.innerHTML='<strong>'+item.nome+'</strong> | Disp: '+(item.quantidade||1);} };

window.salvarDocumento=function(){
    var t=document.getElementById('tipoDoc').value,n=document.getElementById('nomeDoc').value.trim(),c=document.getElementById('cpfDoc').value.trim(),s=document.getElementById('statusDoc').value;
    if(!n||!c){alert('Nome e CPF/CNPJ obrigatórios!');return;}
    var d={tipo:t,nome:n,cpf:c,status:s,valor:parseFloat(document.getElementById('valorDoc').value)||0,data:document.getElementById('dataDoc').value||new Date().toISOString().split('T')[0],texto:document.getElementById('textoDoc').value.trim(),obs:document.getElementById('obsDoc').value.trim(),origem:document.getElementById('origemDoc').value.trim(),destino:document.getElementById('destinoDoc').value.trim(),beneficiarioId:document.getElementById('beneficiarioDoc').value,itemPatrimonioId:document.getElementById('itemPatrimonio').value,qtdEntregue:parseInt(document.getElementById('qtdEntregue').value)||1};
    if(editandoId){var idx=documentos.findIndex(function(x){return x.id===editandoId;});if(idx>=0){if(documentos[idx].status!=='rascunho'){alert('Só rascunhos podem ser editados!');return;}documentos[idx]=Object.assign({},documentos[idx],d,{atualizadoPor:usuarioAtual,atualizadoEm:new Date().toISOString()});addLog('Editou',documentos[idx].numero);}}
    else{var num=calcularProximoNumero(t);var novo=Object.assign({id:Date.now(),numero:num},d,{criadoPor:usuarioAtual,criadoEm:new Date().toISOString()});documentos.push(novo);if(t==='termo'&&d.itemPatrimonioId&&d.status==='emitido'){var item=bens.find(function(x){return x.id==d.itemPatrimonioId;});if(item){item.quantidade=Math.max(0,(item.quantidade||1)-d.qtdEntregue);if(!item.movimentacoes)item.movimentacoes=[];item.movimentacoes.push({data:new Date().toISOString(),tipo:'Saída',qtd:d.qtdEntregue,docNumero:num,beneficiario:n,usuario:usuarioAtual});localStorage.setItem('amovin_bens',JSON.stringify(bens));}}addLog('Criou',num+' - '+n);}
    salvar();limparFormulario();filtrarDocumentos();atualizarKPIs();
};

window.editarDocumento=function(id){var d=documentos.find(function(x){return x.id===id;});if(!d||d.status!=='rascunho'){alert('Só rascunhos!');return;}editandoId=id;document.getElementById('tituloForm').textContent='Editando '+d.numero;document.getElementById('docId').value=d.id;document.getElementById('tipoDoc').value=d.tipo;document.getElementById('statusDoc').value=d.status;document.getElementById('beneficiarioDoc').value=d.beneficiarioId||'';document.getElementById('nomeDoc').value=d.nome;document.getElementById('cpfDoc').value=d.cpf;document.getElementById('valorDoc').value=d.valor||'';document.getElementById('dataDoc').value=d.data||'';document.getElementById('textoDoc').value=d.texto||'';document.getElementById('obsDoc').value=d.obs||'';document.getElementById('origemDoc').value=d.origem||'';document.getElementById('destinoDoc').value=d.destino||'';document.getElementById('itemPatrimonio').value=d.itemPatrimonioId||'';document.getElementById('qtdEntregue').value=d.qtdEntregue||1;atualizarTipo();atualizarInfoItem();};
window.cancelarDocumento=function(id){var d=documentos.find(function(x){return x.id===id;});if(!d||d.status==='cancelado')return;var m=prompt('Motivo:');if(m===null)return;d.status='cancelado';d.motivoCancelamento=m;d.canceladoPor=usuarioAtual;d.canceladoEm=new Date().toISOString();salvar();filtrarDocumentos();atualizarKPIs();addLog('Cancelou',d.numero+' - '+m);};
window.visualizarDocumento=function(id){var d=documentos.find(function(x){return x.id===id;});if(!d)return;var w=window.open('','_blank');w.document.write('<pre style="padding:20px;font-family:monospace;">AMOVIN ERP Social\n'+d.numero+' | '+d.tipo+'\n'+d.nome+' | '+d.cpf+'\n\n'+(d.texto||'')+'</pre><script>window.onload=function(){window.print()}<\/script>');w.document.close();};
window.duplicarDocumento=function(id){var d=documentos.find(function(x){return x.id===id;});if(!d)return;var n=Object.assign({},d,{id:Date.now(),numero:calcularProximoNumero(d.tipo),status:'rascunho',criadoPor:usuarioAtual,criadoEm:new Date().toISOString()});documentos.push(n);salvar();filtrarDocumentos();atualizarKPIs();addLog('Duplicou',d.numero+' → '+n.numero);};

window.sugerirComIA=async function(){var n=document.getElementById('nomeDoc').value.trim();if(!n){alert('Preencha o Nome!');return;}var k=localStorage.getItem('amovin_gemini_key')||'';if(!k){alert('Chave Gemini não configurada!');return;}try{var r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key='+k,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Crie um documento para '+n}]}]})});var d=await r.json();document.getElementById('textoDoc').value=d.candidates[0].content.parts[0].text;}catch(e){alert('Erro na IA.');}};

function filtrarDocumentos(){var b=document.getElementById('buscaDoc').value.toLowerCase(),t=document.getElementById('filtroTipo').value,s=document.getElementById('filtroStatus').value,l=documentos.slice();if(b)l=l.filter(function(d){return(d.nome||'').toLowerCase().indexOf(b)>=0||(d.cpf||'').indexOf(b)>=0||(d.numero||'').toLowerCase().indexOf(b)>=0;});if(t!=='todos')l=l.filter(function(d){return d.tipo===t;});if(s!=='todos')l=l.filter(function(d){return d.status===s;});l.sort(function(a,b){return new Date(b.criadoEm)-new Date(a.criadoEm);});document.getElementById('totalLista').textContent='('+l.length+')';document.getElementById('tabelaDocumentos').innerHTML=l.length===0?'<tr><td colspan="6" class="sem-dados">Nenhum documento.</td></tr>':l.map(function(d){return'<tr><td><strong>'+d.numero+'</strong></td><td><span class="badge badge-'+d.tipo+'">'+d.tipo+'</span></td><td>'+d.nome+'</td><td>'+(d.data?new Date(d.data+'T00:00:00').toLocaleDateString('pt-BR'):'-')+'</td><td><span class="badge badge-'+d.status+'">'+d.status+'</span></td><td>'+(d.status==='rascunho'?'<button class="btn btn-editar" onclick="editarDocumento('+d.id+')">✏️</button>':'')+'<button class="btn btn-visualizar" onclick="visualizarDocumento('+d.id+')">👁️</button><button class="btn btn-duplicar" onclick="duplicarDocumento('+d.id+')">📋</button>'+(d.status!=='cancelado'?'<button class="btn btn-cancelar" onclick="cancelarDocumento('+d.id+')">❌</button>':'')+'</td></tr>';}).join('');}
function atualizarKPIs(){var h=new Date().toISOString().split('T')[0];document.getElementById('kpiTotal').textContent=documentos.length;document.getElementById('kpiRecibos').textContent=documentos.filter(function(d){return d.tipo==='recibo';}).length;document.getElementById('kpiProtocolos').textContent=documentos.filter(function(d){return d.tipo==='protocolo';}).length;document.getElementById('kpiDeclaracoes').textContent=documentos.filter(function(d){return d.tipo==='declaracao'||d.tipo==='termo';}).length;document.getElementById('kpiHoje').textContent=documentos.filter(function(d){return d.data===h;}).length;document.getElementById('kpiCancelados').textContent=documentos.filter(function(d){return d.status==='cancelado';}).length;}
window.limparFormulario=function(){editandoId=null;document.getElementById('tituloForm').textContent='Novo Documento';document.getElementById('docId').value='';document.getElementById('tipoDoc').value='recibo';document.getElementById('statusDoc').value='rascunho';document.getElementById('beneficiarioDoc').value='';document.getElementById('nomeDoc').value='';document.getElementById('cpfDoc').value='';document.getElementById('valorDoc').value='';document.getElementById('dataDoc').value=new Date().toISOString().split('T')[0];document.getElementById('textoDoc').value='';document.getElementById('obsDoc').value='';document.getElementById('itemPatrimonio').value='';document.getElementById('qtdEntregue').value='1';document.getElementById('infoItem').style.display='none';atualizarTipo();};

// ============================================================
// VERIFICAÇÃO DE SESSÃO
// ============================================================
if(!sessionStorage.getItem('amovin_logado'))window.location.href='index.html';

document.getElementById('dataDoc').value=new Date().toISOString().split('T')[0];
popularBeneficiarios();filtrarDocumentos();atualizarKPIs();renderizarLogs();
</script>
