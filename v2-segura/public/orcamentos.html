<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amovin ERP • Orçamentos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --laranja: #C65A11;
            --laranja-escuro: #A04A0E;
            --amarelo: #F5C518;
            --verde: #57C220;
            --azul: #1E88E5;
            --grafite: #1A1A1A;
            --cinza: #6B7280;
            --cinza-claro: #F8F4ED;
            --branco: #FFFFFF;
            --vermelho: #E53935;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

        .main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
        .topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
        .topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
        .topo-bar h1 span { color: var(--laranja); }
        .btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

        .card { background: #FFFFFF; padding: 24px; border-radius: 14px; border: 1px solid #F0E9DF; margin-bottom: 20px; }
        .card h3 { font-size: 16px; font-weight: 700; color: var(--grafite); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #F0E9DF; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .card h3 .badge { font-size: 10px; font-weight: 600; padding: 3px 12px; border-radius: 20px; background: #FFF3E0; color: var(--laranja); }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--cinza); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
        .form-group select, .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; background: #FAFAFA; }
        .form-group select:focus, .form-group input:focus { outline: none; border-color: var(--laranja); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn { padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; font-family: 'Inter', sans-serif; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--laranja); color: white; }
        .btn-primary:hover { background: var(--laranja-escuro); }
        .btn-success { background: var(--verde); color: white; }
        .btn-success:hover { background: #388E3C; }
        .btn-outline { background: transparent; color: var(--cinza); border: 1px solid #E5E0D8; }
        .btn-outline:hover { background: #F8F4ED; }
        .btn-full { width: 100%; padding: 14px; font-size: 15px; justify-content: center; }
        .btn-azul { background: var(--azul); color: white; }
        .btn-azul:hover { background: #1565C0; }

        .orcamento-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #F0E9DF; flex-wrap: wrap; gap: 8px; }
        .orcamento-item:last-child { border-bottom: none; }
        .orcamento-item .categoria { font-weight: 600; font-size: 14px; color: var(--grafite); }
        .orcamento-item .valores { font-size: 13px; }
        .orcamento-item .valores .previsto { color: var(--cinza); }
        .orcamento-item .valores .realizado { color: var(--laranja); font-weight: 600; }
        .orcamento-item .valores .disponivel { color: var(--verde); font-weight: 600; }
        .orcamento-item .valores .estourado { color: var(--vermelho); font-weight: 600; }
        .orcamento-item .barra { width: 100%; height: 4px; background: #F0E9DF; border-radius: 2px; margin-top: 4px; overflow: hidden; }
        .orcamento-item .barra .fill { height: 100%; border-radius: 2px; transition: width 0.8s ease; }

        .sem-dados { text-align: center; padding: 30px; color: #9CA3AF; }
        .total-geral { font-size: 18px; font-weight: 800; color: var(--grafite); padding: 16px 0 0; border-top: 2px solid var(--laranja); margin-top: 12px; text-align: center; }

        .rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
        .rodape-grid { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .rodape-logo { flex-shrink: 0; } .rodape-logo .logo-vigorre { width: 50px; }
        .rodape-info { flex: 1; } .rodape-info .copyright { font-size: 8px; color: #8A8F98; } .rodape-info .tm { font-size: 6px; vertical-align: super; }
        .rodape-info .contato { font-size: 9px; color: #8A8F98; } .rodape-info a { color: #C65A11; text-decoration: none; } .rodape-info .email { font-size: 8px; color: #aaa; }
        .logo-vigorre-fallback { font-size: 12px; font-weight: 700; display: none; }

        @media (max-width: 900px) { .main-content { margin-left: 0; } .form-row { grid-template-columns: 1fr; } .orcamento-item { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>

    <div id="menu-container"></div>

    <main class="main-content">
        <div class="topo-bar">
            <h1>📊 Orçamentos <span>AMOVIN</span></h1>
            <button class="btn-sair-topo" onclick="window.location.href='dashboard.html'">🏠 Dashboard</button>
        </div>

        <div class="card">
            <h3>🎯 Selecione o Projeto <span class="badge">Orçamento</span></h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Projeto</label>
                    <select id="selectProjeto" onchange="carregarOrcamento()">
                        <option value="">Selecione um projeto...</option>
                    </select>
                </div>
                <div style="display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;">
                    <button class="btn btn-primary" onclick="carregarOrcamento()">📊 Carregar</button>
                    <button class="btn btn-success" onclick="window.location.href='projetos-convenios.html'">📋 Gerenciar Projetos</button>
                </div>
            </div>
        </div>

        <div class="card" id="areaOrcamento" style="display:none;">
            <h3 id="tituloOrcamento">📋 Orçamento - <span id="nomeProjetoOrcamento">---</span></h3>
            <div id="listaOrcamento"><div class="sem-dados">Nenhum orçamento definido para este projeto.</div></div>
            <div class="total-geral" id="totalGeralOrcamento">Total: R$ 0,00</div>
        </div>

        <div class="rodape">
            <div class="rodape-grid">
                <div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-vigorre-fallback">Vigorre</span></div>
                <div class="rodape-info">
                    <div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span></div>
                    <div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div>
                    <div class="email">contato@vigorre.com.br</div>
                </div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="menu.js?v=20260904"></script>
    <script>
        var projetos = JSON.parse(localStorage.getItem('amovin_projetos') || '[]');
        var orcamentos = JSON.parse(localStorage.getItem('amovin_orcamentos') || '[]');

        function preencherProjetos() {
            var select = document.getElementById('selectProjeto');
            select.innerHTML = '<option value="">Selecione um projeto...</option>';
            projetos.forEach(function(p) {
                var option = document.createElement('option');
                option.value = p.id;
                option.textContent = p.nome;
                select.appendChild(option);
            });
        }

        function carregarOrcamento() {
            var projetoId = parseInt(document.getElementById('selectProjeto').value);
            if (!projetoId) { document.getElementById('areaOrcamento').style.display = 'none'; return; }

            var projeto = projetos.find(function(p) { return p.id === projetoId; });
            if (!projeto) { document.getElementById('areaOrcamento').style.display = 'none'; return; }

            document.getElementById('areaOrcamento').style.display = 'block';
            document.getElementById('nomeProjetoOrcamento').textContent = projeto.nome;

            var orcProjeto = orcamentos.filter(function(o) { return o.projeto_id === projetoId; });
            var container = document.getElementById('listaOrcamento');

            if (orcProjeto.length === 0) {
                container.innerHTML = '<div class="sem-dados">Nenhum orçamento definido para este projeto. <a href="projetos-convenios.html" style="color:var(--laranja);">Gerenciar Projetos</a></div>';
                document.getElementById('totalGeralOrcamento').textContent = 'Total: R$ 0,00';
                return;
            }

            var totalPrevisto = 0, totalRealizado = 0;
            var html = '';

            orcProjeto.forEach(function(o) {
                totalPrevisto += o.previsto || 0;
                totalRealizado += o.realizado || 0;
                var disponivel = (o.previsto || 0) - (o.realizado || 0);
                var percentual = o.previsto > 0 ? Math.min((o.realizado / o.previsto) * 100, 100) : 0;
                var cor = percentual < 70 ? 'fill-verde' : (percentual < 90 ? 'fill-laranja' : 'fill-vermelho');
                var classeSaldo = disponivel >= 0 ? 'disponivel' : 'estourado';

                html += '<div class="orcamento-item">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;width:100%;">' +
                    '<span class="categoria">' + o.categoria + '</span>' +
                    '<span class="valores">' +
                    '<span class="previsto">Previsto: R$ ' + (o.previsto || 0).toFixed(2).replace('.', ',') + '</span> | ' +
                    '<span class="realizado">Realizado: R$ ' + (o.realizado || 0).toFixed(2).replace('.', ',') + '</span> | ' +
                    '<span class="' + classeSaldo + '">Saldo: R$ ' + disponivel.toFixed(2).replace('.', ',') + '</span>' +
                    '</span>' +
                    '</div>' +
                    '<div class="barra"><div class="fill ' + cor + '" style="width:' + percentual + '%;"></div></div>' +
                    '</div>';
            });

            container.innerHTML = html;
            document.getElementById('totalGeralOrcamento').textContent = 'Total: R$ ' + totalRealizado.toFixed(2).replace('.', ',') + ' / R$ ' + totalPrevisto.toFixed(2).replace('.', ',') + ' (' + (totalPrevisto > 0 ? (totalRealizado / totalPrevisto * 100).toFixed(0) : 0) + '%)';
        }

        if (!sessionStorage.getItem('amovin_logado')) { window.location.href = 'index.html'; }

        preencherProjetos();

        var urlParams = new URLSearchParams(window.location.search);
        var projetoId = urlParams.get('projeto');
        if (projetoId) { document.getElementById('selectProjeto').value = projetoId; carregarOrcamento(); }
    </script>
</body>
</html>
