<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11;
  --amarelo: #F5C518;
  --verde: #57C220;
  --azul: #1E88E5;
  --grafite: #1A1A1A;
  --cinza: #6B7280;
  --cinza-claro: #F8F4ED;
  --branco: #FFFFFF;
  --vermelho: #E53935;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

.grid-chat { display: grid; grid-template-columns: 260px 1fr; gap: 20px; height: calc(100vh - 180px); min-height: 400px; }
.chat-sidebar { background: #FFFFFF; border-radius: 14px; border: 1px solid #F0E9DF; overflow: hidden; display: flex; flex-direction: column; }
.chat-sidebar-header { padding: 16px 18px; font-weight: 700; font-size: 14px; border-bottom: 1px solid #F0E9DF; background: #FAFAFA; }
.chat-contatos { flex: 1; overflow-y: auto; padding: 8px; }
.contato-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s; margin-bottom: 2px; }
.contato-item:hover { background: #F8F4ED; }
.contato-item.ativo { background: #FFF3E0; border-left: 3px solid var(--laranja); }
.contato-item .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: white; flex-shrink: 0; }
.contato-item .info { flex: 1; }
.contato-item .info .nome { font-weight: 600; font-size: 13px; color: var(--grafite); }
.contato-item .info .cargo { font-size: 11px; color: var(--cinza); }
.contato-item .online { width: 8px; height: 8px; border-radius: 50%; background: var(--verde); flex-shrink: 0; }
.contato-item .online.offline { background: #ccc; }

.chat-main { background: #FFFFFF; border-radius: 14px; border: 1px solid #F0E9DF; display: flex; flex-direction: column; overflow: hidden; }
.chat-main-header { padding: 14px 20px; border-bottom: 1px solid #F0E9DF; display: flex; align-items: center; gap: 12px; background: #FAFAFA; }
.chat-main-header .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: white; flex-shrink: 0; }
.chat-main-header .nome { font-weight: 700; font-size: 15px; color: var(--grafite); }
.chat-mensagens { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 6px; background: #F8F9FA; }
.msg { display: flex; gap: 8px; max-width: 75%; }
.msg.minha { align-self: flex-end; flex-direction: row-reverse; }
.msg.outra { align-self: flex-start; }
.msg-bolha { padding: 10px 14px; border-radius: 16px; font-size: 13px; line-height: 1.5; word-wrap: break-word; max-width: 100%; }
.msg.minha .msg-bolha { background: var(--laranja); color: white; border-bottom-right-radius: 4px; }
.msg.outra .msg-bolha { background: #F0E9DF; color: var(--grafite); border-bottom-left-radius: 4px; }
.msg-info { font-size: 9px; margin-top: 4px; opacity: 0.6; }
.msg.minha .msg-info { text-align: right; }
.msg-nome { font-size: 10px; font-weight: 600; color: var(--laranja); margin-bottom: 3px; }
.sem-mensagens { text-align: center; padding: 60px 20px; color: #9CA3AF; font-size: 14px; }
.chat-input { padding: 14px 20px; border-top: 1px solid #F0E9DF; display: flex; gap: 10px; background: white; }
.chat-input input { flex: 1; padding: 10px 16px; border: 1px solid #E5E0D8; border-radius: 25px; font-size: 13px; font-family: 'Inter', sans-serif; outline: none; transition: border 0.2s; }
.chat-input input:focus { border-color: var(--laranja); }
.chat-input button { padding: 10px 22px; background: var(--laranja); color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: 600; font-size: 13px; transition: background 0.2s; }
.chat-input button:hover { background: #A04A0E; }

.rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
.rodape-grid { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rodape-logo { flex-shrink: 0; } .rodape-logo .logo-vigorre { width: 50px; }
.rodape-info { flex: 1; } .rodape-info .copyright { font-size: 8px; color: #8A8F98; } .rodape-info .tm { font-size: 6px; vertical-align: super; }
.rodape-info .contato { font-size: 9px; color: #8A8F98; } .rodape-info a { color: #C65A11; text-decoration: none; } .rodape-info .email { font-size: 8px; color: #aaa; }
.logo-vigorre-fallback { font-size: 12px; font-weight: 700; display: none; }

@media (max-width: 768px) { .main-content { margin-left: 0; } .grid-chat { grid-template-columns: 1fr; height: auto; } .chat-sidebar { max-height: 200px; } .chat-main { min-height: 400px; } }
</style>
</head>
<body>

<div id="menu-container"></div>

<main class="main-content">
  <div class="topo-bar"><h1>💬 Chat Interno</h1><button class="btn-sair-topo" onclick="window.location.href='dashboard.html'">🏠 Dashboard</button></div>

  <div class="grid-chat">
    <div class="chat-sidebar">
      <div class="chat-sidebar-header">👥 Contatos</div>
      <div class="chat-contatos" id="listaContatos"></div>
    </div>
    <div class="chat-main">
      <div class="chat-main-header" id="chatHeader">
        <div class="avatar" id="chatAvatar" style="background:var(--laranja);">💬</div>
        <span class="nome" id="chatTitulo">Bate-papo Geral</span>
      </div>
      <div class="chat-mensagens" id="chatMensagens">
        <div class="sem-mensagens">💬 Nenhuma mensagem ainda.</div>
      </div>
      <div class="chat-input">
        <input type="text" id="inputMensagem" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter')enviarMensagem()">
        <button onclick="enviarMensagem()">Enviar</button>
      </div>
    </div>
  </div>

  <div class="rodape"><div class="rodape-grid"><div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-vigorre-fallback">Vigorre</span></div><div class="rodape-info"><div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span></div><div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div><div class="email">contato@vigorre.com.br</div></div></div></div>
</main>

<script src="config.js"></script>
<script src="menu.js?v=20260904"></script>
<script>
var usuarioAtual = { id: sessionStorage.getItem('amovin_nome') || 'Admin', nome: sessionStorage.getItem('amovin_nome') || 'Administrador' };
var mensagens = JSON.parse(localStorage.getItem('amovin_chat_mensagens') || '[]');
var canalAtual = 'geral';

var usuarios = [
    { id: 'geral', nome: 'Geral', cargo: 'Todos', avatar: '💬', cor: '#C65A11' },
    { id: 'Admin', nome: 'Administrador', cargo: 'Admin', avatar: '🛡️', cor: '#1E88E5' },
    { id: 'Dr. Carlos Mendes', nome: 'Dr. Carlos', cargo: 'Psicólogo', avatar: '🩺', cor: '#57C220' },
    { id: 'Dra. Lucia Ferreira', nome: 'Dra. Lucia', cargo: 'Assistente Social', avatar: '👩‍⚕️', cor: '#7B1FA2' },
    { id: 'Profa. Sandra Reis', nome: 'Profa. Sandra', cargo: 'Pedagoga', avatar: '📚', cor: '#E65100' },
    { id: 'Fernanda Lima', nome: 'Fernanda', cargo: 'Voluntária', avatar: '💪', cor: '#E53935' }
];

function salvar() { localStorage.setItem('amovin_chat_mensagens', JSON.stringify(mensagens)); }

function renderizarContatos() {
    var container = document.getElementById('listaContatos');
    container.innerHTML = usuarios.map(function(u) {
        var ativo = canalAtual === u.id ? 'ativo' : '';
        return '<div class="contato-item ' + ativo + '" onclick="mudarCanal(\'' + u.id + '\')">' +
            '<div class="avatar" style="background:' + u.cor + ';">' + u.avatar + '</div>' +
            '<div class="info"><div class="nome">' + u.nome + '</div><div class="cargo">' + u.cargo + '</div></div>' +
            '<div class="online"></div></div>';
    }).join('');
}

window.mudarCanal = function(id) {
    canalAtual = id;
    var u = usuarios.find(function(u) { return u.id === id; });
    if (u) {
        document.getElementById('chatTitulo').textContent = u.nome;
        document.getElementById('chatAvatar').textContent = u.avatar;
        document.getElementById('chatAvatar').style.background = u.cor;
    }
    renderizarContatos();
    renderizarMensagens();
};

function getFiltradas() {
    return mensagens.filter(function(m) {
        if (canalAtual === 'geral') return !m.canal || m.canal === 'geral';
        return (m.canal === canalAtual && m.de === usuarioAtual.id) || 
               (m.canal === usuarioAtual.id && m.de === canalAtual) || 
               (m.de === usuarioAtual.id && m.canal === canalAtual) ||
               (m.de === canalAtual && m.canal === usuarioAtual.id);
    }).sort(function(a, b) { return new Date(a.data) - new Date(b.data); });
}

function renderizarMensagens() {
    var container = document.getElementById('chatMensagens');
    var msgs = getFiltradas();
    if (msgs.length === 0) {
        container.innerHTML = '<div class="sem-mensagens">💬 Nenhuma mensagem. Digite algo!</div>';
        return;
    }
    container.innerHTML = msgs.map(function(m) {
        var minha = m.de === usuarioAtual.id;
        var rem = usuarios.find(function(u) { return u.id === m.de; });
        var hora = new Date(m.data).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
        return '<div class="msg ' + (minha ? 'minha' : 'outra') + '">' +
            '<div class="msg-bolha">' +
            (!minha ? '<div class="msg-nome">' + (rem ? rem.nome : m.de) + '</div>' : '') +
            m.texto +
            '<div class="msg-info">' + hora + '</div>' +
            '</div></div>';
    }).join('');
    container.scrollTop = container.scrollHeight;
}

window.enviarMensagem = function() {
    var texto = document.getElementById('inputMensagem').value.trim();
    if (!texto) return;
    mensagens.push({ de: usuarioAtual.id, texto: texto, canal: canalAtual, data: new Date().toISOString() });
    salvar();
    document.getElementById('inputMensagem').value = '';
    renderizarMensagens();
};

renderizarContatos();
renderizarMensagens();

if (!sessionStorage.getItem('amovin_logado')) { window.location.href = 'index.html'; }
</script>
</body>
</html>
