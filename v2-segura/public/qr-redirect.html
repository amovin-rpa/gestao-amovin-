<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --laranja: #C65A11;
            --verde: #57C220;
            --vermelho: #E53935;
            --cinza: #6B7280;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #F8F4ED;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            max-width: 400px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #F0E9DF;
            border-top-color: var(--laranja);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .logo { font-size: 48px; margin-bottom: 10px; }
        h2 { color: #1A1A1A; margin-bottom: 8px; }
        p { color: var(--cinza); font-size: 14px; line-height: 1.6; }
        .erro { color: var(--vermelho); font-weight: 600; }
        .sucesso { color: var(--verde); font-weight: 600; }
        .info { color: var(--laranja); font-weight: 600; }
        .btn-voltar {
            margin-top: 16px;
            padding: 10px 24px;
            background: var(--laranja);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
        }
        .btn-voltar:hover {
            background: #A04A0E;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h2 id="titulo">Redirecionando...</h2>
        <div class="spinner" id="spinner"></div>
        <p id="mensagem">Aguarde, você será redirecionado em instantes.</p>
        <button class="btn-voltar" id="btnVoltar" style="display:none;" onclick="window.location.href='index.html'">🏠 Voltar ao início</button>
    </div>

    <script src="config.js"></script>
    <script>
        // ============================================================
        // PÁGINA DE REDIRECIONAMENTO DE QR CODE
        // ============================================================
        // Esta página deve ser acessada como: /qr-redirect.html?id={id}
        // Exemplo: https://amovin.vercel.app/qr-redirect.html?id=1234567890

        function obterIdDaURL() {
            var params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function redirecionar() {
            var id = obterIdDaURL();
            var mensagem = document.getElementById('mensagem');
            var titulo = document.getElementById('titulo');
            var spinner = document.getElementById('spinner');
            var btnVoltar = document.getElementById('btnVoltar');

            if (!id) {
                titulo.textContent = '❌ ID inválido';
                mensagem.innerHTML = 'Não foi possível identificar o QR Code.<br>Verifique o link e tente novamente.';
                spinner.style.display = 'none';
                btnVoltar.style.display = 'inline-block';
                return;
            }

            // Buscar no localStorage
            var qrCodes = JSON.parse(localStorage.getItem('amovin_qrcodes') || '[]');
            var qr = qrCodes.find(function(q) { return String(q.id) === String(id); });

            if (!qr) {
                titulo.textContent = '❌ QR Code não encontrado';
                mensagem.innerHTML = 'Este QR Code pode ter sido removido ou desativado.<br>Entre em contato com a administração.';
                spinner.style.display = 'none';
                btnVoltar.style.display = 'inline-block';
                return;
            }

            // Verificar validade
            var status = getStatusValidade(qr);
            if (status.status === 'expirado') {
                titulo.textContent = '⏰ QR Code expirado';
                mensagem.innerHTML = 'Este QR Code expirou em ' + status.dataExpiracao + '.<br>Entre em contato para obter um novo código.';
                spinner.style.display = 'none';
                btnVoltar.style.display = 'inline-block';
                return;
            }

            // Registrar escaneamento
            qr.escaneamentos = (qr.escaneamentos || 0) + 1;
            qr.ultimoEscaneamento = new Date().toISOString();
            localStorage.setItem('amovin_qrcodes', JSON.stringify(qrCodes));

            // Redirecionar
            titulo.textContent = '🔗 Redirecionando...';
            mensagem.innerHTML = 'Destino: <strong>' + qr.conteudo + '</strong>';

            setTimeout(function() {
                window.location.href = qr.conteudo;
            }, 1500);
        }

        function getStatusValidade(qr) {
            if (!qr.diasValidade || qr.diasValidade === 0) {
                return { status: 'valido', label: 'Permanente', dataExpiracao: 'Nunca' };
            }

            var criacao = new Date(qr.dataCriacao);
            var expiracao = new Date(criacao);
            expiracao.setDate(expiracao.getDate() + qr.diasValidade);

            var agora = new Date();
            var diff = expiracao - agora;

            if (diff < 0) {
                return { status: 'expirado', label: 'Expirado', dataExpiracao: expiracao.toLocaleDateString('pt-BR') };
            } else {
                return { status: 'valido', label: 'Válido', dataExpiracao: expiracao.toLocaleDateString('pt-BR') };
            }
        }

        // Iniciar
        redirecionar();
    </script>
</body>
</html>
