<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #F8F4ED;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            max-width: 400px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #F0E9DF;
            border-top-color: #C65A11;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .logo { font-size: 48px; margin-bottom: 10px; }
        h2 { color: #1A1A1A; margin-bottom: 8px; }
        p { color: #6B7280; font-size: 14px; }
        .erro { color: #E53935; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h2>Redirecionando...</h2>
        <div class="spinner"></div>
        <p id="mensagem">Aguarde, você será redirecionado em instantes.</p>
    </div>

    <script>
        // ============================================================
        // PÁGINA DE REDIRECIONAMENTO DE QR CODE
        // ============================================================
        // Esta página deve ser acessada como: /qr/{id}
        // Exemplo: https://erp.amovin.org.br/qr/8f7c3d12-a4b6-4d89-bf65-91c2e7a5f123

        function obterIdDaURL() {
            var path = window.location.pathname;
            var partes = path.split('/');
            return partes[partes.length - 1];
        }

        function redirecionar() {
            var id = obterIdDaURL();
            var mensagem = document.getElementById('mensagem');

            if (!id || id === 'qr' || id === '') {
                mensagem.innerHTML = '❌ <span class="erro">ID inválido.</span><br>Verifique o QR Code e tente novamente.';
                return;
            }

            // Buscar no localStorage
            var qrCodes = JSON.parse(localStorage.getItem('amovin_qrcodes') || '[]');
            var qr = qrCodes.find(function(q) { return q.id === id; });

            if (!qr) {
                mensagem.innerHTML = '❌ <span class="erro">QR Code não encontrado.</span><br>Este QR Code pode ter sido removido ou desativado.';
                return;
            }

            if (qr.status === 'Inativo') {
                mensagem.innerHTML = '⚠️ <span class="erro">QR Code inativo.</span><br>Este QR Code foi desativado pela administração.';
                return;
            }

            // Registrar escaneamento
            qr.escaneamentos = (qr.escaneamentos || 0) + 1;
            qr.ultimoEscaneamento = new Date().toISOString();
            localStorage.setItem('amovin_qrcodes', JSON.stringify(qrCodes));

            // Redirecionar
            mensagem.innerHTML = '🔗 Redirecionando para:<br><strong>' + qr.destino + '</strong>';
            
            setTimeout(function() {
                window.location.href = qr.destino;
            }, 1500);
        }

        redirecionar();
    </script>
<script src="menu.js?v=20261007"></script>
</body>
</html>
