<!DOCTYPE html>

    <style>
        :root { --laranja: #C65A11; --laranja-escuro: #A04A0E; --verde: #57C220; --azul: #1E88E5; --grafite: #1A1A1A; --cinza: #6B7280; --branco: #FFFFFF; --vermelho: #E53935; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }
        .main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
        .topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
        .topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
        .topo-bar h1 span { color: var(--laranja); }
        .btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .status-firebase { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 20px; background: #F8F4ED; font-size: 12px; font-weight: 600; border: 1px solid #F0E9DF; }
        .status-firebase.conectado { background: #E8F5E9; color: #2E7D32; border-color: #A5D6A7; }

        .status-firebase .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite; }

        .badge-master { background: linear-gradient(135deg, #7C3AED, #C65A11); color: white; font-size: 10px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .kpi-card { background: #FFFFFF; padding: 18px; border-radius: 14px; border: 1px solid #F0E9DF; text-align: center; }
        .kpi-card .kpi-valor { font-size: 28px; font-weight: 800; color: var(--laranja); }
        .kpi-card .kpi-label { font-size: 11px; color: var(--cinza); }
        .card { background: #FFFFFF; padding: 24px; border-radius: 14px; border: 1px solid #F0E9DF; margin-bottom: 20px; }
        .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid #F0E9DF; flex-wrap: wrap; }
        .tab { padding: 10px 22px; border: none; background: transparent; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--cinza); font-family: 'Inter', sans-serif; transition: all 0.2s; border-bottom: 3px solid transparent; }
        .tab:hover { color: var(--laranja); }
        .tab.ativo { color: var(--laranja); border-bottom-color: var(--laranja); }
        .tab-content { display: none; }
        .tab-content.ativo { display: block; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--cinza); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; background: #FAFAFA; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--laranja); background: #FFF; box-shadow: 0 0 0 3px rgba(198,90,17,0.08); }
        .form-group input[readonly] { background: #F0E9DF; color: var(--laranja); font-weight: 700; cursor: not-allowed; }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; font-family: 'Inter', sans-serif; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--laranja); color: white; } .btn-primary:hover { background: var(--laranja-escuro); }
        .btn-danger { background: var(--vermelho); color: white; }
        .btn-full { width: 100%; padding: 14px; font-size: 15px; justify-content: center; }
        .btn-sm { padding: 4px 10px; font-size: 10px; }
        .pessoa-item { padding: 12px 16px; border-bottom: 1px solid #F0E9DF; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .pessoa-item:hover { background: #FFF8E7; }
        .pessoa-item .info { flex: 1; min-width: 150px; }
        .pessoa-item .info .codigo { font-size: 10px; color: var(--laranja); font-weight: 700; letter-spacing: 0.5px; }
        .pessoa-item .info .nome { font-weight: 600; font-size: 14px; color: var(--grafite); }
        .pessoa-item .info .detalhe { font-size: 12px; color: var(--cinza); margin-top: 2px; }
        .status-badge { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 10px; font-weight: 600; margin-top: 4px; }
        .status-ativo { background: #E8F5E9; color: #2E7D32; }
        .status-inativo { background: #FFEBEE; color: #C62828; }
        .status-pendente { background: #FFF3E0; color: #E65100; }
        .sem-dados { text-align: center; padding: 30px; color: #9CA3AF; }
        .loading { text-align: center; padding: 40px; color: var(--cinza); }
        .loading .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid #E5E0D8; border-top: 3px solid var(--laranja); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .wa-check { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #FAFAFA; border: 1px solid #E5E0D8; border-radius: 8px; cursor: pointer; height: 42px; }
        .wa-check input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #25D366; }
        .wa-check label { font-size: 12.5px; color: var(--grafite); cursor: pointer; margin: 0; text-transform: none; letter-spacing: 0; }
        .wa-check.marcado { background: #E8F5E9; border-color: #A5D6A7; }
        .secao-titulo { font-size: 12px; font-weight: 700; color: var(--laranja); text-transform: uppercase; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--laranja); }
        .rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .rodape img { width: 50px; }
        .rodape .copyright { font-size: 8px; color: #8A8F98; }
        .rodape .contato { font-size: 9px; color: #8A8F98; }
        .rodape a { color: #C65A11; text-decoration: none; }
        @media (max-width: 900px) { .main-content { margin-left: 0; } .form-row { grid-template-columns: 1fr; } .tabs { flex-wrap: nowrap; overflow-x: auto; } .tab { padding: 8px 14px; font-size: 12px; white-space: nowrap; } }
    </style>
</head>

<script>
// ============================================================
// IDP - AMOVIN ERP (AERP) - VERSÃO FINAL
// 4 coleções: beneficiaries, professionals, volunteers, university_students
// Espelhamento automático para CRM (contatos) quando tem telefone
// ID interno (6 primeiros dígitos CPF) + Código A-IDP-2026-XXXX
// ============================================================

var dados = { beneficiario: [], profissional: [], voluntario: [], universitario: [] };
var projetos = [];
var firebasePronto = false;
var db = null;
var unsubs = [];

// ============================================================
// USUÁRIO LOGADO
// ============================================================
function getUsuarioLogado() {
    return {
        usuario: sessionStorage.getItem('amovin_usuario') || 'sistema',
        nome: sessionStorage.getItem('amovin_nome') || 'Sistema',
        perfil: sessionStorage.getItem('amovin_perfil') || 'admin'
    };
}
function isMaster() {
    var u = getUsuarioLogado();
    return u.perfil === 'admin' && u.nome === 'Administrador Master';
}

// ============================================================
// MÁSCARAS
// ============================================================
function mascaraCpf(i) {
    var v = i.value.replace(/\D/g, '');
    if (v.length > 11) v = v.slice(0, 11);
    v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    i.value = v;
}
function mascaraTelefone(i) {
    var v = i.value.replace(/\D/g, '');
    if (v.length > 11) v = v.slice(0, 11);
    v = v.length <= 10
        ? v.replace(/^(\d{2})(\d)/, '($1) $2').replace(/(\d{4})(\d)/, '$1-$2')
        : v.replace(/^(\d{2})(\d)/, '($1) $2').replace(/(\d{5})(\d)/, '$1-$2');
    i.value = v;
}
function apenasNumeros(s) { return (s || '').replace(/\D/g, ''); }

// WhatsApp
function toggleWa(id) {
    var cb = document.getElementById(id);
    cb.checked = !cb.checked;
    updateWa(id + 'Wrapper', id);
}
function updateWa(wrapperId, cbId) {
    var cb = document.getElementById(cbId);
    var w = document.getElementById(wrapperId);
    if (cb.checked) w.classList.add('marcado');
    else w.classList.remove('marcado');
}

function mostrarToast(msg, tipo) {
    var t = document.createElement('div');
    t.style.cssText = 'position:fixed;top:20px;right:20px;padding:16px 24px;border-radius:12px;color:white;font-weight:600;font-size:14px;z-index:10000;box-shadow:0 8px 32px rgba(0,0,0,0.15);max-width:400px;';
    var cores = { success: '#57C220', error: '#E53935', warning: '#E65100', info: '#1E88E5' };
    t.style.background = cores[tipo] || cores.success;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() { t.remove(); }, 4000);
}

function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function(c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
}

// ============================================================
// FIREBASE
// ============================================================
function inicializarFirebase() {
    if (typeof firebase === 'undefined') {
        var s = document.createElement('script');
        s.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js';
        s.onload = function() {
            var fs = document.createElement('script');
            fs.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js';
            fs.onload = function() {
                try {
                    var cfg = {
                        apiKey: "AIzaSyDQO-69vVBhmBK8oLt0DzfyigBmjxzu7b4",
                        authDomain: "gestao-amovin.firebaseapp.com",
                        projectId: "gestao-amovin",
                        storageBucket: "gestao-amovin.firebasestorage.app",
                        messagingSenderId: "316793420445",
                        appId: "1:316793420445:web:68e9898bbfcd30853f3274"
                    };
                    if (!firebase.apps.length) firebase.initializeApp(cfg);
                    db = firebase.firestore();
                    firebasePronto = true;
                    atualizarStatusFirebase('conectado');
                    escutarTudo();
                } catch (e) { atualizarStatusFirebase('offline'); console.error(e); }
            };
            document.head.appendChild(fs);
        };
        document.head.appendChild(s);
    } else {
        try {
            db = firebase.firestore();
            firebasePronto = true;
            atualizarStatusFirebase('conectado');
            escutarTudo();
        } catch (e) { atualizarStatusFirebase('offline'); }
    }
}
function atualizarStatusFirebase(s) {
    var el = document.getElementById('statusFirebase');
    if (s === 'conectado') { el.className = 'status-firebase conectado'; el.innerHTML = '<span class="dot"></span><span>🟢 Firebase</span>'; }
    else { el.className = 'status-firebase offline'; el.innerHTML = '<span class="dot"></span><span>🟡 Offline</span>'; }
}

function escutarTudo() {
    if (!firebasePronto || !db) return;
    // Projetos
    unsubs.push(db.collection('projetos').onSnapshot(function(snap) {
        projetos = [];
        snap.forEach(function(doc) { projetos.push({ _fbId: doc.id, ...doc.data() }); });
        preencherProjetos();
    }));
    // 4 coleções
    var mapa = [
        { tipo: 'beneficiario', colecao: 'beneficiaries' },
        { tipo: 'profissional', colecao: 'professionals' },
        { tipo: 'voluntario', colecao: 'volunteers' },
        { tipo: 'universitario', colecao: 'university_students' }
    ];
    mapa.forEach(function(m) {
        unsubs.push(db.collection(m.colecao).onSnapshot(function(snap) {
            dados[m.tipo] = [];
            snap.forEach(function(doc) { dados[m.tipo].push({ _fbId: doc.id, ...doc.data() }); });
            renderizarLista(m.tipo);
            atualizarKPIs();
        }));
    });
}

// ============================================================
// LOG DE AUDITORIA
// ============================================================
async function registrarLogAuditoria(acao, detalhes) {
    if (!firebasePronto || !db) return;
    var u = getUsuarioLogado();
    try {
        await db.collection('logs_auditoria').add({
            timestamp: new Date().toISOString(),
            usuario: u.usuario, nome: u.nome, perfil: u.perfil,
            isMaster: isMaster(), acao: acao, detalhes: detalhes || ''
        });
    } catch (e) {}
}

// ============================================================
// GERAR CÓDIGO A-IDP-2026-XXXX
// ============================================================
async function gerarProximoCodigo(colecao) {
    var ano = new Date().getFullYear();
    var prefixo = 'A-IDP-' + ano + '-';
    var max = 0;
    if (firebasePronto && db) {
        try {
            var snap = await db.collection(colecao).get();
            snap.forEach(function(doc) {
                var c = doc.data().codigo || '';
                if (c.indexOf(prefixo) === 0) {
                    var n = parseInt(c.substring(prefixo.length), 10);
                    if (!isNaN(n) && n > max) max = n;
                }
            });
        } catch (e) {}
    }
    return prefixo + String(max + 1).padStart(4, '0');
}

// ============================================================
// GERAR ID INTERNO (6 primeiros dígitos do CPF + sufixo)
// ============================================================
async function gerarIdInterno(cpf, tipoAtual, fbIdAtual) {
    var numeros = apenasNumeros(cpf);
    if (numeros.length < 6) return '';
    var idBase = numeros.substring(0, 6);
    // Verifica se existe em QUALQUER das 4 coleções
    var existe = false;
    var colecoes = ['beneficiaries', 'professionals', 'volunteers', 'university_students'];
    for (var i = 0; i < colecoes.length; i++) {
        try {
            var snap = await db.collection(colecoes[i]).where('idInterno', '==', idBase).get();
            if (!snap.empty) {
                snap.forEach(function(doc) {
                    if (doc.id !== fbIdAtual) existe = true;
                });
            }
        } catch (e) {}
    }
    if (!existe) return idBase;
    // Se existe, adiciona sufixo -1, -2, -3...
    var contador = 1;
    while (contador < 100) {
        var tentativa = idBase + '-' + contador;
        var colide = false;
        for (var j = 0; j < colecoes.length; j++) {
            try {
                var s = await db.collection(colecoes[j]).where('idInterno', '==', tentativa).get();
                if (!s.empty) { s.forEach(function(doc) { if (doc.id !== fbIdAtual) colide = true; }); }
            } catch (e) {}
        }
        if (!colide) return tentativa;
        contador++;
    }
    return idBase + '-' + Date.now();
}

// ============================================================
// MAPA DE CONFIGURAÇÃO DAS ABAS
// ============================================================
var CONFIG = {
    beneficiario: { nome: 'Beneficiário', colecao: 'beneficiaries', temResponsavel: true },
    profissional: { nome: 'Profissional', colecao: 'professionals', temResponsavel: false },
    voluntario: { nome: 'Voluntário', colecao: 'volunteers', temResponsavel: false },
    universitario: { nome: 'Universitário', colecao: 'university_students', temResponsavel: true }
};

// ============================================================
// ABRIR ABA (gera HTML dinâmico)
// ============================================================
function abrirAba(tipo) {
    var cfg = CONFIG[tipo];
    var html = '<div class="tab-content ativo" id="tab-' + tipo + '">';
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">';
    html += '<div>';
    html += '<h4 style="font-size:14px;color:var(--cinza);margin-bottom:12px;">📝 Cadastrar ' + cfg.nome + '</h4>';
    html += '<input type="hidden" id="' + tipo + 'Id">';
    html += '<div class="form-row">';
    html += '<div class="form-group"><label>ID Interno</label><input type="text" id="' + tipo + 'IdInterno" readonly placeholder="Gerado pelo CPF"></div>';
    html += '<div class="form-group"><label>Código</label><input type="text" id="' + tipo + 'Codigo" readonly placeholder="A-IDP-..."></div>';
    html += '</div>';
    html += '<div class="form-group"><label>Nome Completo *</label><input type="text" id="' + tipo + 'Nome" placeholder="Nome completo"></div>';
    html += '<div class="form-row">';
    html += '<div class="form-group"><label>CPF</label><input type="text" id="' + tipo + 'Cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCpf(this)" onblur="gerarIdNoForm(\'' + tipo + '\')"></div>';
    html += '<div class="form-group"><label>Data Nascimento</label><input type="date" id="' + tipo + 'Nascimento"></div>';
    html += '</div>';
    html += '<div class="form-group"><label>Email</label><input type="email" id="' + tipo + 'Email" placeholder="email@exemplo.com"></div>';
    html += '<div class="form-row">';
    html += '<div class="form-group"><label>Telefone</label><input type="text" id="' + tipo + 'Telefone" placeholder="(34) 99999-9999" maxlength="15" oninput="mascaraTelefone(this)"></div>';
    html += '<div class="form-group"><label>WhatsApp?</label><div class="wa-check" id="' + tipo + 'WaWrapper" onclick="toggleWa(\'' + tipo + 'Wa\')"><input type="checkbox" id="' + tipo + 'Wa" onclick="event.stopPropagation();updateWa(\'' + tipo + 'WaWrapper\',\'' + tipo + 'Wa\')"><label for="' + tipo + 'Wa">📱 Este número é WhatsApp</label></div></div>';
    html += '</div>';
    html += '<div class="form-group"><label>Endereço</label><input type="text" id="' + tipo + 'Endereco" placeholder="Rua, número, bairro"></div>';

    // Campos específicos
    if (tipo === 'profissional') {
        html += '<div class="form-row"><div class="form-group"><label>Especialidade *</label><input type="text" id="profissionalEspecialidade" placeholder="Psicólogo, Fisioterapeuta..."></div>';
        html += '<div class="form-group"><label>Registro</label><input type="text" id="profissionalRegistro" placeholder="CRP, CRAS..."></div></div>';
    }
    if (tipo === 'voluntario') {
        html += '<div class="form-group"><label>Área de Interesse</label><select id="voluntarioArea"><option value="Educação">📚 Educação</option><option value="Esporte">⚽ Esporte</option><option value="Saúde">🩺 Saúde</option><option value="Social">🤝 Social</option><option value="Administrativo">📋 Administrativo</option><option value="Outro">📌 Outro</option></select></div>';
    }
    if (cfg.temResponsavel) {
        html += '<div class="secao-titulo">👤 ' + (tipo === 'universitario' ? 'Contato de Emergência' : 'Responsável (se menor)') + '</div>';
        html += '<div class="form-row">';
        html += '<div class="form-group"><label>Nome do ' + (tipo === 'universitario' ? 'Contato' : 'Responsável') + '</label><input type="text" id="' + tipo + 'RespNome" placeholder="Nome"></div>';
        html += '<div class="form-group"><label>Telefone do ' + (tipo === 'universitario' ? 'Contato' : 'Responsável') + '</label><input type="text" id="' + tipo + 'RespTelefone" placeholder="(34) 99999-9999" maxlength="15" oninput="mascaraTelefone(this)"></div>';
        html += '</div>';
    }

    html += '<div class="form-row">';
    html += '<div class="form-group"><label>Status</label><select id="' + tipo + 'Status"><option value="ativo">✅ Ativo</option><option value="pendente">⏳ Pendente</option><option value="inativo">❌ Inativo</option></select></div>';
    html += '<div class="form-group"><label>📋 Projeto</label><select id="' + tipo + 'Projeto"><option value="">Nenhum</option></select></div>';
    html += '</div>';
    html += '<div class="form-group"><label>Observações</label><textarea id="' + tipo + 'Obs" rows="2"></textarea></div>';
    html += '<button class="btn btn-primary btn-full" onclick="salvarPessoa(\'' + tipo + '\')">💾 Salvar ' + cfg.nome + '</button>';
    html += '</div>';
    html += '<div>';
    html += '<h4 style="font-size:14px;color:var(--cinza);margin-bottom:12px;">📋 Lista de ' + cfg.nome + 's</h4>';
    html += '<div id="lista-' + tipo + '"><div class="loading"><div class="spinner"></div><div>Carregando...</div></div></div>';
    html += '</div>';
    html += '</div></div>';
    return html;
}

function mudarTab(tipo, btn) {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('ativo'); });
    btn.classList.add('ativo');
    document.getElementById('conteudoAbas').innerHTML = abrirAba(tipo);
    preencherProjetos();
    renderizarLista(tipo);
}

function preencherProjetos() {
    var selects = document.querySelectorAll('select[id$="Projeto"]');
    selects.forEach(function(sel) {
        var at = sel.value;
        sel.innerHTML = '<option value="">Nenhum</option>';
        projetos.forEach(function(p) {
            var opt = document.createElement('option');
            opt.value = p.codigo || p._fbId;
            opt.textContent = p.nome || p.codigo || '';
            sel.appendChild(opt);
        });
        if (at) sel.value = at;
    });
}

async function gerarIdNoForm(tipo) {
    var cpf = document.getElementById(tipo + 'Cpf').value;
    if (apenasNumeros(cpf).length < 6) return;
    var idAtual = document.getElementById(tipo + 'Id').value;
    if (idAtual) return; // Não gera se está editando
    var idInterno = await gerarIdInterno(cpf, tipo, null);
    document.getElementById(tipo + 'IdInterno').value = idInterno;
}

// ============================================================
// SALVAR PESSOA + ESPELHAR NO CRM
// ============================================================
async function salvarPessoa(tipo) {
    if (!firebasePronto || !db) { mostrarToast('⚠️ Firebase offline', 'warning'); return; }
    var cfg = CONFIG[tipo];
    var nome = document.getElementById(tipo + 'Nome').value.trim();
    if (!nome) { mostrarToast('⚠️ Nome é obrigatório!', 'warning'); return; }
    if (tipo === 'profissional') {
        var esp = document.getElementById('profissionalEspecialidade').value.trim();
        if (!esp) { mostrarToast('⚠️ Especialidade é obrigatória para profissional!', 'warning'); return; }
    }

    var telefone = document.getElementById(tipo + 'Telefone').value.trim();
    var isWhatsApp = document.getElementById(tipo + 'Wa').checked;
    var cpf = document.getElementById(tipo + 'Cpf').value.trim();
    var idEdit = document.getElementById(tipo + 'Id').value;

    // Gerar ID interno se ainda não tem
    var idInterno = document.getElementById(tipo + 'IdInterno').value;
    if (!idInterno && cpf) {
        idInterno = await gerarIdInterno(cpf, tipo, idEdit || null);
        document.getElementById(tipo + 'IdInterno').value = idInterno;
    }

    var dadosSalvar = {
        tipo: tipo,
        idInterno: idInterno,
        fullName: nome,
        cpf: cpf,
        birthDate: document.getElementById(tipo + 'Nascimento').value,
        email: document.getElementById(tipo + 'Email').value.trim(),
        phone: telefone,
        whatsapp: isWhatsApp ? telefone : '',
        isWhatsApp: isWhatsApp,
        address: document.getElementById(tipo + 'Endereco').value.trim(),
        status: document.getElementById(tipo + 'Status').value,
        projeto_id: document.getElementById(tipo + 'Projeto').value || null,
        notes: document.getElementById(tipo + 'Obs').value.trim(),
        atualizadoEm: new Date().toISOString(),
        atualizadoPor: getUsuarioLogado().usuario,
        year: String(new Date().getFullYear())
    };

    if (tipo === 'profissional') {
        dadosSalvar.specialty = document.getElementById('profissionalEspecialidade').value.trim();
        dadosSalvar.registration = document.getElementById('profissionalRegistro').value.trim();
    }
    if (tipo === 'voluntario') {
        dadosSalvar.area = document.getElementById('voluntarioArea').value;
    }
    if (cfg.temResponsavel) {
        dadosSalvar.responsavelNome = document.getElementById(tipo + 'RespNome').value.trim();
        dadosSalvar.responsavelTelefone = document.getElementById(tipo + 'RespTelefone').value.trim();
    }

    try {
        if (idEdit) {
            await db.collection(cfg.colecao).doc(idEdit).update(dadosSalvar);
            mostrarToast('✅ ' + cfg.nome + ' atualizado!', 'success');
            registrarLogAuditoria('IDP_EDITAR_' + tipo.toUpperCase(), 'Editado: ' + nome);
            // Atualizar espelho no CRM
            await espelharNoCrm(tipo, idEdit, dadosSalvar);
            limparForm(tipo);
        } else {
            dadosSalvar.codigo = await gerarProximoCodigo(cfg.colecao);
            dadosSalvar.criadoEm = new Date().toISOString();
            var ref = await db.collection(cfg.colecao).add(dadosSalvar);
            var novoId = ref.id;
            mostrarToast('✅ ' + cfg.nome + ' ' + dadosSalvar.codigo + ' criado!', 'success');
            registrarLogAuditoria('IDP_CRIAR_' + tipo.toUpperCase(), 'Criado: ' + nome + ' (' + dadosSalvar.codigo + ')');
            // Espelhar no CRM
            await espelharNoCrm(tipo, novoId, dadosSalvar);
            limparForm(tipo);
        }
    } catch (e) { mostrarToast('❌ Erro: ' + e.message, 'error'); }
}

// ============================================================
// ESPELHAR NO CRM (contatos)
// ============================================================
async function espelharNoCrm(tipo, idpFbId, dadosIdp) {
    if (!firebasePronto || !db) return;

    // REGRA: só espelha se tiver telefone
    var telefoneEspelho = dadosIdp.phone;
    var nomeEspelho = dadosIdp.fullName;
    var isWhatsApp = dadosIdp.isWhatsApp;
    var categoriaCrm = '';
    var campoExtra = {};

    // Regras por tipo
    if (tipo === 'beneficiario') {
        // Se tem responsável, espelha o responsável
        if (dadosIdp.responsavelNome && dadosIdp.responsavelTelefone) {
            nomeEspelho = dadosIdp.responsavelNome;
            telefoneEspelho = dadosIdp.responsavelTelefone;
            isWhatsApp = false;
            campoExtra.vinculadoA = dadosIdp.fullName + ' (Beneficiário)';
        }
        categoriaCrm = 'Beneficiário';
    } else if (tipo === 'universitario') {
        // Espelha o universitário, mas com contato de emergência travado
        categoriaCrm = 'Universitário';
        if (dadosIdp.responsavelNome) {
            campoExtra.contatoEmergencia = dadosIdp.responsavelNome + ' · ' + (dadosIdp.responsavelTelefone || 'sem telefone');
        }
    } else if (tipo === 'profissional') {
        // Categoria = especialidade (se tiver) ou 'Profissional'
        categoriaCrm = dadosIdp.specialty || 'Profissional';
    } else if (tipo === 'voluntario') {
        categoriaCrm = 'Voluntário';
    }

    // Não espelha se não tem telefone
    if (!telefoneEspelho) return;

    // Verifica se já existe no CRM (pelo idpOrigem + idpFbId)
    var existente = null;
    try {
        var snap = await db.collection('contatos').where('idpOrigem', '==', CONFIG[tipo].colecao).where('idpFbId', '==', idpFbId).get();
        snap.forEach(function(doc) { existente = { _fbId: doc.id, ...doc.data() }; });
    } catch (e) {}

    var dadosCrm = {
        nome: nomeEspelho,
        categoria: categoriaCrm,
        cnpjCpf: dadosIdp.cpf || '',
        tel1: telefoneEspelho,
        whatsapp: isWhatsApp ? telefoneEspelho : '',
        isWhatsApp: isWhatsApp,
        email: dadosIdp.email || '',
        obs: dadosIdp.notes || '',
        idpOrigem: CONFIG[tipo].colecao,
        idpFbId: idpFbId,
        espelhadoEm: new Date().toISOString(),
        // Campos travados (não editáveis no CRM)
        camposTravados: campoExtra
    };
    Object.assign(dadosCrm, campoExtra);

    try {
        if (existente) {
            await db.collection('contatos').doc(existente._fbId).update(dadosCrm);
        } else {
            dadosCrm.codigo = await gerarCodigoCrm();
            dadosCrm.favorito = false;
            dadosCrm.criadoEm = new Date().toISOString();
            dadosCrm.historico = [{
                data: new Date().toISOString(),
                usuario: getUsuarioLogado().usuario,
                nomeUsuario: getUsuarioLogado().nome,
                acao: 'espelhado do IDP (' + tipo + ')'
            }];
            await db.collection('contatos').add(dadosCrm);
        }
    } catch (e) { console.warn('Erro espelhar CRM:', e); }
}

async function gerarCodigoCrm() {
    var ano = new Date().getFullYear();
    var prefixo = 'A-CRM-' + ano + '-';
    var max = 0;
    try {
        var snap = await db.collection('contatos').get();
        snap.forEach(function(doc) {
            var c = doc.data().codigo || '';
            if (c.indexOf(prefixo) === 0) {
                var n = parseInt(c.substring(prefixo.length), 10);
                if (!isNaN(n) && n > max) max = n;
            }
        });
    } catch (e) {}
    return prefixo + String(max + 1).padStart(4, '0');
}

// ============================================================
// LIMPAR FORM
// ============================================================
function limparForm(tipo) {
    var cfg = CONFIG[tipo];
    ['Id', 'IdInterno', 'Codigo', 'Nome', 'Cpf', 'Nascimento', 'Email', 'Telefone', 'Endereco', 'Obs', 'RespNome', 'RespTelefone'].forEach(function(c) {
        var el = document.getElementById(tipo + c);
        if (el) el.value = '';
    });
    if (tipo === 'profissional') {
        document.getElementById('profissionalEspecialidade').value = '';
        document.getElementById('profissionalRegistro').value = '';
    }
    if (tipo === 'voluntario') {
        document.getElementById('voluntarioArea').value = 'Educação';
    }
    var wa = document.getElementById(tipo + 'Wa');
    if (wa) { wa.checked = false; updateWa(tipo + 'WaWrapper', tipo + 'Wa'); }
    var status = document.getElementById(tipo + 'Status');
    if (status) status.value = 'ativo';
}

// ============================================================
// EDITAR
// ============================================================
function editarPessoa(tipo, fbId) {
    var p = dados[tipo].find(function(x) { return x._fbId === fbId; });
    if (!p) return;
    var set = function(campo, valor) { var el = document.getElementById(tipo + campo); if (el) el.value = valor || ''; };
    set('Id', p._fbId);
    set('IdInterno', p.idInterno);
    set('Codigo', p.codigo);
    set('Nome', p.fullName);
    set('Cpf', p.cpf);
    set('Nascimento', p.birthDate);
    set('Email', p.email);
    set('Telefone', p.phone);
    set('Endereco', p.address);
    set('Obs', p.notes);
    set('RespNome', p.responsavelNome);
    set('RespTelefone', p.responsavelTelefone);
    var wa = document.getElementById(tipo + 'Wa');
    if (wa) { wa.checked = p.isWhatsApp === true; updateWa(tipo + 'WaWrapper', tipo + 'Wa'); }
    set('Status', p.status);
    set('Projeto', p.projeto_id);
    if (tipo === 'profissional') {
        document.getElementById('profissionalEspecialidade').value = p.specialty || '';
        document.getElementById('profissionalRegistro').value = p.registration || '';
    }
    if (tipo === 'voluntario') {
        document.getElementById('voluntarioArea').value = p.area || 'Educação';
    }
    document.querySelector('.tab[data-tab="' + tipo + '"]').click();
}

// ============================================================
// EXCLUIR
// ============================================================
async function excluirPessoa(tipo, fbId) {
    var p = dados[tipo].find(function(x) { return x._fbId === fbId; });
    if (!p) return;
    if (!confirm('Excluir "' + (p.fullName || '') + '"?\n\n⚠️ ATENÇÃO: O contato espelhado no CRM será MANTIDO como histórico.')) return;
    var cfg = CONFIG[tipo];
    try {
        await db.collection('logs_exclusao').add({
            modulo: 'idp',
            colecao: cfg.colecao,
            itemCodigo: p.codigo || '',
            itemNome: p.fullName || '',
            usuario: getUsuarioLogado().usuario,
            nomeUsuario: getUsuarioLogado().nome,
            data: new Date().toISOString()
        });
        await db.collection(cfg.colecao).doc(fbId).delete();
        mostrarToast('🗑️ Excluído! (mantido no CRM como histórico)', 'info');
        registrarLogAuditoria('IDP_EXCLUIR_' + tipo.toUpperCase(), 'Excluído: ' + (p.fullName || ''));
    } catch (e) { mostrarToast('❌ ' + e.message, 'error'); }
}

// ============================================================
// RENDERIZAR LISTA
// ============================================================
function renderizarLista(tipo) {
    var container = document.getElementById('lista-' + tipo);
    if (!container) return;
    var lista = (dados[tipo] || []).slice().sort(function(a, b) {
        return (a.fullName || '').localeCompare(b.fullName || '', 'pt-BR');
    });
    if (lista.length === 0) {
        container.innerHTML = '<div class="sem-dados">Nenhum ' + CONFIG[tipo].nome.toLowerCase() + ' cadastrado.</div>';
        return;
    }
    container.innerHTML = lista.map(function(p) {
        var statusMap = { 'ativo': 'status-ativo', 'pendente': 'status-pendente', 'inativo': 'status-inativo' };
        var statusLbl = { 'ativo': '✅ Ativo', 'pendente': '⏳ Pendente', 'inativo': '❌ Inativo' };
        var detalhe = '';
        if (tipo === 'beneficiario') {
            detalhe = 'CPF: ' + (p.cpf || '—') + ' | 📞 ' + (p.phone || '—');
            if (p.responsavelNome) detalhe += '<br>👤 Resp: ' + p.responsavelNome;
        } else if (tipo === 'profissional') {
            detalhe = '🔬 ' + (p.specialty || '—') + ' | ' + (p.registration || '—');
        } else if (tipo === 'voluntario') {
            detalhe = '📌 ' + (p.area || '—');
        } else if (tipo === 'universitario') {
            detalhe = 'CPF: ' + (p.cpf || '—');
            if (p.responsavelNome) detalhe += '<br>📞 Contato: ' + p.responsavelNome;
        }
        return '<div class="pessoa-item">' +
            '<div class="info">' +
            '<div class="codigo">' + (p.idInterno || '—') + ' · ' + (p.codigo || '—') + '</div>' +
            '<div class="nome">' + escapeHtml(p.fullName || '—') + '</div>' +
            '<div class="detalhe">' + detalhe + '</div>' +
            '<div><span class="status-badge ' + (statusMap[p.status] || 'status-pendente') + '">' + (statusLbl[p.status] || p.status || '—') + '</span></div>' +
            '</div>' +
            '<div class="acoes" style="display:flex;gap:4px;">' +
            '<button class="btn btn-primary btn-sm" onclick="editarPessoa(\'' + tipo + '\',\'' + p._fbId + '\')">✏️</button>' +
            '<button class="btn btn-danger btn-sm" onclick="excluirPessoa(\'' + tipo + '\',\'' + p._fbId + '\')">🗑️</button>' +
            '</div></div>';
    }).join('');
}

// ============================================================
// KPIs
// ============================================================
function atualizarKPIs() {
    var total = (dados.beneficiario || []).length + (dados.profissional || []).length + (dados.voluntario || []).length + (dados.universitario || []).length;
    document.getElementById('kpiTotal').textContent = total;
    document.getElementById('kpiBeneficiarios').textContent = (dados.beneficiario || []).length;
    document.getElementById('kpiProfissionais').textContent = (dados.profissional || []).length;
    document.getElementById('kpiVoluntarios').textContent = (dados.voluntario || []).length;
    document.getElementById('kpiUniversitarios').textContent = (dados.universitario || []).length;
}
