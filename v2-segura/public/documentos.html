<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • Documentos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11;
  --amarelo: #F5C518;
  --verde: #57C220;
  --azul: #1E88E5;
  --grafite: #1A1A1A;
  --cinza: #6B7280;
  --cinza-claro: #F8F4ED;
  --branco: #FFFFFF;
  --vermelho: #E53935;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 22px; }
.kpi-card { background: #FFFFFF; padding: 18px; border-radius: 14px; border: 1px solid #F0E9DF; text-align: center; }
.kpi-card .kpi-valor { font-size: 24px; font-weight: 800; color: var(--laranja); }
.kpi-card .kpi-label { font-size: 11px; color: var(--cinza); }

.grid-docs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: #FFFFFF; padding: 24px; border-radius: 14px; border: 1px solid #F0E9DF; }
.card h3 { font-size: 16px; font-weight: 700; color: var(--grafite); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #F0E9DF; display: flex; justify-content: space-between; align-items: center; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--cinza); margin-bottom: 4px; text-transform: uppercase; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; }
.form-group textarea { resize: vertical; min-height: 60px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 12px; }
.btn-salvar { background: var(--laranja); color: white; }
.btn-editar { background: var(--amarelo); color: #1A1A1A; }
.btn-excluir { background: var(--vermelho); color: white; }

.doc-item { padding: 12px 16px; border-bottom: 1px solid #F0E9DF; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
.doc-item .titulo { font-weight: 600; color: var(--grafite); font-size: 13px; }
.doc-item .tipo { font-size: 10px; padding: 2px 10px; border-radius: 12px; font-weight: 600; }
.tipo-recibo { background: #E3F2FD; color: #1565C0; }
.tipo-protocolo { background: #FFF3E0; color: #E65100; }
.tipo-declaracao { background: #E8F5E9; color: #2E7D32; }
.tipo-termo { background: #F3E5F5; color: #7B1FA2; }
.doc-item .status { font-size: 10px; padding: 2px 10px; border-radius: 12px; font-weight: 600; }
.status-rascunho { background: #F5F5F5; color: #888; }
.status-emitido { background: #E8F5E9; color: #2E7D32; }
.status-cancelado { background: #FFEBEE; color: #C62828; }
.sem-dados { text-align: center; padding: 30px; color: #9CA3AF; }

.rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
.rodape-grid { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rodape-logo { flex-shrink: 0; } .rodape-logo .logo-vigorre { width: 50px; }
.rodape-info { flex: 1; } .rodape-info .copyright { font-size: 8px; color: #8A8F98; } .rodape-info .tm { font-size: 6px; vertical-align: super; }
.rodape-info .contato { font-size: 9px; color: #8A8F98; } .rodape-info a { color: #C65A11; text-decoration: none; } .rodape-info .email { font-size: 8px; color: #aaa; }
.logo-vigorre-fallback { font-size: 12px; font-weight: 700; display: none; }

@media (max-width: 900px) { .main-content { margin-left: 0; } .grid-docs { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="menu-container"></div>

<main class="main-content">
  <div class="topo-bar"><h1>📝 Documentos Oficiais</h1><button class="btn-sair-topo" onclick="window.location.href='dashboard.html'">🏠 Dashboard</button></div>

  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-valor" id="kpiTotal">0</div><div class="kpi-label">📋 Total</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiRecibos">0</div><div class="kpi-label">📄 Recibos</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiProtocolos">0</div><div class="kpi-label">📎 Protocolos</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiDeclaracoes">0</div><div class="kpi-label">📋 Declarações</div></div>
  </div>

  <div class="grid-docs">
    <div class="card">
      <h3>📝 Novo Documento</h3>
      <input type="hidden" id="docId">
      <div class="form-group"><label>Tipo *</label><select id="tipoDoc"><option value="recibo">📄 Recibo</option><option value="protocolo">📎 Protocolo</option><option value="declaracao">📋 Declaração</option><option value="termo">📑 Termo</option></select></div>
      <div class="form-group"><label>Título *</label><input type="text" id="tituloDoc" placeholder="Ex: Recibo de Doação"></div>
      <div class="form-group"><label>Descrição</label><textarea id="descricaoDoc" rows="2" placeholder="Descrição do documento..."></textarea></div>
      <div class="form-row"><div class="form-group"><label>Número</label><input type="text" id="numeroDoc" placeholder="0001/2026"></div><div class="form-group"><label>Data</label><input type="date" id="dataDoc"></div></div>
      <div class="form-group"><label>Status</label><select id="statusDoc"><option value="rascunho">📝 Rascunho</option><option value="emitido">✅ Emitido</option><option value="cancelado">❌ Cancelado</option></select></div>
      <div class="form-group"><label>Observações</label><input type="text" id="obsDoc" placeholder="Informações adicionais..."></div>
      <button class="btn btn-salvar" onclick="salvarDocumento()" style="width:100%;padding:12px;font-size:14px;">💾 Salvar Documento</button>
    </div>
    <div class="card">
      <h3>📋 Documentos</h3>
      <div id="listaDocumentos"><div class="sem-dados">Nenhum documento.</div></div>
    </div>
  </div>

  <div class="rodape"><div class="rodape-grid"><div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-vigorre-fallback">Vigorre</span></div><div class="rodape-info"><div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span></div><div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div><div class="email">contato@vigorre.com.br</div></div></div></div>
</main>

<script src="config.js"></script>
<script src="menu.js?v=20260904"></script>
<script>
var documentos = JSON.parse(localStorage.getItem('amovin_documentos_oficiais') || '[]');
var editandoId = null;

if (documentos.length === 0) {
    documentos = [
        { id: 1, tipo: 'recibo', titulo: 'Recibo de Doação - João Silva', descricao: 'Doação mensal', numero: '001/2026', data: new Date().toISOString().split('T')[0], status: 'emitido', obs: '' },
        { id: 2, tipo: 'protocolo', titulo: 'Protocolo - Processo 123', descricao: 'Abertura de processo', numero: '002/2026', data: new Date().toISOString().split('T')[0], status: 'rascunho', obs: '' }
    ];
    salvar();
}
function salvar() { localStorage.setItem('amovin_documentos_oficiais', JSON.stringify(documentos)); }

function getTipoClass(tipo) {
    var map = { 'recibo': 'tipo-recibo', 'protocolo': 'tipo-protocolo', 'declaracao': 'tipo-declaracao', 'termo': 'tipo-termo' };
    return map[tipo] || 'tipo-recibo';
}
function getStatusClass(status) {
    var map = { 'rascunho': 'status-rascunho', 'emitido': 'status-emitido', 'cancelado': 'status-cancelado' };
    return map[status] || 'status-rascunho';
}
function getStatusLabel(status) {
    var map = { 'rascunho': '📝 Rascunho', 'emitido': '✅ Emitido', 'cancelado': '❌ Cancelado' };
    return map[status] || status;
}

function atualizarKPIs() {
    var total = documentos.length;
    var recibos = documentos.filter(function(d) { return d.tipo === 'recibo'; }).length;
    var protocolos = documentos.filter(function(d) { return d.tipo === 'protocolo'; }).length;
    var declaracoes = documentos.filter(function(d) { return d.tipo === 'declaracao' || d.tipo === 'termo'; }).length;

    document.getElementById('kpiTotal').textContent = total;
    document.getElementById('kpiRecibos').textContent = recibos;
    document.getElementById('kpiProtocolos').textContent = protocolos;
    document.getElementById('kpiDeclaracoes').textContent = declaracoes;
}

function renderizarDocumentos() {
    var lista = documentos.slice().sort(function(a, b) { return new Date(b.data) - new Date(a.data); });
    var container = document.getElementById('listaDocumentos');
    if (lista.length === 0) {
        container.innerHTML = '<div class="sem-dados">Nenhum documento.</div>';
        return;
    }
    container.innerHTML = lista.map(function(d) {
        var tipoClass = getTipoClass(d.tipo);
        var statusClass = getStatusClass(d.status);
        var statusLabel = getStatusLabel(d.status);
        var data = d.data ? new Date(d.data + 'T00:00:00').toLocaleDateString('pt-BR') : '-';
        return '<div class="doc-item">' +
            '<div><span class="titulo">' + d.titulo + '</span> <span class="tipo ' + tipoClass + '">' + d.tipo + '</span><br>' +
            (d.descricao ? '<span style="font-size:12px;color:var(--cinza);">' + d.descricao + '</span><br>' : '') +
            '<span style="font-size:11px;color:var(--cinza);">#' + d.numero + ' | 📅 ' + data + '</span></div>' +
            '<div><span class="status ' + statusClass + '">' + statusLabel + '</span>' +
            '<button class="btn btn-editar" onclick="editarDocumento(' + d.id + ')" style="padding:4px 8px;font-size:10px;">✏️</button>' +
            '<button class="btn btn-excluir" onclick="excluirDocumento(' + d.id + ')" style="padding:4px 8px;font-size:10px;">🗑️</button></div></div>';
    }).join('');
}

window.salvarDocumento = function() {
    var titulo = document.getElementById('tituloDoc').value.trim();
    if (!titulo) { alert('Preencha o título!'); return; }

    var dados = {
        tipo: document.getElementById('tipoDoc').value,
        titulo: titulo,
        descricao: document.getElementById('descricaoDoc').value.trim(),
        numero: document.getElementById('numeroDoc').value.trim(),
        data: document.getElementById('dataDoc').value,
        status: document.getElementById('statusDoc').value,
        obs: document.getElementById('obsDoc').value.trim()
    };

    if (editandoId) {
        var idx = documentos.findIndex(function(d) { return d.id === editandoId; });
        if (idx >= 0) {
            for (var k in dados) documentos[idx][k] = dados[k];
        }
        editandoId = null;
    } else {
        dados.id = Date.now();
        documentos.push(dados);
    }

    salvar();
    limparForm();
    atualizarKPIs();
    renderizarDocumentos();
    alert('✅ Documento salvo com sucesso!');
};

window.editarDocumento = function(id) {
    var d = documentos.find(function(x) { return x.id === id; });
    if (!d) return;
    editandoId = id;
    document.getElementById('docId').value = id;
    document.getElementById('tipoDoc').value = d.tipo;
    document.getElementById('tituloDoc').value = d.titulo;
    document.getElementById('descricaoDoc').value = d.descricao || '';
    document.getElementById('numeroDoc').value = d.numero || '';
    document.getElementById('dataDoc').value = d.data || '';
    document.getElementById('statusDoc').value = d.status;
    document.getElementById('obsDoc').value = d.obs || '';
    document.querySelector('.card h3').textContent = '✏️ Editando: ' + d.titulo;
};

window.excluirDocumento = function(id) {
    if (!confirm('Excluir este documento?')) return;
    documentos = documentos.filter(function(d) { return d.id !== id; });
    salvar();
    atualizarKPIs();
    renderizarDocumentos();
};

function limparForm() {
    editandoId = null;
    document.getElementById('docId').value = '';
    document.getElementById('tipoDoc').value = 'recibo';
    document.getElementById('tituloDoc').value = '';
    document.getElementById('descricaoDoc').value = '';
    document.getElementById('numeroDoc').value = '';
    document.getElementById('dataDoc').value = new Date().toISOString().split('T')[0];
    document.getElementById('statusDoc').value = 'rascunho';
    document.getElementById('obsDoc').value = '';
    document.querySelector('.card h3').textContent = '📝 Novo Documento';
}

document.getElementById('dataDoc').value = new Date().toISOString().split('T')[0];

if (!sessionStorage.getItem('amovin_logado')) { window.location.href = 'index.html'; }

atualizarKPIs();
renderizarDocumentos();
</script>
</body>
</html>
