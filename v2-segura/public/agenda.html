<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • Agenda</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11;
  --amarelo: #F5C518;
  --verde: #57C220;
  --azul: #1E88E5;
  --grafite: #1A1A1A;
  --cinza: #6B7280;
  --cinza-claro: #F8F4ED;
  --branco: #FFFFFF;
  --vermelho: #E53935;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

.abas { display: flex; gap: 6px; margin-bottom: 22px; flex-wrap: wrap; }
.aba { padding: 10px 22px; border: 1px solid #F0E9DF; border-radius: 10px 10px 0 0; cursor: pointer; font-weight: 600; font-size: 13px; background: #FFFFFF; color: var(--cinza); transition: all 0.2s; }
.aba.ativa { background: var(--laranja); color: white; border-color: var(--laranja); }

.grid-agenda { display: grid; grid-template-columns: 380px 1fr; gap: 20px; }
.card { background: #FFFFFF; padding: 24px; border-radius: 14px; border: 1px solid #F0E9DF; }
.card h3 { font-size: 16px; font-weight: 700; color: var(--grafite); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #F0E9DF; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--cinza); margin-bottom: 4px; text-transform: uppercase; }
.form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; }
.linha-dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn-salvar { width: 100%; padding: 12px; background: var(--laranja); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
.btn-salvar:hover { background: #A04A0E; }
.btn-cancelar { width: 100%; padding: 10px; background: #F0E9DF; border: none; border-radius: 10px; cursor: pointer; font-size: 13px; margin-top: 5px; }

.evento-item { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 10px; margin-bottom: 8px; background: #F8F4ED; border-left: 4px solid var(--laranja); flex-wrap: wrap; }
.evento-item.presente { border-left-color: var(--verde); background: #E8F5E9; }
.evento-item.falta { border-left-color: var(--vermelho); background: #FFEBEE; }
.evento-item.cancelado { border-left-color: #7B1FA2; background: #F3E5F5; }
.evento-hora { font-weight: 700; font-size: 15px; color: var(--laranja); min-width: 55px; }
.evento-info { flex: 1; }
.evento-info .nome { font-weight: 600; color: var(--grafite); }
.evento-info .detalhe { font-size: 12px; color: var(--cinza); }

.btn-acao { padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 11px; font-weight: 700; margin: 2px; }
.btn-presente { background: var(--verde); color: white; }
.btn-falta { background: var(--vermelho); color: white; }
.btn-editar { background: var(--amarelo); color: #1A1A1A; }
.btn-excluir { background: #E5E0D8; color: #1A1A1A; }

.status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 600; }
.badge-agendado { background: #E3F2FD; color: #1565C0; }
.badge-presente { background: #E8F5E9; color: #2E7D32; }
.badge-falta { background: #FFEBEE; color: #C62828; }
.badge-cancelado { background: #F3E5F5; color: #7B1FA2; }
.sem-dados { text-align: center; padding: 40px; color: #9CA3AF; }

.rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
.rodape-grid { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rodape-logo { flex-shrink: 0; } .rodape-logo .logo-vigorre { width: 50px; }
.rodape-info { flex: 1; } .rodape-info .copyright { font-size: 8px; color: #8A8F98; } .rodape-info .tm { font-size: 6px; vertical-align: super; }
.rodape-info .contato { font-size: 9px; color: #8A8F98; } .rodape-info a { color: #C65A11; text-decoration: none; } .rodape-info .email { font-size: 8px; color: #aaa; }
.logo-vigorre-fallback { font-size: 12px; font-weight: 700; display: none; }

@media (max-width: 768px) { .main-content { margin-left: 0; } .grid-agenda { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="menu-container"></div>

<main class="main-content">
  <div class="topo-bar"><h1>📅 Agenda</h1><button class="btn-sair-topo" onclick="window.location.href='dashboard.html'">🏠 Dashboard</button></div>

  <div class="abas">
    <button class="aba ativa" onclick="mudarAba('agendamentos',this)">📋 Agendamentos</button>
    <button class="aba" onclick="mudarAba('disponibilidade',this)">🕐 Disponibilidade</button>
  </div>

  <div id="aba-agendamentos">
    <div class="grid-agenda">
      <div class="card">
        <h3 id="tituloForm">📝 Novo Agendamento</h3>
        <input type="hidden" id="eventoId">
        <div class="form-group"><label>Beneficiário *</label><select id="beneficiario"><option value="">Selecione...</option><option value="1">Maria Silva</option><option value="2">João Santos</option><option value="3">Ana Costa</option><option value="4">Pedro Lima</option><option value="5">Carla Souza</option></select></div>
        <div class="form-group"><label>Profissional *</label><select id="profissional"><option>Dr. Carlos Mendes</option><option>Dra. Lucia Ferreira</option><option>Profa. Sandra Reis</option></select></div>
        <div class="linha-dupla"><div class="form-group"><label>Data *</label><input type="date" id="dataEvento"></div><div class="form-group"><label>Horário *</label><select id="horaEvento"><option value="">Selecione...</option><option>08:00</option><option>08:30</option><option>09:00</option><option>09:30</option><option>10:00</option><option>10:30</option><option>11:00</option><option>11:30</option><option>13:00</option><option>13:30</option><option>14:00</option><option>14:30</option><option>15:00</option><option>15:30</option><option>16:00</option><option>16:30</option><option>17:00</option></select></div></div>
        <div class="form-group"><label>Sala *</label><select id="salaEvento"><option value="1">Sala 1</option><option value="2">Sala 2</option><option value="3">Sala 3</option></select></div>
        <div class="form-group"><label>Observações</label><input type="text" id="obsEvento"></div>
        <button class="btn-salvar" onclick="salvarAgendamento()">💾 Salvar</button>
        <button class="btn-cancelar" id="btnCancelar" style="display:none;" onclick="cancelarEdicao()">Cancelar</button>
      </div>
      <div class="card">
        <h3>📋 Agendamentos <span style="font-weight:400;font-size:13px;color:var(--cinza);" id="totalAgendamentos"></span></h3>
        <div id="listaAgendamentos"><div class="sem-dados">Nenhum agendamento.</div></div>
      </div>
    </div>
  </div>

  <div id="aba-disponibilidade" style="display:none;">
    <div class="card"><h3>🕐 Horários Disponíveis</h3>
      <div class="grid-agenda">
        <div class="card" style="border:1px solid #F0E9DF;">
          <div class="linha-dupla"><div class="form-group"><label>Data</label><input type="date" id="slotData"></div><div class="form-group"><label>Horário</label><input type="time" id="slotHora"></div></div>
          <div class="form-group"><label>Sala</label><select id="slotSala"><option value="1">Sala 1</option><option value="2">Sala 2</option><option value="3">Sala 3</option></select></div>
          <button class="btn-salvar" onclick="adicionarSlot()">➕ Adicionar</button>
        </div>
        <div id="listaSlots" style="max-height:400px;overflow-y:auto;"><div class="sem-dados">Nenhum horário.</div></div>
      </div>
    </div>
  </div>

  <div class="rodape"><div class="rodape-grid"><div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-vigorre-fallback">Vigorre</span></div><div class="rodape-info"><div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span></div><div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div><div class="email">contato@vigorre.com.br</div></div></div></div>
</main>

<script src="config.js"></script>
<script src="menu.js?v=20260904"></script>
<script>
var agendamentos = JSON.parse(localStorage.getItem('amovin_agendamentos') || '[]');
var slots = JSON.parse(localStorage.getItem('amovin_slots') || '[]');
var editandoId = null;
var bn = {1:'Maria Silva',2:'João Santos',3:'Ana Costa',4:'Pedro Lima',5:'Carla Souza'};
var sn = {1:'Sala 1',2:'Sala 2',3:'Sala 3'};

if (agendamentos.length === 0) {
    agendamentos = [
        {id:1,beneficiario:'1',profissional:'Dr. Carlos Mendes',data:new Date().toISOString().split('T')[0],hora:'09:00',sala:'1',obs:'Psicologia',status:'agendado'},
        {id:2,beneficiario:'2',profissional:'Dra. Lucia Ferreira',data:new Date().toISOString().split('T')[0],hora:'10:00',sala:'2',obs:'Social',status:'presente'}
    ];
    salvar();
}
function salvar() { localStorage.setItem('amovin_agendamentos', JSON.stringify(agendamentos)); localStorage.setItem('amovin_slots', JSON.stringify(slots)); }

function renderizarAgendamentos() {
    var hoje = new Date().toISOString().split('T')[0];
    var lista = agendamentos.filter(function(a){return a.data===hoje;}).sort(function(a,b){return a.hora.localeCompare(b.hora);});
    document.getElementById('totalAgendamentos').textContent = lista.length + ' hoje';
    document.getElementById('dataEvento').value = hoje;
    var c = document.getElementById('listaAgendamentos');
    if (lista.length === 0) { c.innerHTML = '<div class="sem-dados">Nenhum agendamento.</div>'; return; }
    c.innerHTML = lista.map(function(a){
        var cs = a.status==='presente'?'presente':a.status==='falta'?'falta':a.status==='cancelado'?'cancelado':'';
        return '<div class="evento-item '+cs+'"><div class="evento-hora">'+a.hora+'</div><div class="evento-info"><div class="nome">'+(bn[a.beneficiario]||'Beneficiário')+' <span class="status-badge badge-'+(a.status||'agendado')+'">'+(a.status||'Agendado')+'</span></div><div class="detalhe">👤 '+a.profissional+' | 🏠 '+sn[a.sala]+(a.obs?' | 📝 '+a.obs:'')+'</div></div><div style="display:flex;gap:3px;flex-wrap:wrap;">'+(a.status==='agendado'?'<button class="btn-acao btn-presente" onclick="marcarPresenca('+a.id+')">✅</button><button class="btn-acao btn-falta" onclick="marcarFalta('+a.id+')">❌</button>':'')+'<button class="btn-acao btn-editar" onclick="editarAgendamento('+a.id+')">✏️</button><button class="btn-acao btn-excluir" onclick="excluirAgendamento('+a.id+')">🗑️</button></div></div>';
    }).join('');
}

window.salvarAgendamento = function() {
    var b = document.getElementById('beneficiario').value, p = document.getElementById('profissional').value, d = document.getElementById('dataEvento').value, h = document.getElementById('horaEvento').value, s = document.getElementById('salaEvento').value, o = document.getElementById('obsEvento').value;
    if (!b||!p||!d||!h) { alert('Preencha os campos!'); return; }
    var conflito = agendamentos.find(function(a){return a.data===d&&a.hora===h&&a.sala===s&&a.id!==editandoId&&a.status!=='cancelado';});
    if (conflito) { alert('Sala '+sn[s]+' ocupada!'); return; }
    if (editandoId) { var idx = agendamentos.findIndex(function(a){return a.id===editandoId;}); if (idx>=0) agendamentos[idx] = Object.assign({},agendamentos[idx],{beneficiario:b,profissional:p,data:d,hora:h,sala:s,obs:o}); editandoId=null; document.getElementById('btnCancelar').style.display='none'; document.getElementById('tituloForm').textContent='Novo Agendamento'; }
    else { agendamentos.push({id:Date.now(),beneficiario:b,profissional:p,data:d,hora:h,sala:s,obs:o,status:'agendado'}); }
    salvar(); renderizarAgendamentos(); limparForm();
};
window.editarAgendamento = function(id) { var a = agendamentos.find(function(a){return a.id===id;}); if(!a)return; editandoId=id; document.getElementById('tituloForm').textContent='Editando'; document.getElementById('beneficiario').value=a.beneficiario; document.getElementById('profissional').value=a.profissional; document.getElementById('dataEvento').value=a.data; document.getElementById('horaEvento').value=a.hora; document.getElementById('salaEvento').value=a.sala; document.getElementById('obsEvento').value=a.obs||''; document.getElementById('btnCancelar').style.display='block'; };
window.excluirAgendamento = function(id) { if(!confirm('Excluir?'))return; agendamentos=agendamentos.filter(function(a){return a.id!==id;}); salvar(); renderizarAgendamentos(); };
window.cancelarEdicao = function() { editandoId=null; limparForm(); document.getElementById('btnCancelar').style.display='none'; };
window.marcarPresenca = function(id) { var a=agendamentos.find(function(a){return a.id===id;}); if(a){a.status='presente';salvar();renderizarAgendamentos();} };
window.marcarFalta = function(id) { var a=agendamentos.find(function(a){return a.id===id;}); if(a){a.status='falta';salvar();renderizarAgendamentos();} };
function limparForm() { document.getElementById('beneficiario').value='';document.getElementById('profissional').value='';document.getElementById('horaEvento').value='';document.getElementById('obsEvento').value=''; }

window.adicionarSlot = function() { var d=document.getElementById('slotData').value,h=document.getElementById('slotHora').value,s=document.getElementById('slotSala').value; if(!d||!h)return; slots.push({data:d,hora:h,sala:s}); salvar(); renderizarSlots(); };
window.removerSlot = function(d,h,s) { slots=slots.filter(function(sl){return !(sl.data===d&&sl.hora===h&&sl.sala===s);}); salvar(); renderizarSlots(); };
function renderizarSlots() { var c=document.getElementById('listaSlots'); if(slots.length===0){c.innerHTML='<div class="sem-dados">Nenhum horário.</div>';return;} c.innerHTML=slots.sort(function(a,b){return a.data.localeCompare(b.data)||a.hora.localeCompare(b.hora);}).map(function(s){return '<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #F0E9DF;flex-wrap:wrap;gap:6px;"><span>📅 '+new Date(s.data+'T00:00:00').toLocaleDateString('pt-BR')+' 🕐 '+s.hora+' | '+sn[s.sala]+'</span><button class="btn-acao btn-excluir" onclick="removerSlot(\''+s.data+'\',\''+s.hora+'\',\''+s.sala+'\')">🗑️</button></div>';}).join(''); }

window.mudarAba = function(aba, btn) { document.querySelectorAll('.aba').forEach(function(a){a.classList.remove('ativa');}); btn.classList.add('ativa'); document.getElementById('aba-agendamentos').style.display = aba==='agendamentos'?'block':'none'; document.getElementById('aba-disponibilidade').style.display = aba==='disponibilidade'?'block':'none'; };

if (!sessionStorage.getItem('amovin_logado')) { window.location.href = 'index.html'; }

renderizarAgendamentos(); renderizarSlots();
</script>
</body>
</html>
