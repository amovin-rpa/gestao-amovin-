<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • Estoque</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11;
  --amarelo: #F5C518;
  --verde: #57C220;
  --azul: #1E88E5;
  --grafite: #1A1A1A;
  --cinza: #6B7280;
  --cinza-claro: #F8F4ED;
  --branco: #FFFFFF;
  --vermelho: #E53935;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 22px; }
.kpi-card { background: #FFFFFF; padding: 18px; border-radius: 14px; border: 1px solid #F0E9DF; text-align: center; }
.kpi-card .kpi-valor { font-size: 24px; font-weight: 800; }
.kpi-card .kpi-label { font-size: 11px; color: var(--cinza); }
.kpi-card .kpi-valor.critico { color: var(--vermelho); }
.kpi-card .kpi-valor.alerta { color: #E65100; }
.kpi-card .kpi-valor.ok { color: var(--verde); }
.kpi-card .kpi-valor.azul { color: var(--azul); }

.grid-estoque { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: #FFFFFF; padding: 24px; border-radius: 14px; border: 1px solid #F0E9DF; }
.card h3 { font-size: 16px; font-weight: 700; color: var(--grafite); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #F0E9DF; display: flex; justify-content: space-between; align-items: center; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--cinza); margin-bottom: 4px; text-transform: uppercase; }
.form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 12px; }
.btn-salvar { background: var(--laranja); color: white; }
.btn-editar { background: var(--amarelo); color: #1A1A1A; }
.btn-excluir { background: var(--vermelho); color: white; }

.estoque-item { padding: 12px 16px; border-bottom: 1px solid #F0E9DF; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
.estoque-item .nome { font-weight: 600; color: var(--grafite); font-size: 13px; }
.estoque-item .qtd { font-weight: 700; }
.estoque-item .qtd.critico { color: var(--vermelho); }
.estoque-item .qtd.alerta { color: #E65100; }
.estoque-item .qtd.ok { color: var(--verde); }
.estoque-item .categoria { font-size: 10px; background: #F8F4ED; padding: 2px 10px; border-radius: 12px; color: var(--cinza); }
.estoque-item .status { font-size: 10px; padding: 2px 10px; border-radius: 12px; font-weight: 600; }
.status-ok { background: #E8F5E9; color: #2E7D32; }
.status-alerta { background: #FFF3E0; color: #E65100; }
.status-critico { background: #FFEBEE; color: #C62828; }
.sem-dados { text-align: center; padding: 30px; color: #9CA3AF; }

.rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
.rodape-grid { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rodape-logo { flex-shrink: 0; } .rodape-logo .logo-vigorre { width: 50px; }
.rodape-info { flex: 1; } .rodape-info .copyright { font-size: 8px; color: #8A8F98; } .rodape-info .tm { font-size: 6px; vertical-align: super; }
.rodape-info .contato { font-size: 9px; color: #8A8F98; } .rodape-info a { color: #C65A11; text-decoration: none; } .rodape-info .email { font-size: 8px; color: #aaa; }
.logo-vigorre-fallback { font-size: 12px; font-weight: 700; display: none; }

@media (max-width: 900px) { .main-content { margin-left: 0; } .grid-estoque { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="menu-container"></div>

<main class="main-content">
  <div class="topo-bar"><h1>📦 Estoque</h1><button class="btn-sair-topo" onclick="window.location.href='dashboard.html'">🏠 Dashboard</button></div>

  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-valor azul" id="kpiTotal">0</div><div class="kpi-label">📦 Itens</div></div>
    <div class="kpi-card"><div class="kpi-valor ok" id="kpiOk">0</div><div class="kpi-label">✅ Estoque OK</div></div>
    <div class="kpi-card"><div class="kpi-valor alerta" id="kpiAlerta">0</div><div class="kpi-label">⚠️ Em Alerta</div></div>
    <div class="kpi-card"><div class="kpi-valor critico" id="kpiCritico">0</div><div class="kpi-label">🔴 Crítico</div></div>
  </div>

  <div class="grid-estoque">
    <div class="card">
      <h3>📝 Novo Item</h3>
      <input type="hidden" id="itemId">
      <div class="form-group"><label>Nome do Item *</label><input type="text" id="nomeItem" placeholder="Ex: Cesta Básica"></div>
      <div class="form-row"><div class="form-group"><label>Categoria</label><select id="categoriaItem"><option>Alimento</option><option>Higiene</option><option>Material Esportivo</option><option>Material Escolar</option><option>Equipamento</option><option>Mobiliário</option><option>Outros</option></select></div><div class="form-group"><label>Unidade</label><select id="unidadeItem"><option>Unidade</option><option>Kg</option><option>Litro</option><option>Pacote</option><option>Caixa</option></select></div></div>
      <div class="form-row"><div class="form-group"><label>Quantidade *</label><input type="number" id="qtdItem" value="0" min="0"></div><div class="form-group"><label>Qtd Mínima *</label><input type="number" id="qtdMinima" value="5" min="0"></div></div>
      <div class="form-group"><label>Localização</label><input type="text" id="localItem" value="Almoxarifado"></div>
      <div class="form-group"><label>Observações</label><input type="text" id="obsItem"></div>
      <button class="btn btn-salvar" onclick="salvarItem()" style="width:100%;padding:12px;font-size:14px;">💾 Salvar Item</button>
    </div>
    <div class="card">
      <h3>📋 Itens em Estoque</h3>
      <div id="listaItens"><div class="sem-dados">Nenhum item.</div></div>
    </div>
  </div>

  <div class="rodape"><div class="rodape-grid"><div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-vigorre-fallback">Vigorre</span></div><div class="rodape-info"><div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span></div><div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div><div class="email">contato@vigorre.com.br</div></div></div></div>
</main>

<script src="config.js"></script>
<script src="menu.js?v=20260904"></script>
<script>
var estoque = JSON.parse(localStorage.getItem('amovin_estoque') || '[]');
var editandoId = null;

if (estoque.length === 0) {
    estoque = [
        { id: 1, nome: 'Cesta Básica', categoria: 'Alimento', unidade: 'Unidade', qtd: 15, qtdMinima: 20, local: 'Almoxarifado', obs: '' },
        { id: 2, nome: 'Cadeira de Rodas', categoria: 'Equipamento', unidade: 'Unidade', qtd: 3, qtdMinima: 2, local: 'Sala Equipamentos', obs: '' },
        { id: 3, nome: 'Kit Escolar', categoria: 'Material Escolar', unidade: 'Pacote', qtd: 45, qtdMinima: 10, local: 'Almoxarifado', obs: '' }
    ];
    salvar();
}
function salvar() { localStorage.setItem('amovin_estoque', JSON.stringify(estoque)); }

function getStatus(item) {
    if (item.qtd <= 0) return { label: '🔴 Esgotado', cls: 'status-critico', qtdCls: 'critico' };
    if (item.qtd <= item.qtdMinima) return { label: '⚠️ Baixo', cls: 'status-alerta', qtdCls: 'alerta' };
    return { label: '✅ OK', cls: 'status-ok', qtdCls: 'ok' };
}

function atualizarKPIs() {
    var total = estoque.length;
    var alerta = estoque.filter(function(i) { return i.qtd <= i.qtdMinima && i.qtd > 0; }).length;
    var critico = estoque.filter(function(i) { return i.qtd === 0; }).length;
    var ok = total - alerta - critico;

    document.getElementById('kpiTotal').textContent = total;
    document.getElementById('kpiOk').textContent = ok;
    document.getElementById('kpiAlerta').textContent = alerta;
    document.getElementById('kpiCritico').textContent = critico;
}

function renderizarItens() {
    var lista = estoque.slice().sort(function(a, b) { return a.nome.localeCompare(b.nome); });
    var container = document.getElementById('listaItens');
    if (lista.length === 0) {
        container.innerHTML = '<div class="sem-dados">Nenhum item.</div>';
        return;
    }
    container.innerHTML = lista.map(function(i) {
        var status = getStatus(i);
        return '<div class="estoque-item">' +
            '<div><span class="nome">' + i.nome + '</span> <span class="categoria">' + i.categoria + '</span><br><span style="font-size:11px;color:var(--cinza);">📍 ' + i.local + ' | ' + i.unidade + '</span></div>' +
            '<div><span class="qtd ' + status.qtdCls + '">' + i.qtd + '</span> <span class="status ' + status.cls + '">' + status.label + '</span>' +
            '<button class="btn btn-editar" onclick="editarItem(' + i.id + ')" style="padding:4px 8px;font-size:10px;">✏️</button>' +
            '<button class="btn btn-excluir" onclick="excluirItem(' + i.id + ')" style="padding:4px 8px;font-size:10px;">🗑️</button></div></div>';
    }).join('');
}

window.salvarItem = function() {
    var nome = document.getElementById('nomeItem').value.trim();
    var qtd = parseInt(document.getElementById('qtdItem').value) || 0;
    var qtdMinima = parseInt(document.getElementById('qtdMinima').value) || 0;

    if (!nome) { alert('Preencha o nome!'); return; }

    var dados = {
        nome: nome,
        categoria: document.getElementById('categoriaItem').value,
        unidade: document.getElementById('unidadeItem').value,
        qtd: qtd,
        qtdMinima: qtdMinima,
        local: document.getElementById('localItem').value.trim() || 'Almoxarifado',
        obs: document.getElementById('obsItem').value.trim()
    };

    if (editandoId) {
        var idx = estoque.findIndex(function(i) { return i.id === editandoId; });
        if (idx >= 0) {
            for (var k in dados) estoque[idx][k] = dados[k];
        }
        editandoId = null;
    } else {
        dados.id = Date.now();
        estoque.push(dados);
    }

    salvar();
    limparForm();
    atualizarKPIs();
    renderizarItens();
    alert('✅ Item salvo com sucesso!');
};

window.editarItem = function(id) {
    var i = estoque.find(function(x) { return x.id === id; });
    if (!i) return;
    editandoId = id;
    document.getElementById('itemId').value = id;
    document.getElementById('nomeItem').value = i.nome;
    document.getElementById('categoriaItem').value = i.categoria;
    document.getElementById('unidadeItem').value = i.unidade;
    document.getElementById('qtdItem').value = i.qtd;
    document.getElementById('qtdMinima').value = i.qtdMinima;
    document.getElementById('localItem').value = i.local || 'Almoxarifado';
    document.getElementById('obsItem').value = i.obs || '';
    document.querySelector('.card h3').textContent = '✏️ Editando: ' + i.nome;
};

window.excluirItem = function(id) {
    if (!confirm('Excluir este item?')) return;
    estoque = estoque.filter(function(i) { return i.id !== id; });
    salvar();
    atualizarKPIs();
    renderizarItens();
};

function limparForm() {
    editandoId = null;
    document.getElementById('itemId').value = '';
    document.getElementById('nomeItem').value = '';
    document.getElementById('categoriaItem').value = 'Alimento';
    document.getElementById('unidadeItem').value = 'Unidade';
    document.getElementById('qtdItem').value = '0';
    document.getElementById('qtdMinima').value = '5';
    document.getElementById('localItem').value = 'Almoxarifado';
    document.getElementById('obsItem').value = '';
    document.querySelector('.card h3').textContent = '📝 Novo Item';
}

if (!sessionStorage.getItem('amovin_logado')) { window.location.href = 'index.html'; }

atualizarKPIs();
renderizarItens();
</script>
</body>
</html>
