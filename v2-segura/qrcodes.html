<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amovin ERP Social • QR Codes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --laranja: #C65A11;
  --amarelo: #F5C518;
  --verde: #57C220;
  --azul: #1E88E5;
  --grafite: #1A1A1A;
  --cinza: #6B7280;
  --cinza-claro: #F8F4ED;
  --branco: #FFFFFF;
  --vermelho: #E53935;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8F4ED; display: flex; min-height: 100vh; }

/* ============================================================
   A SIDEBAR FOI REMOVIDA DAQUI - VEM DO menu.js
   ============================================================ */

.main-content { flex: 1; margin-left: 270px; padding: 24px 30px; }
.topo-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.topo-bar h1 { font-size: 24px; font-weight: 700; color: var(--grafite); }
.btn-sair-topo { background: #F8F4ED; color: #1A1A1A; border: 1px solid #F0E9DF; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 22px; }
.kpi-card { background: #FFFFFF; padding: 18px; border-radius: 14px; border: 1px solid #F0E9DF; text-align: center; }
.kpi-card .kpi-valor { font-size: 24px; font-weight: 800; color: var(--laranja); }
.kpi-card .kpi-label { font-size: 11px; color: var(--cinza); }

.grid-qr { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: #FFFFFF; padding: 24px; border-radius: 14px; border: 1px solid #F0E9DF; }
.card h3 { font-size: 16px; font-weight: 700; color: var(--grafite); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #F0E9DF; display: flex; justify-content: space-between; align-items: center; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--cinza); margin-bottom: 4px; text-transform: uppercase; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #E5E0D8; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; }

.btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 12px; }
.btn-salvar { background: var(--laranja); color: white; }
.btn-editar { background: var(--amarelo); color: #1A1A1A; }
.btn-excluir { background: var(--vermelho); color: white; }
.btn-verde { background: var(--verde); color: white; }

.qr-item { padding: 12px 16px; border-bottom: 1px solid #F0E9DF; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
.qr-item .nome { font-weight: 600; color: var(--grafite); font-size: 13px; }
.qr-item .tipo { font-size: 10px; padding: 2px 10px; border-radius: 12px; font-weight: 600; background: #E3F2FD; color: #1565C0; }
.qr-item .status { font-size: 10px; padding: 2px 10px; border-radius: 12px; font-weight: 600; }
.status-ativo { background: #E8F5E9; color: #2E7D32; }
.status-inativo { background: #FFEBEE; color: #C62828; }
.sem-dados { text-align: center; padding: 30px; color: #9CA3AF; }

.rodape { background: #FFFFFF; border-radius: 14px; padding: 12px 18px; border: 1px solid #F0E9DF; margin-top: 20px; }
.rodape-grid { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rodape-logo { flex-shrink: 0; } .rodape-logo .logo-vigorre { width: 50px; }
.rodape-info { flex: 1; } .rodape-info .copyright { font-size: 8px; color: #8A8F98; } .rodape-info .tm { font-size: 6px; vertical-align: super; }
.rodape-info .contato { font-size: 9px; color: #8A8F98; } .rodape-info a { color: #C65A11; text-decoration: none; } .rodape-info .email { font-size: 8px; color: #aaa; }
.logo-vigorre-fallback { font-size: 12px; font-weight: 700; display: none; }

@media (max-width: 900px) { .main-content { margin-left: 0; } .grid-qr { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- O MENU SERÁ CARREGADO PELO menu.js -->

<main class="main-content">
  <div class="topo-bar"><h1>📱 QR Codes</h1><button class="btn-sair-topo" onclick="window.location.href='index.html'">🚪 Sair</button></div>

  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-valor" id="kpiTotal">0</div><div class="kpi-label">📱 QR Codes</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiAtivos">0</div><div class="kpi-label">✅ Ativos</div></div>
    <div class="kpi-card"><div class="kpi-valor" id="kpiEscaneados">0</div><div class="kpi-label">📊 Escaneados</div></div>
  </div>

  <div class="grid-qr">
    <div class="card">
      <h3>📝 Novo QR Code</h3>
      <input type="hidden" id="qrId">
      <div class="form-group"><label>Nome *</label><input type="text" id="nomeQr" placeholder="Ex: Acesso Rápido"></div>
      <div class="form-group"><label>URL / Link *</label><input type="text" id="urlQr" placeholder="https://amovin.org.br"></div>
      <div class="form-group"><label>Descrição</label><textarea id="descricaoQr" rows="2" placeholder="Descrição do QR Code..."></textarea></div>
      <div class="form-row"><div class="form-group"><label>Tipo</label><select id="tipoQr"><option>Link</option><option>Documento</option><option>Contato</option><option>Evento</option><option>Outros</option></select></div><div class="form-group"><label>Status</label><select id="statusQr"><option value="ativo">✅ Ativo</option><option value="inativo">❌ Inativo</option></select></div></div>
      <button class="btn btn-salvar" onclick="salvarQr()" style="width:100%;padding:12px;font-size:14px;">💾 Salvar QR Code</button>
    </div>
    <div class="card">
      <h3>📋 QR Codes</h3>
      <div id="listaQrs"><div class="sem-dados">Nenhum QR Code.</div></div>
    </div>
  </div>

  <div class="rodape"><div class="rodape-grid"><div class="rodape-logo"><img src="images/logo-vigorre.png" alt="Vigorre" class="logo-vigorre" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="logo-vigorre-fallback">Vigorre</span></div><div class="rodape-info"><div class="copyright">© 2026 VIGORRE DESIGNER<span class="tm">™</span></div><div class="contato"><a href="https://www.vigorre.com.br">www.vigorre.com.br</a> | <a href="https://wa.me/5534991850735">(34) 99185-0735</a></div><div class="email">contato@vigorre.com.br</div></div></div></div>
</main>

<script>
var qrCodes = JSON.parse(localStorage.getItem('amovin_qrcodes') || '[]');
var editandoId = null;

if (qrCodes.length === 0) {
    qrCodes = [
        { id: 1, nome: 'Site AMOVIN', url: 'https://amovin.org.br', descricao: 'Acesso ao site oficial', tipo: 'Link', status: 'ativo', escaneados: 15 },
        { id: 2, nome: 'WhatsApp AMOVIN', url: 'https://wa.me/5534999999999', descricao: 'Contato pelo WhatsApp', tipo: 'Contato', status: 'ativo', escaneados: 8 }
    ];
    salvar();
}
function salvar() { localStorage.setItem('amovin_qrcodes', JSON.stringify(qrCodes)); }

function atualizarKPIs() {
    var total = qrCodes.length;
    var ativos = qrCodes.filter(function(q) { return q.status === 'ativo'; }).length;
    var escaneados = qrCodes.reduce(function(s, q) { return s + (q.escaneados || 0); }, 0);

    document.getElementById('kpiTotal').textContent = total;
    document.getElementById('kpiAtivos').textContent = ativos;
    document.getElementById('kpiEscaneados').textContent = escaneados;
}

function renderizarQrs() {
    var lista = qrCodes.slice().sort(function(a, b) { return a.nome.localeCompare(b.nome); });
    var container = document.getElementById('listaQrs');
    if (lista.length === 0) {
        container.innerHTML = '<div class="sem-dados">Nenhum QR Code.</div>';
        return;
    }
    container.innerHTML = lista.map(function(q) {
        var statusClass = q.status === 'ativo' ? 'status-ativo' : 'status-inativo';
        var statusLabel = q.status === 'ativo' ? '✅ Ativo' : '❌ Inativo';
        return '<div class="qr-item">' +
            '<div><span class="nome">' + q.nome + '</span> <span class="tipo">' + q.tipo + '</span><br>' +
            (q.descricao ? '<span style="font-size:12px;color:var(--cinza);">' + q.descricao + '</span><br>' : '') +
            '<span style="font-size:11px;color:var(--cinza);">' + q.url + '</span></div>' +
            '<div><span style="font-size:12px;color:var(--cinza);">📊 ' + (q.escaneados || 0) + '</span>' +
            '<span class="status ' + statusClass + '">' + statusLabel + '</span>' +
            '<button class="btn btn-verde" onclick="escanearQr(' + q.id + ')" style="padding:4px 8px;font-size:10px;">📷</button>' +
            '<button class="btn btn-editar" onclick="editarQr(' + q.id + ')" style="padding:4px 8px;font-size:10px;">✏️</button>' +
            '<button class="btn btn-excluir" onclick="excluirQr(' + q.id + ')" style="padding:4px 8px;font-size:10px;">🗑️</button></div></div>';
    }).join('');
}

window.salvarQr = function() {
    var nome = document.getElementById('nomeQr').value.trim();
    var url = document.getElementById('urlQr').value.trim();

    if (!nome) { alert('Preencha o nome!'); return; }
    if (!url) { alert('Preencha a URL!'); return; }

    var dados = {
        nome: nome,
        url: url,
        descricao: document.getElementById('descricaoQr').value.trim(),
        tipo: document.getElementById('tipoQr').value,
        status: document.getElementById('statusQr').value,
        escaneados: editandoId ? null : 0
    };

    if (editandoId) {
        var idx = qrCodes.findIndex(function(q) { return q.id === editandoId; });
        if (idx >= 0) {
            dados.escaneados = qrCodes[idx].escaneados || 0;
            for (var k in dados) qrCodes[idx][k] = dados[k];
        }
        editandoId = null;
    } else {
        dados.id = Date.now();
        dados.escaneados = 0;
        qrCodes.push(dados);
    }

    salvar();
    limparForm();
    atualizarKPIs();
    renderizarQrs();
    alert('✅ QR Code salvo com sucesso!');
};

window.editarQr = function(id) {
    var q = qrCodes.find(function(x) { return x.id === id; });
    if (!q) return;
    editandoId = id;
    document.getElementById('qrId').value = id;
    document.getElementById('nomeQr').value = q.nome;
    document.getElementById('urlQr').value = q.url;
    document.getElementById('descricaoQr').value = q.descricao || '';
    document.getElementById('tipoQr').value = q.tipo || 'Link';
    document.getElementById('statusQr').value = q.status;
    document.querySelector('.card h3').textContent = '✏️ Editando: ' + q.nome;
};

window.excluirQr = function(id) {
    if (!confirm('Excluir este QR Code?')) return;
    qrCodes = qrCodes.filter(function(q) { return q.id !== id; });
    salvar();
    atualizarKPIs();
    renderizarQrs();
};

window.escanearQr = function(id) {
    var q = qrCodes.find(function(x) { return x.id === id; });
    if (q) {
        q.escaneados = (q.escaneados || 0) + 1;
        salvar();
        atualizarKPIs();
        renderizarQrs();
        window.open(q.url, '_blank');
    }
};

function limparForm() {
    editandoId = null;
    document.getElementById('qrId').value = '';
    document.getElementById('nomeQr').value = '';
    document.getElementById('urlQr').value = '';
    document.getElementById('descricaoQr').value = '';
    document.getElementById('tipoQr').value = 'Link';
    document.getElementById('statusQr').value = 'ativo';
    document.querySelector('.card h3').textContent = '📝 Novo QR Code';
}

// ============================================================
// CONTROLE DE PERFIL
// ============================================================
var perfil = sessionStorage.getItem('amovin_perfil') || 'admin';
var modulosPermitidos = {
    admin: ['dashboard','bi','capta','sala-espera','pre-cadastro','financeiro','orcamentos','prestacao-contas','pessoas','profissionais','voluntarios','agenda-telefonica','agenda','documentos','qrcodes','notas-fiscais','estoque','patrimonio','biblioteca','certificados','chat','assistente','relatorios','configuracoes','backup'],
    recepcao: ['dashboard','pessoas','agenda-telefonica','agenda','documentos'],
    consulta: ['dashboard','agenda','agenda-telefonica','assistente'],
    financeiro: ['dashboard','financeiro','orcamentos','prestacao-contas','relatorios'],
    voluntario: ['dashboard','agenda','voluntarios','agenda-telefonica']
};

var permitidos = modulosPermitidos[perfil] || modulosPermitidos.admin;
document.querySelectorAll('.nav-item').forEach(function(item) {
    var href = item.getAttribute('href') || '';
    var pagina = href.replace('.html', '');
    pagina = pagina.split('?')[0].split('#')[0];
    if (pagina && permitidos.indexOf(pagina) === -1 && pagina !== 'dashboard' && pagina !== '') {
        item.style.display = 'none';
    }
});

if (!sessionStorage.getItem('amovin_logado')) { window.location.href = 'index.html'; }

atualizarKPIs();
renderizarQrs();
</script>
</body>
</html>
