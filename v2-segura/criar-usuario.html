<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMOVIN - Criar Usuário Teste</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        h2 { color: #4a148c; }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }
        .btn:hover { background: #5a6fd6; }
        .resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
        }
        .sucesso { background: #e8f5e9; color: #2e7d32; }
        .erro { background: #ffebee; color: #c62828; }
        .info { background: #e3f2fd; color: #1565c0; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔑 Criar Usuário de Teste</h2>
        <p>Clique no botão abaixo para criar o usuário:</p>
        
        <p><strong>Email:</strong> teste@amovin.org.br</p>
        <p><strong>Senha:</strong> Amovin2024@</p>
        
        <button class="btn" onclick="criarUsuario()">Criar Usuário</button>
        
        <div id="resultado"></div>
        <hr style="margin: 20px 0;">
        <p style="font-size: 12px; color: #999;">
            Depois de criado, acesse:<br>
            <strong>index.html</strong> para fazer login
        </p>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDu5663V7pAamG2lzjD1i2CNTKh6uPZO3U",
            authDomain: "amovin-oficios-teste.firebaseapp.com",
            projectId: "amovin-oficios-teste",
            storageBucket: "amovin-oficios-teste.firebasestorage.app",
            messagingSenderId: "901387183295",
            appId: "1:901387183295:web:b9a445cbe259d1c14c120a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.criarUsuario = async function() {
            const resultado = document.getElementById('resultado');
            resultado.innerHTML = '<div class="info">⏳ Criando usuário...</div>';
            
            try {
                await createUserWithEmailAndPassword(auth, 'teste@amovin.org.br', 'Amovin2024@');
                resultado.innerHTML = `
                    <div class="sucesso">
                        ✅ Usuário criado com sucesso!<br><br>
                        📧 Email: teste@amovin.org.br<br>
                        🔒 Senha: Amovin2024@<br><br>
                        <a href="index.html">Ir para Login</a>
                    </div>
                `;
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    resultado.innerHTML = `
                        <div class="sucesso">
                            ✅ Usuário já existe!<br><br>
                            📧 Email: teste@amovin.org.br<br>
                            🔒 Senha: Amovin2024@<br><br>
                            <a href="index.html">Ir para Login</a>
                        </div>
                    `;
                } else {
                    resultado.innerHTML = `
                        <div class="erro">
                            ❌ Erro: ${error.message}<br><br>
                            Tente novamente.
                        </div>
                    `;
                }
            }
        };
    </script>
</body>
</html>
