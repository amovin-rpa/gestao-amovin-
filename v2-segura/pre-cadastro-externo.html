<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pré-Cadastro • AMOVIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --laranja: #C65A11;
            --laranja-escuro: #A04A0E;
            --verde: #57C220;
            --azul: #1E88E5;
            --grafite: #1A1A1A;
            --cinza: #6B7280;
            --cinza-claro: #F8F4ED;
            --branco: #FFFFFF;
            --vermelho: #E53935;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0D0D0D 0%, #1A1A1A 40%, #2D2D2D 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background: var(--branco);
            border-radius: 20px;
            padding: 40px 36px 32px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo img {
            width: 80px;
            height: auto;
            margin-bottom: 8px;
        }
        .logo h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--grafite);
        }
        .logo h1 span {
            color: var(--laranja);
        }
        .logo p {
            font-size: 13px;
            color: var(--cinza);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--cinza);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #E5E0D8;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: border 0.2s;
            background: #FAFAFA;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--laranja);
            background: var(--branco);
            box-shadow: 0 0 0 3px rgba(198, 90, 17, 0.08);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-enviar {
            width: 100%;
            padding: 16px;
            background: var(--laranja);
            color: var(--branco);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 24px rgba(198, 90, 17, 0.25);
        }
        .btn-enviar:hover {
            background: var(--laranja-escuro);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(198, 90, 17, 0.35);
        }
        .btn-enviar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .mensagem {
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .mensagem.sucesso {
            display: block;
            background: #E8F5E9;
            border: 1px solid #A5D6A7;
            color: #2E7D32;
        }
        .mensagem.erro {
            display: block;
            background: #FFEBEE;
            border: 1px solid #EF9A9A;
            color: #C62828;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #F0E9DF;
            font-size: 11px;
            color: var(--cinza);
        }
        .footer a {
            color: var(--laranja);
            text-decoration: none;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.25);
            border-top-color: var(--branco);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-enviar.loading .spinner {
            display: block;
        }
        .btn-enviar.loading .btn-text {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 18px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .logo h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <img src="images/amovin-logo.png" alt="AMOVIN" onerror="this.style.display='none';">
            <h1>AMOVIN <span>Pré-Cadastro</span></h1>
            <p>Associação e Movimento pela Inclusão</p>
        </div>

        <div id="mensagem" class="mensagem"></div>

        <form id="formPreCadastro" novalidate>
            <div class="form-group">
                <label>Nome Completo *</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" id="telefone" placeholder="(34) 99999-9999">
                </div>
                <div class="form-group">
                    <label>Data de Nascimento</label>
                    <input type="date" id="nascimento">
                </div>
            </div>

            <div class="form-group">
                <label>Qual seu interesse?</label>
                <select id="interesse">
                    <option value="Voluntário">💪 Ser Voluntário</option>
                    <option value="Beneficiário">👥 Ser Beneficiário</option>
                    <option value="Profissional">👨‍⚕️ Atuar como Profissional</option>
                    <option value="Doador">🤝 Ser Doador</option>
                    <option value="Parceiro">🏢 Ser Parceiro</option>
                    <option value="Outro">📌 Outro</option>
                </select>
            </div>

            <div class="form-group">
                <label>Como conheceu a AMOVIN?</label>
                <select id="origem">
                    <option value="Redes Sociais">📱 Redes Sociais</option>
                    <option value="Indicação">👥 Indicação</option>
                    <option value="Site">🌐 Site</option>
                    <option value="Evento">📅 Evento</option>
                    <option value="Imprensa">📰 Imprensa</option>
                    <option value="Outro">📌 Outro</option>
                </select>
            </div>

            <div class="form-group">
                <label>Mensagem ou Observações</label>
                <textarea id="obs" rows="3" placeholder="Deixe sua mensagem..."></textarea>
            </div>

            <div style="margin-bottom:16px;font-size:12px;color:var(--cinza);display:flex;align-items:flex-start;gap:8px;">
                <input type="checkbox" id="lgpd" style="width:16px;height:16px;margin-top:2px;accent-color:var(--laranja);">
                <label for="lgpd">Concordo com a <strong>Política de Privacidade</strong> e autorizo o tratamento dos meus dados conforme a LGPD.</label>
            </div>

            <button type="submit" class="btn-enviar" id="btnEnviar">
                <span class="spinner"></span>
                <span class="btn-text">📤 Enviar Pré-Cadastro</span>
            </button>
        </form>

        <div class="footer">
            © 2026 <a href="https://www.vigorre.com.br">VIGORRE DESIGNER™</a> • v2.0
        </div>
    </div>

    <script>
        // ============================================================
        // FORMULÁRIO PÚBLICO DE PRÉ-CADASTRO
        // ============================================================
        document.getElementById('formPreCadastro').addEventListener('submit', function(e) {
            e.preventDefault();

            var nome = document.getElementById('nome').value.trim();
            var email = document.getElementById('email').value.trim();
            var lgpd = document.getElementById('lgpd').checked;
            var mensagem = document.getElementById('mensagem');

            if (!nome) {
                mostrarMensagem('⚠️ Preencha seu nome completo.', 'erro');
                return;
            }
            if (!email) {
                mostrarMensagem('⚠️ Preencha seu email.', 'erro');
                return;
            }
            if (!email.includes('@')) {
                mostrarMensagem('⚠️ Digite um email válido.', 'erro');
                return;
            }
            if (!lgpd) {
                mostrarMensagem('⚠️ Você precisa concordar com a Política de Privacidade.', 'erro');
                return;
            }

            // Coleta dados
            var dados = {
                nome: nome,
                email: email,
                telefone: document.getElementById('telefone').value.trim(),
                nascimento: document.getElementById('nascimento').value,
                interesse: document.getElementById('interesse').value,
                origem: document.getElementById('origem').value,
                obs: document.getElementById('obs').value.trim(),
                dataEnvio: new Date().toISOString(),
                status: 'pendente',
                origemCadastro: 'externo'
            };

            // Envia para o localStorage
            enviarPreCadastro(dados);
        });

        function enviarPreCadastro(dados) {
            var btn = document.getElementById('btnEnviar');
            var mensagem = document.getElementById('mensagem');

            btn.classList.add('loading');
            btn.disabled = true;

            // Simula envio com delay
            setTimeout(function() {
                try {
                    // Busca pré-cadastros existentes
                    var preCadastros = JSON.parse(localStorage.getItem('amovin_pre_cadastros') || '[]');

                    // Verifica duplicidade de email
                    var existe = preCadastros.some(function(p) {
                        return p.email === dados.email;
                    });

                    if (existe) {
                        mostrarMensagem('⚠️ Este email já está cadastrado. Entre em contato conosco.', 'erro');
                        btn.classList.remove('loading');
                        btn.disabled = false;
                        return;
                    }

                    // Adiciona novo
                    dados.id = Date.now();
                    dados.dataCriacao = new Date().toISOString();
                    preCadastros.push(dados);

                    // Salva
                    localStorage.setItem('amovin_pre_cadastros', JSON.stringify(preCadastros));

                    // 🔥 Tenta salvar também no Supabase (se configurado)
                    tentarSalvarSupabase(dados);

                    mostrarMensagem('✅ Pré-cadastro enviado com sucesso! Em breve entraremos em contato.', 'sucesso');

                    // Limpa formulário
                    document.getElementById('formPreCadastro').reset();

                } catch (err) {
                    mostrarMensagem('❌ Erro ao enviar. Tente novamente mais tarde.', 'erro');
                    console.error(err);
                }

                btn.classList.remove('loading');
                btn.disabled = false;
            }, 1500);
        }

        function mostrarMensagem(texto, tipo) {
            var el = document.getElementById('mensagem');
            el.textContent = texto;
            el.className = 'mensagem ' + tipo;
        }

        // ============================================================
        // SUPABASE (opcional - se estiver configurado)
        // ============================================================
        function tentarSalvarSupabase(dados) {
            try {
                if (typeof supabase !== 'undefined' && supabase) {
                    supabase
                        .from('pre_cadastros')
                        .insert([{
                            nome: dados.nome,
                            email: dados.email,
                            telefone: dados.telefone,
                            nascimento: dados.nascimento,
                            interesse: dados.interesse,
                            origem: dados.origem,
                            obs: dados.obs,
                            status: 'pendente'
                        }])
                        .then(function(result) {
                            console.log('✅ Salvo no Supabase:', result);
                        })
                        .catch(function(err) {
                            console.warn('⚠️ Erro ao salvar no Supabase:', err);
                        });
                }
            } catch (e) {
                console.warn('⚠️ Supabase não disponível:', e);
            }
        }
    </script>

</body>
</html>
