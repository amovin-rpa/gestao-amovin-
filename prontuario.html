<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Prontuario</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; }
        .topo { background: #b71c1c; color: white; padding: 15px 25px; }
        .topo a { color: white; text-decoration: none; margin-left: 15px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; margin: 3px; }
        .btn-vermelho { background: #d32f2f; color: white; }
        .btn-verde { background: #4caf50; color: white; }
        .btn-amarelo { background: #ffc107; color: #333; }
        .btn-azul { background: #2196f3; color: white; }
        .btn-cinza { background: #666; color: white; }
        .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 20px; }
        .card h3 { color: #b71c1c; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .info-paciente { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 20px; }
        .foto { width: 80px; height: 100px; border: 2px solid #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #aaa; overflow: hidden; background: #f5f5f5; flex-shrink: 0; }
        .foto img { width: 100%; height: 100%; object-fit: cover; }
        .dados { flex: 1; }
        .dados h2 { margin: 0 0 5px 0; font-size: 20px; }
        .dados p { margin: 3px 0; color: #666; font-size: 13px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; font-size: 12px; margin-bottom: 3px; color: #444; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 13px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-principal { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: #f5f5f5; padding: 8px; text-align: left; font-weight: bold; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; }
        .modal-box { background: white; padding: 30px; border-radius: 15px; width: 500px; margin: 30px auto; max-height: 80vh; overflow-y: auto; }
        .sem-dados { text-align: center; color: #bbb; padding: 40px; }
        .btn-voltar { background: #666; color: white; padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
        @media (max-width: 768px) { .grid-principal { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="topo">
    <strong>Prontuario Medico</strong>
    <span><a href="dashboard.html">Dashboard</a> <a href="pessoas.html">Pessoas</a> <a href="index.html">Sair</a></span>
</div>

<div class="container">
    <button class="btn-voltar" onclick="window.location.href='pessoas.html'">Voltar para Pessoas</button>

    <div id="conteudoProntuario">
        <div class="info-paciente">
            <div class="foto" id="fotoPaciente">3x4</div>
            <div class="dados">
                <h2 id="nomePaciente"></h2>
                <p id="infoPaciente"></p>
                <p id="contatoPaciente"></p>
            </div>
        </div>

        <div class="grid-principal">
            <div class="card">
                <h3>Dados Clinicos</h3>
                <div id="modoLeitura"></div>
                <div id="modoEdicao" style="display:none;">
                    <div class="form-row">
                        <div class="form-group"><label>Peso (kg)</label><input type="text" id="peso"></div>
                        <div class="form-group"><label>Altura (cm)</label><input type="text" id="altura"></div>
                    </div>
                    <div class="form-group"><label>Medicamentos em uso</label><input type="text" id="medicamentos"></div>
                    <div class="form-group"><label>Historia Clinica</label><textarea id="historiaClinica" rows="4"></textarea></div>
                    <div class="form-group"><label>Queixa Principal</label><textarea id="queixaPrincipal" rows="3"></textarea></div>
                    <div class="form-group"><label>HMP/HMA</label><textarea id="hmpHma" rows="3"></textarea></div>
                    <div class="form-row">
                        <div class="form-group"><label>Restricao Alimentar</label><input type="text" id="restricao"></div>
                        <div class="form-group"><label>Cirurgias</label><input type="text" id="cirurgias"></div>
                    </div>
                    <div class="form-group"><label>Saude Geral</label><textarea id="saudeGeral" rows="3"></textarea></div>
                    <button class="btn btn-verde" onclick="salvarProntuario()">Salvar</button>
                    <button class="btn btn-cinza" onclick="cancelarEdicao()">Cancelar</button>
                </div>
                <div style="margin-top:15px;">
                    <button class="btn btn-amarelo" onclick="habilitarEdicao()">Editar</button>
                    <button class="btn btn-azul" onclick="abrirEvolucao()">Nova Evolucao</button>
                    <button class="btn btn-vermelho" onclick="imprimir()">Imprimir</button>
                </div>
            </div>

            <div class="card">
                <h3>Evolucoes</h3>
                <div id="evolucoesLista"><div class="sem-dados">Nenhuma evolucao registrada.</div></div>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="modalEvolucao">
    <div class="modal-box">
        <h3>Nova Evolucao</h3>
        <div class="form-group"><label>Data e Hora</label><input type="datetime-local" id="evoDataHora"></div>
        <div class="form-group"><label>Atividades Realizadas</label><textarea id="evoAtividades" rows="3"></textarea></div>
        <div class="form-group"><label>Desempenho do Dia</label><textarea id="evoDesempenho" rows="3"></textarea></div>
        <div class="form-group"><label>Planejamento</label><textarea id="evoPlanejamento" rows="3"></textarea></div>
        <button class="btn btn-verde" onclick="salvarEvolucao()">Registrar Evolucao</button>
        <button class="btn btn-cinza" onclick="document.getElementById('modalEvolucao').style.display='none'">Cancelar</button>
    </div>
</div>

<script>
var beneficiarios = JSON.parse(localStorage.getItem('amovin_beneficiarios') || '[]');
var prontuarios = JSON.parse(localStorage.getItem('amovin_prontuarios') || '{}');
var beneficiarioAtual = null;
var prontuarioAtual = null;

// Pegar ID da URL
function getParametro(nome) {
    var url = window.location.search;
    nome = nome.replace(/[\[\]]/g, '\\$&');
    var regex = new RegExp('[?&]' + nome + '(=([^&#]*)|&|#|$)');
    var results = regex.exec(url);
    if (!results) return null;
    if (!results[2]) return '';
    return decodeURIComponent(results[2].replace(/\+/g, ' '));
}

function carregarBeneficiario(id) {
    for (var i = 0; i < beneficiarios.length; i++) {
        if (beneficiarios[i].id == id) { beneficiarioAtual = beneficiarios[i]; break; }
    }
    if (!beneficiarioAtual) return;
    
    if (!prontuarios[id]) {
        prontuarios[id] = { peso:'', altura:'', medicamentos:'', historiaClinica:'', queixaPrincipal:'', hmpHma:'', restricao:'', cirurgias:'', saudeGeral:'', evolucoes:[] };
        salvarProntuarios();
    }
    prontuarioAtual = prontuarios[id];
    
    document.getElementById('fotoPaciente').innerHTML = beneficiarioAtual.foto ? '<img src="'+beneficiarioAtual.foto+'" alt="">' : '3x4';
    document.getElementById('nomePaciente').textContent = beneficiarioAtual.nome;
    document.getElementById('infoPaciente').textContent = (beneficiarioAtual.diagnostico||'Sem diagnostico') + ' | CID: ' + (beneficiarioAtual.cid||'-') + ' | Idade: ' + (beneficiarioAtual.idade||'-');
    document.getElementById('contatoPaciente').textContent = 'Resp: ' + (beneficiarioAtual.respNome||'-') + ' | Tel: ' + (beneficiarioAtual.respFone||beneficiarioAtual.telefone||'-');
    renderizarLeitura();
    renderizarEvolucoes();
    cancelarEdicao();
}

function salvarProntuarios() { localStorage.setItem('amovin_prontuarios', JSON.stringify(prontuarios)); }

function renderizarLeitura() {
    var p = prontuarioAtual;
    var html = '';
    html += '<p><strong>Peso:</strong> ' + (p.peso||'-') + ' kg | <strong>Altura:</strong> ' + (p.altura||'-') + ' cm</p>';
    html += '<p><strong>Medicamentos:</strong> ' + (p.medicamentos||'-') + '</p>';
    html += '<p><strong>Historia Clinica:</strong> ' + (p.historiaClinica||'-') + '</p>';
    html += '<p><strong>Queixa Principal:</strong> ' + (p.queixaPrincipal||'-') + '</p>';
    html += '<p><strong>HMP/HMA:</strong> ' + (p.hmpHma||'-') + '</p>';
    html += '<p><strong>Restricao Alimentar:</strong> ' + (p.restricao||'-') + ' | <strong>Cirurgias:</strong> ' + (p.cirurgias||'-') + '</p>';
    html += '<p><strong>Saude Geral:</strong> ' + (p.saudeGeral||'-') + '</p>';
    document.getElementById('modoLeitura').innerHTML = html;
}

function renderizarEvolucoes() {
    var evos = prontuarioAtual.evolucoes || [];
    var container = document.getElementById('evolucoesLista');
    if (evos.length === 0) { container.innerHTML = '<div class="sem-dados">Nenhuma evolucao registrada.</div>'; return; }
    var html = '<table><tr><th>Data/Hora</th><th>Atividades</th><th>Desempenho</th><th>Planejamento</th></tr>';
    for (var i = 0; i < evos.length; i++) {
        var e = evos[i];
        html += '<tr><td>' + (e.dateTime ? new Date(e.dateTime).toLocaleString('pt-BR') : '-') + '</td><td>' + e.activities + '</td><td>' + e.performance + '</td><td>' + e.planning + '</td></tr>';
    }
    html += '</table>';
    container.innerHTML = html;
}

window.habilitarEdicao = function() {
    document.getElementById('modoLeitura').style.display = 'none';
    document.getElementById('modoEdicao').style.display = 'block';
    var p = prontuarioAtual;
    document.getElementById('peso').value = p.peso || '';
    document.getElementById('altura').value = p.altura || '';
    document.getElementById('medicamentos').value = p.medicamentos || '';
    document.getElementById('historiaClinica').value = p.historiaClinica || '';
    document.getElementById('queixaPrincipal').value = p.queixaPrincipal || '';
    document.getElementById('hmpHma').value = p.hmpHma || '';
    document.getElementById('restricao').value = p.restricao || '';
    document.getElementById('cirurgias').value = p.cirurgias || '';
    document.getElementById('saudeGeral').value = p.saudeGeral || '';
};

window.cancelarEdicao = function() {
    document.getElementById('modoLeitura').style.display = 'block';
    document.getElementById('modoEdicao').style.display = 'none';
};

window.salvarProntuario = function() {
    prontuarioAtual.peso = document.getElementById('peso').value;
    prontuarioAtual.altura = document.getElementById('altura').value;
    prontuarioAtual.medicamentos = document.getElementById('medicamentos').value;
    prontuarioAtual.historiaClinica = document.getElementById('historiaClinica').value;
    prontuarioAtual.queixaPrincipal = document.getElementById('queixaPrincipal').value;
    prontuarioAtual.hmpHma = document.getElementById('hmpHma').value;
    prontuarioAtual.restricao = document.getElementById('restricao').value;
    prontuarioAtual.cirurgias = document.getElementById('cirurgias').value;
    prontuarioAtual.saudeGeral = document.getElementById('saudeGeral').value;
    salvarProntuarios();
    renderizarLeitura();
    cancelarEdicao();
    alert('Prontuario salvo!');
};

window.abrirEvolucao = function() {
    document.getElementById('modalEvolucao').style.display = 'block';
    document.getElementById('evoDataHora').value = new Date().toISOString().slice(0,16);
    document.getElementById('evoAtividades').value = '';
    document.getElementById('evoDesempenho').value = '';
    document.getElementById('evoPlanejamento').value = '';
};

window.salvarEvolucao = function() {
    var evo = {
        dateTime: document.getElementById('evoDataHora').value,
        activities: document.getElementById('evoAtividades').value,
        performance: document.getElementById('evoDesempenho').value,
        planning: document.getElementById('evoPlanejamento').value
    };
    if (!evo.dateTime && !evo.activities) { alert('Preencha os dados!'); return; }
    prontuarioAtual.evolucoes.push(evo);
    salvarProntuarios();
    renderizarEvolucoes();
    document.getElementById('modalEvolucao').style.display = 'none';
    alert('Evolucao registrada!');
};

window.imprimir = function() {
    var b = beneficiarioAtual;
    var p = prontuarioAtual;
    var w = window.open('','_blank');
    var html = '<html><head><title>Prontuario</title><style>body{font-family:Arial;padding:20px;max-width:700px;margin:0 auto}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px}</style></head><body>';
    html += '<h1>AMOVIN - Prontuario</h1>';
    html += '<p><strong>Paciente:</strong> ' + b.nome + '</p>';
    html += '<p><strong>Diagnostico:</strong> ' + (b.diagnostico||'-') + ' | CID: ' + (b.cid||'-') + '</p>';
    html += '<p><strong>Peso:</strong> ' + (p.peso||'-') + ' kg | <strong>Altura:</strong> ' + (p.altura||'-') + ' cm</p>';
    html += '<p><strong>Historia Clinica:</strong> ' + (p.historiaClinica||'-') + '</p>';
    html += '<h2>Evolucoes</h2><table><tr><th>Data/Hora</th><th>Atividades</th><th>Desempenho</th><th>Planejamento</th></tr>';
    var evos = p.evolucoes || [];
    for (var i = 0; i < evos.length; i++) {
        html += '<tr><td>' + (evos[i].dateTime?new Date(evos[i].dateTime).toLocaleString('pt-BR'):'-') + '</td><td>' + evos[i].activities + '</td><td>' + evos[i].performance + '</td><td>' + evos[i].planning + '</td></tr>';
    }
    html += '</table>';
    html += '<p style="text-align:center;margin-top:30px;font-size:11px;color:#888;">Impresso por: ' + (sessionStorage.getItem('amovin_nome')||'Usuario') + ' em ' + new Date().toLocaleString('pt-BR') + '</p>';
    html += '<script>window.onload=function(){window.print()}<\/script></body></html>';
    w.document.write(html);
    w.document.close();
};

// Carregar beneficiario da URL
var idBenef = getParametro('id');
if (idBenef) {
    carregarBeneficiario(idBenef);
}
</script>
</body>
</html>
